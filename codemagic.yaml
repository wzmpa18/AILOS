workflows:
  default:
    name: Android Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: android-shell

    environment:
      groups:
        - default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Decode and Convert Keystore
        script: |-
          #!/bin/bash
          set -e

          echo "=== Java Version ==="
          java -version 2>&1
          echo ""

          echo "=== Step 1: Decode base64 keystore via Python3 ==="
          python3 -c "
          import base64, os, sys, hashlib
          b64 = os.environ.get('KEYSTORE_BASE64', '')
          if not b64:
              print('FATAL: KEYSTORE_BASE64 is empty')
              sys.exit(1)
          b64_clean = ''.join(b64.split())
          print(f'Base64 raw length: {len(b64)}')
          print(f'Base64 cleaned length: {len(b64_clean)}')
          if len(b64_clean) % 4 != 0:
              pad = 4 - (len(b64_clean) % 4)
              b64_clean += '=' * pad
              print(f'WARNING: Added {pad} padding chars')
          try:
              data = base64.b64decode(b64_clean, validate=True)
              print(f'Decoded size (strict): {len(data)} bytes')
          except Exception as e:
              print(f'Strict decode failed: {e}')
              data = base64.b64decode(b64_clean)
              print(f'Decoded size (lenient): {len(data)} bytes')
          with open('/tmp/yandao-original.keystore', 'wb') as f:
              f.write(data)
          sha256 = hashlib.sha256(data).hexdigest()
          print(f'SHA256: {sha256}')
          actual_size = os.path.getsize('/tmp/yandao-original.keystore')
          print(f'File size on disk: {actual_size} bytes')
          if actual_size < 1000:
              print('FATAL: keystore file too small!')
              sys.exit(1)
          with open('/tmp/yandao-original.keystore', 'rb') as f:
              header = f.read(4)
              hex_str = ' '.join(f'{b:02x}' for b in header)
              print(f'File header (hex): {hex_str}')
              if header[:4] == b'\xfe\xed\xfe\xed':
                  print('Format detected: JKS')
              elif header[0] == 0x30:
                  print('Format detected: PKCS12 (ASN.1)')
              else:
                  print('Format detected: Unknown')
          "

          echo ""
          echo "=== Step 2: Extract key+cert via OpenSSL (bypasses Java algorithm restrictions) ==="
          STORE_PASS="$KEYSTORE_PASSWORD"
          KEY_ALIAS_VAL="$KEY_ALIAS"
          KEY_PASS="$KEY_PASSWORD"
          echo "Store password length: ${#STORE_PASS}"
          echo "Key alias: $KEY_ALIAS_VAL"
          echo "Key password length: ${#KEY_PASS}"

          OPENSSL_OK=0
          if openssl pkcs12 -in /tmp/yandao-original.keystore -nodes -passin pass:"$STORE_PASS" -out /tmp/yandao-key-cert.pem 2>&1; then
            if [ -s /tmp/yandao-key-cert.pem ]; then
              echo "OpenSSL extraction: PASS"
              echo "Private keys found: $(grep -c 'BEGIN PRIVATE KEY' /tmp/yandao-key-cert.pem || true)"
              echo "Certificates found: $(grep -c 'BEGIN CERTIFICATE' /tmp/yandao-key-cert.pem || true)"
              OPENSSL_OK=1
            fi
          fi

          if [ "$OPENSSL_OK" -eq 0 ]; then
            echo ""
            echo "=== OpenSSL failed, trying keytool with security override (JKS fallback) ==="
            printf '%s\n' \
              'jdk.certpath.disabledAlgorithms=' \
              'jdk.tls.disabledAlgorithms=' \
              'jdk.jar.disabledAlgorithms=' \
              'jdk.pkcs12.keyProtectionAlgorithm=' \
              'jdk.pkcs12.certProtectionAlgorithm=' \
              'jdk.pkcs12.macAlgorithm=' \
              > /tmp/java.security.override
            export JAVA_TOOL_OPTIONS="-Djava.security.properties=/tmp/java.security.override"

            keytool -importkeystore \
              -srckeystore /tmp/yandao-original.keystore \
              -srcstorepass "$STORE_PASS" \
              -srcstoretype jks \
              -destkeystore /tmp/yandao-converted.p12 \
              -deststorepass "$STORE_PASS" \
              -deststoretype pkcs12 \
              -srcalias "$KEY_ALIAS_VAL" \
              -destalias "$KEY_ALIAS_VAL" 2>&1

            openssl pkcs12 -in /tmp/yandao-converted.p12 -nodes -passin pass:"$STORE_PASS" -out /tmp/yandao-key-cert.pem 2>&1
            echo "JKS to PKCS12 conversion + OpenSSL extraction: PASS"
            OPENSSL_OK=1
          fi

          if [ "$OPENSSL_OK" -eq 0 ]; then
            echo "FATAL: Cannot extract key/cert from keystore"
            echo "Hex dump (first 64 bytes):"
            xxd -l 64 /tmp/yandao-original.keystore 2>/dev/null || od -A x -t x1z -N 64 /tmp/yandao-original.keystore
            exit 1
          fi

          echo ""
          echo "=== Step 3: Create MODERN PKCS12 keystore (AES-256-CBC + SHA256) ==="
          openssl pkcs12 -export \
            -in /tmp/yandao-key-cert.pem \
            -out /tmp/yandao-release.keystore \
            -passout pass:"$STORE_PASS" \
            -name "$KEY_ALIAS_VAL" \
            -keypbe AES-256-CBC \
            -certpbe AES-256-CBC \
            -macalg SHA256 2>&1

          MODERN_SIZE=$(stat -f%z /tmp/yandao-release.keystore 2>/dev/null || stat -c%s /tmp/yandao-release.keystore 2>/dev/null)
          echo "Modern keystore created: $MODERN_SIZE bytes"

          echo ""
          echo "=== Step 4: Verify modern keystore with keytool (NO security override needed) ==="
          keytool -list -keystore /tmp/yandao-release.keystore -storepass "$STORE_PASS" -storetype pkcs12 2>&1

          echo ""
          echo "=== Step 5: Verify key alias exists ==="
          keytool -list -v -keystore /tmp/yandao-release.keystore -storepass "$STORE_PASS" -storetype pkcs12 2>&1 | grep -i "Alias name"

          echo ""
          echo "=== Step 6: Generate keystore.properties ==="
          printf 'storeFile=/tmp/yandao-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreType=pkcs12\n' \
            "$STORE_PASS" "$KEY_ALIAS_VAL" "$KEY_PASS" \
            > /tmp/keystore.properties
          echo "keystore.properties created (passwords masked):"
          sed 's/Password=.*/Password=***/' /tmp/keystore.properties

      - name: Config SDK Path
        script: |-
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Release APK
        script: |-
          echo "=== Building Release APK ==="
          echo "keystore.properties exists: $(test -f /tmp/keystore.properties && echo YES || echo NO)"
          echo "keystore file size: $(ls -la /tmp/yandao-release.keystore 2>/dev/null | awk '{print $5}' || echo 'NOT FOUND')"
          echo "Java version:"
          java -version 2>&1
          ./gradlew clean assembleRelease --stacktrace

      - name: Verify Signature
        script: |-
          echo "=== Verifying APK Signature ==="
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "FATAL: APK not found at $APK_PATH"
            ls -la app/build/outputs/apk/release/ 2>/dev/null || true
            exit 1
          fi
          echo "APK size: $(ls -la $APK_PATH | awk '{print $5}') bytes"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$APK_PATH"

    artifacts:
      - app/build/outputs/apk/release/*.apk