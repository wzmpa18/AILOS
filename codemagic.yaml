workflows:
  default:
    name: Android Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: android-shell

    environment:
      groups:
        - default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Env Check
        script: |
          echo "=== Build Env Check ==="
          java -version 2>&1
          echo "Java home: $JAVA_HOME"
          which keytool
          keytool -help 2>&1 | head -1
          echo "Working dir: $(pwd)"
          echo "KEYSTORE_BASE64 length: ${#KEYSTORE_BASE64}"
          echo "KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD}"
          echo "KEY_ALIAS: $KEY_ALIAS"
          echo "KEY_PASSWORD length: ${#KEY_PASSWORD}"

      - name: Decode Keystore
        script: |
          echo "=== Decoding keystore ==="
          echo "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 -d > /tmp/yandao-release.keystore
          FILE_SIZE=$(stat -f%z /tmp/yandao-release.keystore 2>/dev/null || stat -c%s /tmp/yandao-release.keystore 2>/dev/null || echo 0)
          echo "Keystore size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "FATAL: keystore too small, base64 decode failed"
            exit 1
          fi
          echo "=== File type ==="
          file /tmp/yandao-release.keystore
          echo "=== First 4 bytes (hex) ==="
          xxd -l 4 /tmp/yandao-release.keystore 2>/dev/null || od -A x -t x1z -N 4 /tmp/yandao-release.keystore
          echo "=== OpenSSL verification (alternative to keytool) ==="
          openssl pkcs12 -in /tmp/yandao-release.keystore -nokeys -passin pass:"$KEYSTORE_PASSWORD" 2>&1 | head -20
          if [ $? -eq 0 ]; then
            echo "OpenSSL: keystore verified OK"
          else
            echo "OpenSSL: verification failed (may still work with Gradle)"
          fi

      - name: Config SDK Path
        script: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Release APK
        script: |
          ./gradlew clean assembleRelease \
            -PYD_STORE_FILE=/tmp/yandao-release.keystore \
            -PYD_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PYD_KEY_ALIAS="$KEY_ALIAS" \
            -PYD_KEY_PASSWORD="$KEY_PASSWORD" \
            --stacktrace

      - name: Verify Signature
        script: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

    artifacts:
      - app/build/outputs/apk/release/*.apk