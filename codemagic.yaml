workflows:
  android-release:
    name: Android Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: android-shell

    environment:
      groups:
        - default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Env Check
        script: |
          echo "=== Build Env Check ==="
          java -version 2>&1
          echo "Working dir: $(pwd)"

      - name: Decode and Verify Keystore
        script: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 -d > /tmp/yandao-release.keystore
          FILE_SIZE=$(stat -f%z /tmp/yandao-release.keystore 2>/dev/null || stat -c%s /tmp/yandao-release.keystore 2>/dev/null || echo 0)
          echo "Keystore size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "ERROR: keystore too small, base64 decode may have failed"
            exit 1
          fi
          echo "=== Keystore Info ==="
          keytool -list -v -keystore /tmp/yandao-release.keystore -storepass "$KEYSTORE_PASSWORD" 2>&1 || echo "keytool check failed"

      - name: Config SDK Path
        script: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Release APK
        script: |
          export KEYSTORE_FILE=/tmp/yandao-release.keystore
          ./gradlew clean assembleRelease --stacktrace

      - name: Verify Signature
        script: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

    artifacts:
      - app/build/outputs/apk/release/*.apk
