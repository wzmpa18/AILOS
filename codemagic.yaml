workflows:
  default:
    name: Android Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: android-shell

    environment:
      groups:
        - default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Env Check
        script: |
          echo "=== Build Env Check ==="
          java -version 2>&1
          echo "Working dir: $(pwd)"
          echo "KEYSTORE_BASE64 length: ${#KEYSTORE_BASE64}"
          echo "KEYSTORE_PASSWORD set: $([ -n "$KEYSTORE_PASSWORD" ] && echo YES || echo NO)"
          echo "KEY_ALIAS set: $([ -n "$KEY_ALIAS" ] && echo YES || echo NO)"
          echo "KEY_PASSWORD set: $([ -n "$KEY_PASSWORD" ] && echo YES || echo NO)"

      - name: Decode and Verify Keystore
        script: |
          echo "=== Decoding keystore ==="
          echo "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 -d > /tmp/yandao-release.keystore
          FILE_SIZE=$(stat -f%z /tmp/yandao-release.keystore 2>/dev/null || stat -c%s /tmp/yandao-release.keystore 2>/dev/null || echo 0)
          echo "Keystore size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "FATAL: keystore too small, base64 decode failed"
            exit 1
          fi

          echo "=== File type detection ==="
          file /tmp/yandao-release.keystore
          echo "=== First 32 bytes (hex) ==="
          xxd -l 32 /tmp/yandao-release.keystore 2>/dev/null || od -A x -t x1z -N 32 /tmp/yandao-release.keystore

          echo "=== Trying keytool WITHOUT storetype (auto-detect) ==="
          keytool -list -keystore /tmp/yandao-release.keystore -storepass "$KEYSTORE_PASSWORD" 2>&1
          KT_RESULT=$?
          if [ $KT_RESULT -ne 0 ]; then
            echo "Auto-detect failed, trying JKS format..."
            keytool -list -keystore /tmp/yandao-release.keystore -storepass "$KEYSTORE_PASSWORD" -storetype JKS 2>&1
            if [ $? -ne 0 ]; then
              echo "JKS also failed, trying PKCS12 format..."
              keytool -list -keystore /tmp/yandao-release.keystore -storepass "$KEYSTORE_PASSWORD" -storetype PKCS12 2>&1
              if [ $? -ne 0 ]; then
                echo "FATAL: Cannot open keystore with any format"
                exit 1
              fi
            fi
          fi

          echo "=== Keystore opened successfully, listing all aliases ==="
          keytool -list -keystore /tmp/yandao-release.keystore -storepass "$KEYSTORE_PASSWORD" 2>&1

          echo "=== Verifying key alias and key password ==="
          keytool -list -v -keystore /tmp/yandao-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" 2>&1
          if [ $? -ne 0 ]; then
            echo "WARNING: Cannot read key alias '$KEY_ALIAS' with provided key password"
            echo "Trying with store password as key password..."
            keytool -list -v -keystore /tmp/yandao-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEYSTORE_PASSWORD" 2>&1
            if [ $? -ne 0 ]; then
              echo "FATAL: Cannot read key alias '$KEY_ALIAS' with any password"
              exit 1
            fi
          fi
          echo "=== Keystore verification PASSED ==="

      - name: Config SDK Path
        script: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Release APK
        script: |
          ./gradlew clean assembleRelease \
            -PYD_STORE_FILE=/tmp/yandao-release.keystore \
            -PYD_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PYD_KEY_ALIAS="$KEY_ALIAS" \
            -PYD_KEY_PASSWORD="$KEY_PASSWORD" \
            --stacktrace

      - name: Verify Signature
        script: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

    artifacts:
      - app/build/outputs/apk/release/*.apk