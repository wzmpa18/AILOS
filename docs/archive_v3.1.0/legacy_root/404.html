<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#4F46E5">
<title>AILOS - 页面未找到</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #4F46E5;
    --primary-hover: #4338CA;
    --primary-light: #EEF2FF;
    --bg: #F8FAFC;
    --card-bg: #FFFFFF;
    --text: #1E293B;
    --text-secondary: #64748B;
    --text-muted: #94A3B8;
    --border: #E2E8F0;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 24px rgba(0,0,0,.04);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Noto Sans JP', 'Noto Sans KR', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    line-height: 1.6;
  }
  .container {
    text-align: center; width: 100%; max-width: 420px;
  }

  .error-num {
    font-size: 120px; font-weight: 900; color: var(--primary);
    line-height: 1; margin-bottom: 8px;
    letter-spacing: -4px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .error-icon {
    font-size: 56px; margin-bottom: 16px;
  }
  .error-title {
    font-size: 22px; font-weight: 700; margin-bottom: 8px; color: var(--text);
  }
  .error-desc {
    font-size: 14px; color: var(--text-secondary); margin-bottom: 32px; line-height: 1.7;
    padding: 0 10px;
  }

  .btn-home {
    display: inline-block; padding: 14px 40px; border-radius: var(--radius-sm);
    font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none;
    background: var(--primary); color: #fff; border: none;
    transition: background .2s, transform .2s;
  }
  .btn-home:hover { background: var(--primary-hover); transform: translateY(-1px); }

    display: flex; justify-content: center; gap: 4px; margin-bottom: 32px; flex-wrap: wrap;
  }
    padding: 4px 10px; border-radius: 20px; font-size: 12px; cursor: pointer;
    border: 1.5px solid transparent; transition: all .2s; color: var(--text-secondary);
    background: transparent;
  }

  .logo { margin-bottom: 24px; }
  .logo-text { font-size: 20px; font-weight: 800; color: var(--primary); }

  @media (max-width: 375px) {
    .error-num { font-size: 96px; }
    .error-icon { font-size: 40px; }
    .error-title { font-size: 18px; }
    .error-desc { font-size: 13px; }
    .btn-home { padding: 12px 32px; font-size: 14px; }
  }
</style>
<script src="/xuewaiyu/assets/devicefp.js"></script>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-text">AILOS</div>
  </div>


  <div class="error-num">404</div>
  <div class="error-icon">🔍</div>
  <div class="error-title" data-i18n="error_title">页面未找到</div>
  <div class="error-desc" data-i18n="error_desc">您访问的页面可能已被移动、删除或暂时不可用。请检查网址是否正确，或返回首页继续探索。</div>

  <a class="btn-home" href="/xuewaiyu/landing.html" data-i18n="btn_home">返回首页</a>
</div>

<script>
// ==================== GLOI i18n System ====================
const I18N = {
  zh: {
    error_title: '页面未找到',
    error_desc: '您访问的页面可能已被移动、删除或暂时不可用。请检查网址是否正确，或返回首页继续探索。',
    btn_home: '返回首页',
  },
  en: {
    error_title: 'Page Not Found',
    error_desc: 'The page you are looking for may have been moved, deleted, or is temporarily unavailable. Please check the URL or return to the homepage.',
    btn_home: 'Back to Home',
  },
  ja: {
    error_title: 'ページが見つかりません',
    error_desc: 'お探しのページは移動、削除、または一時的に利用できない可能性があります。URLをご確認いただくか、ホームページにお戻りください。',
    btn_home: 'ホームに戻る',
  },
  ko: {
    error_title: '페이지를 찾을 수 없습니다',
    error_desc: '찾으시는 페이지가 이동되었거나 삭제되었거나 일시적으로 사용할 수 없습니다. URL을 확인하시거나 홈페이지로 돌아가세요.',
    btn_home: '홈으로 돌아가기',
  },
  fr: {
    error_title: 'Page introuvable',
    error_desc: 'La page que vous recherchez a peut-être été déplacée, supprimée ou est temporairement indisponible. Veuillez vérifier l\'URL ou retourner à l\'accueil.',
    btn_home: 'Retour à l\'accueil',
  },
  es: {
    error_title: 'Página no encontrada',
    error_desc: 'La página que busca puede haber sido movida, eliminada o no estar disponible temporalmente. Verifique la URL o regrese a la página de inicio.',
    btn_home: 'Volver al inicio',
  },
  de: {
    error_title: 'Seite nicht gefunden',
    error_desc: 'Die gesuchte Seite wurde möglicherweise verschoben, gelöscht oder ist vorübergehend nicht verfügbar. Bitte überprüfen Sie die URL oder kehren Sie zur Startseite zurück.',
    btn_home: 'Zurück zur Startseite',
  },
};

// ==================== Language Detection ====================
const LANG_MAP = { 'zh-cn':'zh','zh-tw':'zh','zh-hk':'zh','zh':'zh', 'en':'en','en-us':'en','en-gb':'en', 'ja':'ja','jp':'ja', 'ko':'ko','kr':'ko', 'fr':'fr', 'es':'es', 'de':'de' };
const LANG_NAMES = { zh:'中文', en:'English', ja:'日本語', ko:'한국어', fr:'Français', es:'Español', de:'Deutsch' };

function detectLang() {
  try { const s = localStorage.getItem('yandao_ui_lang_v1'); if (s && I18N[s]) return s; } catch(e) {}
  const nav = (navigator.language || navigator.userLanguage || 'zh-CN').toLowerCase();
  return LANG_MAP[nav] || 'zh';
}

let currentLang = detectLang();
function t(key) { return (I18N[currentLang] && I18N[currentLang][key]) || (I18N['zh'] && I18N['zh'][key]) || key; }





function updateI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const text = t(key);
    if (text !== undefined) el.textContent = text;
  });
}

// ==================== Init ====================
updateI18n();
</script>
</body>
</html>
