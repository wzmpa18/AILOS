<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex,nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>运营管理后台 · 言道</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f6fa; color: #1f2937; }
  header { background: #1e293b; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  header .title { font-size: 16px; font-weight: 700; }
  header .ops button { margin-left: 8px; }
  .wrap { max-width: 1100px; margin: 16px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tabs button { border: 1px solid #d1d5db; background: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  .tabs button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  label { display: block; font-size: 13px; margin: 8px 0 4px; color: #374151; }
  input, textarea, select { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  button.primary { background: #2563eb; color: #fff; border: none; padding: 9px 16px; border-radius: 6px; cursor: pointer; }
  button.danger { background: #dc2626; color: #fff; border: none; padding: 9px 16px; border-radius: 6px; cursor: pointer; }
  button.ghost { background: #fff; border: 1px solid #d1d5db; padding: 9px 16px; border-radius: 6px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #e5e7eb; padding: 7px 8px; text-align: left; vertical-align: top; }
  th { background: #f9fafb; }
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; }
  .stat { display: inline-block; background: #eef2ff; color: #3730a3; border-radius: 6px; padding: 4px 8px; margin: 4px 4px 0 0; font-size: 13px; }
  .hidden { display: none !important; }
  .tag-ok { color: #16a34a; font-weight: 600; }
  .tag-bad { color: #dc2626; font-weight: 600; }
  #loginView { max-width: 380px; margin: 80px auto; }
  #toast { position: fixed; top: 16px; right: 16px; background: #111827; color: #fff; padding: 10px 14px; border-radius: 8px; display: none; z-index: 50; font-size: 13px; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 60; }
  .modal { background: #fff; padding: 20px; border-radius: 10px; width: 320px; }
  .detail { font-size: 12px; color: #475569; background: #f8fafc; padding: 6px 8px; border-radius: 6px; margin-top: 4px; }
  .before { color: #dc2626; } .after { color: #16a34a; }
  a.dl { color: #2563eb; }
</style>
</head>
<body>
  <div id="loginView" class="hidden">
    <div class="card">
      <div class="title" style="font-size:18px;font-weight:700;margin-bottom:12px;">运营管理后台登录</div>
      <label>管理员账号（手机 / 邮箱）</label>
      <input id="acc" placeholder="如 13480010005" />
      <label>密码</label>
      <input id="pwd" type="password" placeholder="登录密码" />
      <div style="margin-top:14px;"><button class="primary" id="loginBtn" style="width:100%;">登录</button></div>
      <div id="loginErr" style="color:#dc2626;font-size:13px;margin-top:8px;"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header>
      <div class="title">运营管理后台</div>
      <div class="ops">
        <button class="ghost" id="opPwdBtn">修改操作密码</button>
        <button class="ghost" id="logoutBtn">退出</button>
      </div>
    </header>
    <div class="wrap">
      <div class="tabs" id="tabs">
        <button data-tab="orders" class="active">订单查询/导出</button>
        <button data-tab="billing">用户时长管理</button>
        <button data-tab="abnormal">异常订单标记</button>
        <button data-tab="oplogs">操作日志</button>
        <button data-tab="loginlogs">登录审计</button>
        <button data-tab="users">用户管理</button>
      </div>
      <div id="mainView"></div>
    </div>
  </div>

  <div id="opModal" class="modal-mask">
    <div class="modal">
      <div style="font-weight:700;margin-bottom:10px;">敏感操作验证</div>
      <div id="opModalText" style="font-size:13px;color:#475569;margin-bottom:8px;"></div>
      <label>操作密码</label>
      <input id="opPwdInput" type="password" placeholder="请输入管理员操作密码" />
      <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end;">
        <button class="ghost" id="opCancel">取消</button>
        <button class="primary" id="opConfirm">确认</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
const API = '/api';
const TOKEN_KEY = 'ailos_admin_token';
let currentTab = 'orders';
let opResolve = null;

function getToken(){ return localStorage.getItem(TOKEN_KEY); }
function setToken(t){ localStorage.setItem(TOKEN_KEY, t); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); }

function toast(msg, isErr){
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  el.style.background = isErr ? '#b91c1c' : '#111827';
  setTimeout(()=>{ el.style.display='none'; }, 2600);
}

function deviceFp(){
  try {
    let fp = localStorage.getItem('admin_fp');
    if(!fp){ fp = 'fp_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('admin_fp', fp); }
    return fp;
  } catch(e){ return 'fp_fallback'; }
}

async function api(method, path, body){
  const headers = { 'Content-Type': 'application/json', 'X-Device-Fp': deviceFp() };
  const tk = getToken();
  if(tk) headers['Authorization'] = 'Bearer ' + tk;
  const opt = { method, headers };
  if(body) opt.body = JSON.stringify(body);
  const r = await fetch(API + path, opt);
  if(r.status === 401){
    // 登录失效自动跳转登录页
    toast('登录已失效，请重新登录', true);
    showLogin();
    throw new Error('UNAUTH');
  }
  const ct = r.headers.get('content-type') || '';
  if(ct.includes('application/json')){
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r;
}

// 操作密码弹窗，返回 Promise<string>
function askOpPassword(text){
  return new Promise((resolve)=>{
    opResolve = resolve;
    document.getElementById('opModalText').textContent = text || '此操作需输入管理员操作密码';
    document.getElementById('opPwdInput').value = '';
    document.getElementById('opModal').style.display = 'flex';
    document.getElementById('opPwdInput').focus();
  });
}
document.getElementById('opConfirm').onclick = ()=>{
  const v = document.getElementById('opPwdInput').value;
  document.getElementById('opModal').style.display = 'none';
  if(opResolve) opResolve(v);
  opResolve = null;
};
document.getElementById('opCancel').onclick = ()=>{
  document.getElementById('opModal').style.display = 'none';
  if(opResolve) opResolve(null);
  opResolve = null;
};

// ---------- 鉴权守卫（P1-3） ----------
async function bootstrap(){
  const tk = getToken();
  if(!tk){ showLogin(); return; }
  try {
    const me = await api('GET', '/admin/me');
    if(me && me.isAdmin){ enterApp(); }
    else { showLogin(); toast('当前账号无管理员权限', true); }
  } catch(e){
    if(e.message !== 'UNAUTH') showLogin();
  }
}
function showLogin(){
  clearToken();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
}
function enterApp(){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderTabs();
  switchTab('orders');
}

document.getElementById('loginBtn').onclick = async ()=>{
  const acc = document.getElementById('acc').value.trim();
  const pwd = document.getElementById('pwd').value;
  document.getElementById('loginErr').textContent = '';
  try {
    const r = await fetch(API + '/auth/password', {
      method:'POST', headers:{ 'Content-Type':'application/json', 'X-Device-Fp': deviceFp() },
      body: JSON.stringify({ account: acc, password: pwd, deviceInfo:{ ipAddress:'', userAgent: navigator.userAgent } })
    });
    const j = await r.json();
    if(!r.ok){ document.getElementById('loginErr').textContent = j.error || '登录失败'; return; }
    setToken(j.tokens.accessToken);
    const me = await api('GET', '/admin/me');
    if(me && me.isAdmin){ enterApp(); }
    else { showLogin(); document.getElementById('loginErr').textContent = '当前账号无管理员权限'; }
  } catch(e){ document.getElementById('loginErr').textContent = e.message; }
};

document.getElementById('logoutBtn').onclick = ()=>{ showLogin(); toast('已退出登录'); };
document.getElementById('opPwdBtn').onclick = async ()=>{
  const oldP = prompt('请输入原操作密码：');
  if(oldP === null) return;
  const newP = prompt('请输入新操作密码（至少6位）：');
  if(newP === null) return;
  try {
    const j = await api('POST', '/admin/security/op-password', { oldPassword: oldP, newPassword: newP });
    toast(j.message || '操作密码已更新');
  } catch(e){ toast(e.message, true); }
};

// ---------- 标签页 ----------
function renderTabs(){
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.onclick = ()=> switchTab(b.dataset.tab);
  });
}
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('#tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  const v = document.getElementById('mainView');
  if(tab==='orders') v.innerHTML = ordersHtml();
  else if(tab==='billing') v.innerHTML = billingHtml();
  else if(tab==='abnormal') v.innerHTML = abnormalHtml();
  else if(tab==='oplogs') v.innerHTML = oplogsHtml();
  else if(tab==='loginlogs') v.innerHTML = loginlogsHtml();
  else if(tab==='users') v.innerHTML = usersHtml();
  loadTab(tab);
}
function loadTab(tab){
  if(tab==='orders') loadOrders();
  else if(tab==='billing') {/* 需手动查询 */}
  else if(tab==='abnormal') {/* 需手动标记 */}
  else if(tab==='oplogs') loadOplogs();
  else if(tab==='loginlogs') loadLoginLogs();
  else if(tab==='users') loadUsers();
}

function pager(total, page, pageSize, onPage){
  const pages = Math.max(1, Math.ceil(total / pageSize));
  return `<div class="pager">
    <button class="ghost" ${page<=1?'disabled':''} data-pg="${page-1}">上一页</button>
    <span>第 ${page} / ${pages} 页（共 ${total} 条）</span>
    <button class="ghost" ${page>=pages?'disabled':''} data-pg="${page+1}">下一页</button>
  </div>`;
}
function bindPager(container, onPage){
  container.querySelectorAll('[data-pg]').forEach(b=>{
    b.onclick = ()=> { const p = parseInt(b.dataset.pg,10); if(p>=1) onPage(p); };
  });
}

// ---------- 1. 订单查询/导出（P1-1 分页） ----------
function ordersHtml(){
  return `<div class="card">
    <div class="row">
      <div><label>账号</label><input id="o_account" placeholder="手机/邮箱，可空"/></div>
      <div><label>开始日期</label><input id="o_start" type="date"/></div>
      <div><label>结束日期</label><input id="o_end" type="date"/></div>
    </div>
    <div class="row" style="margin-top:8px;">
      <div><label>异常筛选</label>
        <select id="o_abnormal"><option value="">全部</option><option value="1">仅异常</option><option value="0">仅正常</option></select>
      </div>
      <div><label>类型</label>
        <select id="o_type"><option value="">全部</option><option value="package">套餐</option><option value="membership">会员</option></select>
      </div>
      <div style="display:flex;align-items:flex-end;"><button class="primary" id="o_query">查询</button>
        <a class="dl" id="o_export" style="margin-left:12px;align-self:flex-end;">导出CSV</a></div>
    </div>
    <div id="o_table" style="margin-top:12px;"></div>
  </div>`;
}
async function loadOrders(page=1){
  const account = document.getElementById('o_account').value.trim();
  const startDate = document.getElementById('o_start').value;
  const endDate = document.getElementById('o_end').value;
  const abnormal = document.getElementById('o_abnormal').value;
  const type = document.getElementById('o_type').value;
  const q = new URLSearchParams({ page, pageSize: 20, account, startDate, endDate, abnormal, type });
  const el = document.getElementById('o_table');
  el.innerHTML = '加载中…';
  try {
    const j = await api('GET', '/admin/orders?' + q.toString());
    const rows = (j.data||[]).map(o=>`<tr>
      <td>${o.orderNo||''}</td><td>${o.account||''}</td><td>${o.type==='membership'?'会员':(o.packageType||'套餐')}</td>
      <td>${o.amount||''}</td><td>${o.status||''}</td>
      <td>${o.abnormal?'<span class="tag-bad">异常</span>':'正常'}</td>
      <td>${o.createdAt?(new Date(o.createdAt).toLocaleString()):''}</td></tr>`).join('');
    el.innerHTML = `<table><thead><tr><th>订单号</th><th>账号</th><th>类型</th><th>金额</th><th>状态</th><th>异常</th><th>创建时间</th></tr></thead><tbody>${rows||'<tr><td colspan=7>无数据</td></tr>'}</tbody></table>` + pager(j.total||0, j.page||1, j.pageSize||20, loadOrders);
    bindPager(el, loadOrders);
  } catch(e){ el.innerHTML = '<span class="tag-bad">'+e.message+'</span>'; }
}
document.addEventListener('click', (e)=>{
  if(e.target && e.target.id==='o_query') loadOrders(1);
  if(e.target && e.target.id==='o_export'){
    const account = document.getElementById('o_account')?document.getElementById('o_account').value.trim():'';
    const startDate = document.getElementById('o_start').value;
    const endDate = document.getElementById('o_end').value;
    const abnormal = document.getElementById('o_abnormal').value;
    const type = document.getElementById('o_type').value;
    const q = new URLSearchParams({ account, startDate, endDate, abnormal, type });
    window.open(API + '/admin/orders/export?' + q.toString(), '_blank');
  }
});

// ---------- 2. 用户时长管理（含调整，P1-4 操作密码） ----------
function billingHtml(){
  return `<div class="card">
    <div class="row">
      <div><label>账号</label><input id="t_account" placeholder="手机/邮箱"/></div>
      <div><button class="primary" id="t_search" style="align-self:flex-end;">查询</button></div>
    </div>
    <div id="t_result" style="margin-top:12px;"></div>
  </div>`;
}
async function doBillingSearch(){
  const account = document.getElementById('t_account').value.trim();
  const el = document.getElementById('t_result');
  if(!account){ toast('请输入账号', true); return; }
  el.innerHTML = '加载中…';
  try{
    const j = await api('GET', '/admin/users/billing?account=' + encodeURIComponent(account));
    const u = j.user;
    el.innerHTML = `
      <div class="stat">账号: ${u.account}</div>
      <div class="stat">会员: ${u.membership.level}</div>
      <div class="stat">剩余时长(秒): ${u.remainingSec}</div>
      <div class="stat">管理员调整池(秒): ${u.adminTimeSec}</div>
      <div class="stat">试用剩余: ${u.trialRemainingSec}</div>
      <div class="stat">已消耗(秒): ${u.consumedSec}</div>
      <div style="margin-top:14px;">
        <label>调整方向</label>
        <select id="t_op"><option value="add">增加</option><option value="deduct">扣减</option></select>
        <label>调整秒数</label><input id="t_delta" type="number" placeholder="如 300"/>
        <label>原因</label><input id="t_reason" placeholder="调整原因（必填）"/>
        <div style="margin-top:10px;"><button class="danger" id="t_submit">提交调整（需操作密码）</button></div>
        <div id="t_msg" style="margin-top:8px;"></div>
      </div>`;
    document.getElementById('t_submit').onclick = submitAdjust;
  }catch(e){ el.innerHTML = '<span class="tag-bad">'+e.message+'</span>'; }
}
async function submitAdjust(){
  const account = document.getElementById('t_account').value.trim();
  const op = document.getElementById('t_op').value;
  const deltaSec = document.getElementById('t_delta').value;
  const reason = document.getElementById('t_reason').value;
  if(!reason){ toast('请填写原因', true); return; }
  let opPassword = null;
  try { opPassword = await askOpPassword('调整用户时长属于敏感操作，请输入操作密码'); } catch(e){}
  if(opPassword === null) { toast('已取消'); return; }
  try{
    const j = await api('POST', '/admin/users/billing/adjust', { account, op, deltaSec: Number(deltaSec), reason, opPassword });
    document.getElementById('t_msg').innerHTML = `<span class="tag-ok">调整成功：${j.beforeSec} → ${j.afterSec} 秒</span>`;
    doBillingSearch();
  }catch(e){ document.getElementById('t_msg').innerHTML = '<span class="tag-bad">'+e.message+'</span>'; }
}
document.addEventListener('click', (e)=>{ if(e.target && e.target.id==='t_search') doBillingSearch(); });

// ---------- 3. 异常订单标记（P1-4 操作密码） ----------
function abnormalHtml(){
  return `<div class="card">
    <label>订单 ID</label><input id="a_id" placeholder="订单记录 id"/>
    <label>订单类型</label><select id="a_type"><option value="package">套餐</option><option value="membership">会员</option></select>
    <label>标记状态</label><select id="a_ab"><option value="true">标记为异常</option><option value="false">取消异常</option></select>
    <label>备注</label><input id="a_note" placeholder="备注"/>
    <div style="margin-top:10px;"><button class="danger" id="a_submit">提交标记（需操作密码）</button></div>
    <div id="a_msg" style="margin-top:8px;"></div>
  </div>`;
}
document.addEventListener('click', async (e)=>{
  if(e.target && e.target.id==='a_submit'){
    const id = document.getElementById('a_id').value.trim();
    const type = document.getElementById('a_type').value;
    const abnormal = document.getElementById('a_ab').value === 'true';
    const note = document.getElementById('a_note').value;
    if(!id){ toast('请输入订单 ID', true); return; }
    let opPassword = null;
    try { opPassword = await askOpPassword('异常标记属于敏感操作，请输入操作密码'); } catch(err){}
    if(opPassword === null){ toast('已取消'); return; }
    try{
      const j = await api('POST', '/admin/orders/'+id+'/abnormal', { type, abnormal, note, opPassword });
      document.getElementById('a_msg').innerHTML = `<span class="tag-ok">操作成功，当前异常：${j.abnormal}</span>`;
    }catch(err){ document.getElementById('a_msg').innerHTML = '<span class="tag-bad">'+err.message+'</span>'; }
  }
});

// ---------- 4. 操作日志（P1-1 分页 + P1-2 审计详情） ----------
function oplogsHtml(){
  return `<div class="card"><div id="op_table"></div></div>`;
}
async function loadOplogs(page=1){
  const el = document.getElementById('op_table');
  el.innerHTML = '加载中…';
  try{
    const j = await api('GET', '/admin/operation-logs?page='+page+'&pageSize=20');
    const rows = (j.data||[]).map(o=>`<tr>
      <td>${o.action}</td><td>${o.targetType}</td><td>${o.targetId||''}</td>
      <td>${o.reason||''}</td><td>${fmtDetail(o)}</td>
      <td>${o.createdAt?(new Date(o.createdAt).toLocaleString()):''}</td></tr>`).join('');
    el.innerHTML = `<table><thead><tr><th>动作</th><th>对象</th><th>对象ID</th><th>原因</th><th>变更详情</th><th>时间</th></tr></thead><tbody>${rows||'<tr><td colspan=6>无数据</td></tr>'}</tbody></table>` + pager(j.total||0, j.page||1, j.pageSize||20, loadOplogs);
    bindPager(el, loadOplogs);
  }catch(e){ el.innerHTML = '<span class="tag-bad">'+e.message+'</span>'; }
}
function fmtDetail(o){
  const d = o.detail; if(!d) return '';
  if(o.action==='ADJUST_TIME'){
    return `<div class="detail">方向 ${d.op} ${d.deltaSec}秒<br><span class="before">前 ${d.beforeSec}</span> → <span class="after">后 ${d.afterSec}</span> 秒</div>`;
  }
  if(o.action==='SET_USER_STATUS'){
    return `<div class="detail">禁用状态：<span class="before">${d.beforeDisabled}</span> → <span class="after">${d.afterDisabled}</span></div>`;
  }
  if(o.action==='MARK_ABNORMAL'){
    return `<div class="detail">类型 ${d.type}；异常标记：${d.abnormal}</div>`;
  }
  if(o.action==='RESET_PASSWORD'){
    return `<div class="detail">重置密码</div>`;
  }
  return `<div class="detail">${JSON.stringify(d)}</div>`;
}

// ---------- 5. 登录审计（P1-5） ----------
function loginlogsHtml(){
  return `<div class="card">
    <div class="row">
      <div><label>账号</label><input id="l_account" placeholder="可空"/></div>
      <div><label>开始日期</label><input id="l_start" type="date"/></div>
      <div><label>结束日期</label><input id="l_end" type="date"/></div>
      <div style="display:flex;align-items:flex-end;"><button class="primary" id="l_query">查询</button></div>
    </div>
    <div id="l_table" style="margin-top:12px;"></div>
  </div>`;
}
async function loadLoginLogs(page=1){
  const account = document.getElementById('l_account').value.trim();
  const startDate = document.getElementById('l_start').value;
  const endDate = document.getElementById('l_end').value;
  const q = new URLSearchParams({ page, pageSize: 20, account, startDate, endDate });
  const el = document.getElementById('l_table');
  el.innerHTML = '加载中…';
  try{
    const j = await api('GET', '/admin/login-logs?' + q.toString());
    const rows = (j.data||[]).map(o=>`<tr>
      <td>${o.account||''}</td><td>${o.ip||''}</td><td>${o.userAgent||''}</td>
      <td>${o.createdAt?(new Date(o.createdAt).toLocaleString()):''}</td></tr>`).join('');
    el.innerHTML = `<table><thead><tr><th>账号</th><th>IP</th><th>设备/UA</th><th>时间</th></tr></thead><tbody>${rows||'<tr><td colspan=4>无数据</td></tr>'}</tbody></table>` + pager(j.total||0, j.page||1, j.pageSize||20, loadLoginLogs);
    bindPager(el, loadLoginLogs);
  }catch(e){ el.innerHTML = '<span class="tag-bad">'+e.message+'</span>'; }
}
document.addEventListener('click', (e)=>{ if(e.target && e.target.id==='l_query') loadLoginLogs(1); });

// ---------- 6. 用户管理（P1-6 禁用/启用/重置 + P1-4 操作密码） ----------
function usersHtml(){
  return `<div class="card">
    <div class="row">
      <div><label>账号搜索</label><input id="u_account" placeholder="手机/邮箱，可空"/></div>
      <div style="display:flex;align-items:flex-end;"><button class="primary" id="u_query">查询</button></div>
    </div>
    <div id="u_table" style="margin-top:12px;"></div>
  </div>`;
}
async function loadUsers(page=1){
  const account = document.getElementById('u_account').value.trim();
  const q = new URLSearchParams({ page, pageSize: 20, account });
  const el = document.getElementById('u_table');
  el.innerHTML = '加载中…';
  try{
    const j = await api('GET', '/admin/users?' + q.toString());
    const rows = (j.data||[]).map(u=>`<tr>
      <td>${u.uniqueId||u.phone||''}</td><td>${u.phone||''}</td><td>${u.email||''}</td>
      <td>${u.membershipLevel||''}</td>
      <td>${u.disabled?'<span class="tag-bad">已禁用</span>':'<span class="tag-ok">正常</span>'}</td>
      <td>
        <button class="ghost u-toggle" data-id="${u.id}" data-dis="${u.disabled}">${u.disabled?'启用':'禁用'}</button>
        <button class="ghost u-reset" data-id="${u.id}">重置密码</button>
      </td></tr>`).join('');
    el.innerHTML = `<table><thead><tr><th>账号</th><th>手机</th><th>邮箱</th><th>会员</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan=6>无数据</td></tr>'}</tbody></table>` + pager(j.total||0, j.page||1, j.pageSize||20, loadUsers);
    bindPager(el, loadUsers);
    el.querySelectorAll('.u-toggle').forEach(b=> b.onclick = ()=> toggleUser(b.dataset.id, b.dataset.dis==='true'));
    el.querySelectorAll('.u-reset').forEach(b=> b.onclick = ()=> resetUser(b.dataset.id));
  }catch(e){ el.innerHTML = '<span class="tag-bad">'+e.message+'</span>'; }
}
document.addEventListener('click', (e)=>{ if(e.target && e.target.id==='u_query') loadUsers(1); });
async function toggleUser(id, currentlyDisabled){
  const target = currentlyDisabled ? false : true;
  let opPassword = null;
  try { opPassword = await askOpPassword((target?'禁用':'启用') + '账号属于敏感操作，请输入操作密码'); } catch(err){}
  if(opPassword === null){ toast('已取消'); return; }
  try{
    const j = await api('POST', '/admin/users/status', { userId: id, disabled: target, opPassword, reason: (target?'管理员禁用':'管理员启用') });
    toast('账号状态已更新：' + (j.disabled?'已禁用':'已启用'));
    loadUsers();
  }catch(e){ toast(e.message, true); }
}
async function resetUser(id){
  let opPassword = null;
  try { opPassword = await askOpPassword('重置密码属于敏感操作，请输入操作密码'); } catch(err){}
  if(opPassword === null){ toast('已取消'); return; }
  if(!confirm('确认重置该用户密码？旧密码将失效且现有会话被清除。')) return;
  try{
    const j = await api('POST', '/admin/users/reset-password', { userId: id, opPassword });
    alert('新密码已生成（请妥善交付用户）：\n' + j.newPassword);
    toast('密码已重置');
  }catch(e){ toast(e.message, true); }
}

// 启动：路由守卫
bootstrap();
</script>
