# ============================================================
# new-app.conf  —  AILOS APP 站点网关（8080）
# 真值源：git 仓库 deploy/nginx/new-app.conf
# 禁止直接在服务器修改本文件，任何变更必须先提交 git 再走发布脚本下发
# ------------------------------------------------------------
# 2026-08-03 APP 403 根因修复（对齐主站 yandao.vip.conf 的 API 代理规则）：
#   缺陷1: 完全缺失 /api 反向代理 → APP 端所有接口 403/500
#   缺陷2: root /www/xuewaiyu 下无 index.html，location / 的 try_files
#          回退 /index.html 落空 → 目录索引被禁 → 403 Forbidden
#   缺陷3: 缺 /xuewaiyu/ alias 映射 → APP 页面路径 500
# ============================================================
server {
    listen 8080;
    server_name _;
    root /www/xuewaiyu;
    index index.html;
    charset utf-8;

    error_page 404 /xuewaiyu/404.html;

    # ===== V1 API (xuewaiyu-backend :3000) =====
    # 前端 common.js 走 /xuewaiyu/api/v1/*，需剥离 /xuewaiyu 前缀后转发
    location ^~ /xuewaiyu/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # AI 类接口耗时长，单独放宽超时
    location ^~ /api/ai/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /api/verify/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/tts-proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/learning/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 兜底：其余全部 /api/* 转后端 3000
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ===== 静态资源（后端 Express 也挂了 /xuewaiyu/assets，此处直供更快）=====
    location ^~ /xuewaiyu/assets/ {
        alias /www/xuewaiyu/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ===== 单入口规范：根路径 billing.html 永久跳转子路径 =====
    location = /billing.html {
        return 301 /xuewaiyu/billing.html;
    }

    # ===== APP 页面精确匹配（与主站保持一致）=====
    location = /xuewaiyu { return 301 /xuewaiyu/; }

    location = /xuewaiyu/login {
        alias /www/xuewaiyu/;
        add_header Cache-Control "no-cache" always;
        try_files login.html =404;
    }

    location = /xuewaiyu/guest {
        alias /www/xuewaiyu/;
        add_header Cache-Control "no-cache" always;
        try_files guest.html =404;
    }

    location = /xuewaiyu/home {
        alias /www/xuewaiyu/;
        add_header Cache-Control "no-cache" always;
        try_files home.html =404;
    }

    # ===== APP 主体页面 =====
    # 注意：/www/xuewaiyu 下不存在 index.html，站点首页实为 landing.html。
    # 原配置 index index.html + try_files $uri/ 会命中目录索引（autoindex off）→ 403。
    # 故：显式 index landing.html，且移除 $uri/ 目录回退，兜底指向 landing.html。
    location = /xuewaiyu/ {
        alias /www/xuewaiyu/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Cache-Control "no-cache" always;
        try_files landing.html =404;
    }

    location /xuewaiyu/ {
        alias /www/xuewaiyu/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html /xuewaiyu/landing.html;
    }

    # ===== 静态资源缓存（非 /xuewaiyu/ 前缀的旧路径兼容）=====
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ===== 根路径兜底 =====
    # /www/xuewaiyu 下无 index.html，原 try_files 回退 /index.html 落空导致 403。
    # 统一 302 到 APP 主入口 /xuewaiyu/，彻底消除 403。
    location = / {
        return 302 /xuewaiyu/;
    }

    location / {
        try_files $uri $uri.html /xuewaiyu/landing.html;
    }
}
