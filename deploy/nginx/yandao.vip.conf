# yandao.vip HTTPS - AILOS OS v1.0
# 2026-07-26 阶段一任务2整改：/xuewaiyu/ 全路径补 Cache-Control no-cache（配合 common.js?v= 版本号）
# 说明：no-cache = 每次 etag 复验（304 极廉价），保证部署后用户侧立即生效，杜绝旧缓存页面/旧 JS 残留
server {
    listen 80;
    server_name yandao.vip www.yandao.vip;
    error_page 404 /xuewaiyu/404.html;
    # 单入口规范：根路径 billing.html 永久跳转子路径（第三优先级 Task1）
    location = /billing.html {
        return 301 /xuewaiyu/billing.html;
    }

    location ^~ /.well-known/acme-challenge/ { root /www/yandao-company; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name yandao.vip www.yandao.vip;
    error_page 404 /xuewaiyu/404.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/yandao.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yandao.vip/privkey.pem;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ===== V1 API (xuewaiyu-backend :3000) =====
    location ^~ /xuewaiyu/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ===== AI / misc API (backend :3000) =====
    location ^~ /api/ai/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    location ^~ /api/verify/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location ^~ /api/tts-proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location ^~ /api/learning/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ===== Company Website Assets (言道科技官网) =====
    location /assets/ {
        root /www/yandao-company;
        expires 7d;
    }
    location /audio/ {
        root /www/yandao-company;
        expires 7d;
    }
    location /data/ {
        root /www/yandao-company;
        expires 7d;
    }

    # ===== Company Website Static Pages (言道科技官网) =====
    location = /vite.svg {
        root /www/yandao-company;
    }
    location = /icon.svg {
        root /www/yandao-company;
    }
    location = /parrot.jpg {
        root /www/yandao-company;
    }
    # 自毁 Service Worker（v3.2.2）：仅用于注销历史 SW 并清空 caches，必须 no-cache
    location = /sw.js {
        root /www/yandao-company;
        add_header Cache-Control "no-cache" always;
    }

    # ===== Company Website Pages =====
    location = /app.html { root /www/yandao-company; try_files /app.html =404; }
    location = /download.html { root /www/yandao-company; try_files /download.html =404; }
    location = /contact.html { root /www/yandao-company; try_files /contact.html =404; }
    location = /feedback.html { root /www/yandao-company; try_files /feedback.html =404; }
    location = /privacy.html { root /www/yandao-company; try_files /privacy.html =404; }
    location = /terms.html { root /www/yandao-company; try_files /terms.html =404; }

    # ===== AILOS App Pages (学外语APP) =====
    location = /login {
        root /www/xuewaiyu;
        try_files /login.html =404;
    }
    location = /language {
        root /www/xuewaiyu;
        try_files /language.html =404;
    }
    location = /learn.html {
        root /www/xuewaiyu;
        try_files /learn.html =404;
    }

    # ===== AILOS SPA (学外语APP) =====
    location = /xuewaiyu { return 301 /xuewaiyu/; }
    location = /billing.html {
        return 301 /xuewaiyu/billing.html;
    }

    location = /xuewaiyu/home {
        root /www/xuewaiyu;
        try_files /home.html =404;
    }
    location = /dashboard {
        root /www/xuewaiyu;
        try_files /home.html =404;
    }

    # ===== AILOS App Pages (exact match fixes) =====
    location = /xuewaiyu/login {
        alias /www/xuewaiyu/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;
        add_header Cache-Control "no-cache" always;
        try_files login.html =404;
    }
    location = /xuewaiyu/guest {
        alias /www/xuewaiyu/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;
        add_header Cache-Control "no-cache" always;
        try_files guest.html =404;
    }

    # 2026-08-03 修复：/www/xuewaiyu 下不存在 index.html（首页实为 landing.html），
    # 原 index index.html + try_files $uri/ 会命中目录索引(autoindex off) → /xuewaiyu/ 返回 403。
    location = /xuewaiyu/ {
        alias /www/xuewaiyu/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;
        add_header Cache-Control "no-cache" always;
        try_files landing.html =404;
    }

    location /xuewaiyu/ {
        alias /www/xuewaiyu/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;
        # 阶段一任务2：HTML/JS/CSS 一律 no-cache（etag 复验 304），部署即生效，无旧缓存残留
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html /xuewaiyu/landing.html;
    }

    # ===== Company Website Root (言道科技官网首页) =====
    location / {
        root /www/yandao-company;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
