    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf|mp3|m4a|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /xuewaiyu {
        alias /www/xuewaiyu/;
        index index.html;
        try_files $uri $uri/ /xuewaiyu/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}