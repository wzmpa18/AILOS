
server {
    listen 80;
    server_name admin.yandao.vip;
    root /www/yandao-app/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location /xuewaiyu {
        alias /www/xuewaiyu/;
        index index.html;
        try_files $uri $uri/ /xuewaiyu/index.html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name 82.156.228.87;

    root /www/xuewaiyu;
    index index.html;

    access_log /www/wwwlogs/yandao-app.access.log;
    error_log /www/wwwlogs/yandao-app.error.log warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        return 302 /xuewaiyu/login.html;
    }

    location ^~ /downloads/ {
        alias /www/yandao-app/downloads/;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # ===== API Proxy to xuewaiyu-backend :3000 =====
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

        # /api/ai/ now proxied via general /api/ block -> backend :3000 (dead ai-proxy removed)


    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf|mp3|m4a|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /xuewaiyu {
        alias /www/xuewaiyu/;
        index index.html;
        try_files $uri $uri/ /xuewaiyu/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.yandao.vip;

    root /www/yandao-app/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/admin.yandao.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yandao.vip/privkey.pem;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /www/wwwlogs/yandao-admin.access.log;
    error_log /www/wwwlogs/yandao-admin.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /downloads/ {
        alias /www/yandao-app/downloads/;
        types { application/vnd.android.package-archive apk; }
