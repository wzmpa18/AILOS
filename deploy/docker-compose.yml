version: '3.8'

# ============================================
# AILOS 生产环境 Docker Compose v2.0.0
# 七库分离 + 微服务架构
# 启动: docker-compose up -d
# ============================================

services:
  # ============================================
  # Nginx 反向代理
  # ============================================
  nginx:
    image: nginx:1.25-alpine
    container_name: ailos-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - ailos-server
    restart: unless-stopped
    networks:
      - ailos-net

  # ============================================
  # NestJS 后端服务
  # ============================================
  ailos-server:
    build:
      context: ./ailos-server
      dockerfile: Dockerfile
    container_name: ailos-server
    ports:
      - "3000:3000"
    env_file:
      - ./config/env/prod.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ailos-net
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================
  # MySQL 8.0 — 七库实例
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: ailos-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./sql/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ailos-net

  # ============================================
  # Redis 7.x — 缓存 + 语义索引
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ailos-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ailos-net

  # ============================================
  # RabbitMQ — 事件总线
  # ============================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: ailos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ailos-net

  # ============================================
  # Prometheus — 监控
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ailos-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - ailos-net

  # ============================================
  # Grafana — 可视化
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: ailos-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS}
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    restart: unless-stopped
    networks:
      - ailos-net

networks:
  ailos-net:
    driver: bridge
