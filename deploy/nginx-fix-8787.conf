# ============================================================
# Nginx 8787 端口修复配置 — P0-04 (TD-012)
# 用途：将所有 /api/* 路由到 :3000（xuewaiyu-backend），
#       消除对已死亡 8787 端口的引用
# 部署方式：在服务器上执行以下命令：
#   cp /www/server/panel/vhost/nginx/yandao.vip.conf /www/server/panel/vhost/nginx/yandao.vip.conf.bak
#   将下方 location /api/ 块替换原配置中所有指向 :8787 的 location 块
#   然后执行: nginx -t && nginx -s reload
# ============================================================

# 将以下 location 块添加到 yandao.vip.conf 的 server 块中，
# 替换所有指向 :8787 的 location 块

# ====== API 统一代理到 :3000 ======
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# 注意：如果原配置中已有 /api/auth/ 的 location 块指向 :3000，
# 则 /api/ 的 location 块会作为 fallback 匹配所有其他 /api/* 路径。
# Nginx 的 location 匹配优先级：精确前缀 > 最长前缀 > 正则
# /api/auth/ 是精确前缀，优先级高于 /api/