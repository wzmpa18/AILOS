server {
    listen 80;
    server_name _;
    
    location /download/ {
        alias /usr/share/nginx/html/download/;
        autoindex on;
        autoindex_format html;
        
        # APK文件下载头
        types {
            application/vnd.android.package-archive apk;
        }
        
        # 文件大小显示
        add_header Content-Disposition "attachment";
    }
    
    # 健康检查
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
