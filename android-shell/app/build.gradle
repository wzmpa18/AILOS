plugins {
    id 'com.android.application'
}

// build.gradle (Module: app)
// AILOS v1.0 Beta - Android WebView Shell

// Read signing config from keystore.properties (CI) or -P properties (local)
def keystoreProperties = new Properties()
def keystorePropertiesFile = file('/tmp/keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    logger.lifecycle("Loaded keystore.properties from /tmp/keystore.properties")
}

android {
    namespace 'com.yandao.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.yandao.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        buildConfigField "String", "BASE_URL", '"https://yandao.vip/xuewaiyu/"'
        buildConfigField "String", "API_BASE", '"https://yandao.vip/xuewaiyu/api/"'
    }

    signingConfigs {
        release {
            // Priority: keystore.properties (CI) > -P properties (local) > env vars > empty
            storeFile file(keystoreProperties.getProperty('storeFile') ?: project.findProperty('YD_STORE_FILE') ?: System.getenv('KEYSTORE_FILE') ?: '/tmp/yandao-release.keystore')
            storePassword keystoreProperties.getProperty('storePassword') ?: project.findProperty('YD_STORE_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias keystoreProperties.getProperty('keyAlias') ?: project.findProperty('YD_KEY_ALIAS') ?: System.getenv('KEY_ALIAS') ?: ''
            keyPassword keystoreProperties.getProperty('keyPassword') ?: project.findProperty('YD_KEY_PASSWORD') ?: System.getenv('KEY_PASSWORD') ?: ''
            storeType keystoreProperties.getProperty('storeType', 'pkcs12')
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true

            // Debug logging
            logger.lifecycle("Signing config:")
            logger.lifecycle("  storeFile: ${storeFile}")
            logger.lifecycle("  storeType: ${storeType}")
            logger.lifecycle("  keyAlias: ${keyAlias}")
            logger.lifecycle("  storeFile exists: ${storeFile.exists()}")
            if (storeFile.exists()) {
                logger.lifecycle("  storeFile size: ${storeFile.length()} bytes")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            buildConfigField "boolean", "DEBUG_MODE", "false"
            buildConfigField "boolean", "ENABLE_LOG", "false"
        }
        debug {
            buildConfigField "String", "BASE_URL", '"https://yandao.vip/xuewaiyu/"'
            buildConfigField "boolean", "DEBUG_MODE", "true"
            buildConfigField "boolean", "ENABLE_LOG", "true"
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}