<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>AILOS - 注册</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #4F46E5;
    --primary-hover: #4338CA;
    --primary-light: #EEF2FF;
    --bg: #F8FAFC;
    --card-bg: #FFFFFF;
    --text: #1E293B;
    --text-secondary: #64748B;
    --text-muted: #94A3B8;
    --border: #E2E8F0;
    --error: #EF4444;
    --success: #10B981;
    --warning: #F59E0B;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 24px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.06), 0 8px 32px rgba(0,0,0,.04);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Noto Sans JP', 'Noto Sans KR', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .container { width: 100%; max-width: 420px; }
  .back-link {
    display: inline-block; margin-bottom: 12px; font-size: 14px;
    color: var(--text-secondary); text-decoration: none; transition: color .2s;
  }
  .back-link:hover { color: var(--primary); }
  .card {
    background: var(--card-bg); border-radius: var(--radius); padding: 32px 28px 24px;
    box-shadow: var(--shadow-md); border: 1px solid var(--border);
  }
  .logo { text-align: center; margin-bottom: 20px; }
  .logo-icon { font-size: 40px; margin-bottom: 6px; }
  .logo-text { font-size: 24px; font-weight: 700; color: var(--primary); }
  .logo-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }


  .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; text-align: center; padding: 10px 0; font-size: 14px; font-weight: 600;
    color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s;
  }
  .tab:hover { color: var(--text-secondary); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

  .method-switch { display: flex; gap: 8px; margin-bottom: 16px; }
  .method-btn {
    flex: 1; padding: 8px; border-radius: var(--radius-sm); font-size: 13px;
    border: 1px solid var(--border); background: var(--card-bg); color: var(--text-secondary);
    cursor: pointer; transition: all .2s; text-align: center;
  }
  .method-btn:hover { border-color: var(--primary); }
  .method-btn.active { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }

  .msg { padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 12px; display: none; }
  .msg.show { display: block; }
  .msg.error { background: #FEF2F2; color: var(--error); border: 1px solid #FECACA; }
  .msg.success { background: #F0FDF4; color: var(--success); border: 1px solid #BBF7D0; }
  .msg.info { background: #EFF6FF; color: #3B82F6; border: 1px solid #BFDBFE; }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
  .form-group input, .form-group select {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 15px;
    border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
    transition: border-color .2s; outline: none;
  }
  .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
  .form-group input::placeholder { color: var(--text-muted); }
  .form-group input.error { border-color: var(--error); }

  .phone-row { display: flex; gap: 0; }
  .phone-row select {
    width: 90px; border-radius: var(--radius-sm) 0 0 var(--radius-sm); border-right: none;
    background: #F8FAFC; font-size: 13px; padding: 12px 8px;
  }
  .phone-row input { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; flex: 1; }

  .sms-row { display: flex; gap: 10px; }
  .sms-row input { flex: 1; }
  .btn-sms {
    padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
    border: 1px solid var(--primary); background: var(--card-bg); color: var(--primary);
    cursor: pointer; transition: all .2s; white-space: nowrap; min-width: 100px;
  }
  .btn-sms:hover { background: var(--primary-light); }
  .btn-sms:disabled { opacity: .5; cursor: not-allowed; }

  .btn-submit {
    width: 100%; padding: 14px; border-radius: var(--radius-sm); font-size: 16px; font-weight: 700;
    border: none; cursor: pointer; background: var(--primary); color: #fff;
    transition: all .2s; margin-top: 4px;
  }
  .btn-submit:hover { background: var(--primary-hover); }
  .btn-submit:disabled { opacity: .6; cursor: not-allowed; }

  .privacy { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
  .privacy a { color: var(--primary); text-decoration: none; }
  .privacy input { accent-color: var(--primary); }

  .wechat-section { text-align: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .wechat-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px;
    border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
    border: 1px solid #07C160; background: #07C160; color: #fff;
    cursor: pointer; transition: all .2s;
  }
  .wechat-btn:hover { background: #06AD56; }

  .footer {
    text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-muted);
  }
  .footer a { color: var(--primary); text-decoration: none; font-weight: 600; }

  .guest-entry { text-align: center; margin-top: 10px; }
  .guest-entry a {
    font-size: 13px; color: var(--text-secondary); text-decoration: none;
    border-bottom: 1px dashed var(--text-muted); padding-bottom: 2px;
  }
  .guest-entry a:hover { color: var(--primary); border-bottom-color: var(--primary); }

  .benefits {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px;
  }
  .benefit-item {
    text-align: center; padding: 10px 6px; border-radius: var(--radius-sm);
    background: var(--primary-light); font-size: 11px; color: var(--primary);
    font-weight: 600; line-height: 1.4;
  }
  .benefit-item .bi-icon { font-size: 20px; display: block; margin-bottom: 4px; }

  .invite-hint {
    font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 8px; line-height: 1.5;
  }

  @media (max-width: 400px) {
    .card { padding: 24px 18px 20px; }
    .sms-row { flex-direction: column; }
    .benefits { grid-template-columns: 1fr; }
  }
</style>
</head>

<div class="container">
  <a class="back-link" href="/xuewaiyu/guest.html" data-i18n="back_to_home">← 返回首页</a>
  <div class="card">
    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">🌍</div>
      <div class="logo-text" data-i18n="app_name">AILOS</div>
      <div class="logo-sub" data-i18n="app_subtitle">AI语言学习伙伴</div>
    </div>

    <!-- Language Switch -->

    <!-- Benefits -->
    <div class="benefits">
      <div class="benefit-item">
        <span class="bi-icon">🎁</span>
        <span data-i18n="benefit_points">30成长积分</span>
      </div>
      <div class="benefit-item">
        <span class="bi-icon">🤖</span>
        <span data-i18n="benefit_trial">3天AI体验</span>
      </div>
      <div class="benefit-item">
        <span class="bi-icon">👤</span>
        <span data-i18n="benefit_companion">专属AI伴读</span>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs" id="tabs">
      <div class="tab" data-mode="login" data-i18n="tab_login">登录</div>
      <div class="tab active" data-mode="register" data-i18n="tab_register">注册</div>
      <div class="tab" data-mode="reset" data-i18n="tab_reset">找回密码</div>
    </div>

    <!-- Method Switch -->
    <div class="method-switch" id="methodSwitch">
      <div class="method-btn active" data-method="phone" data-i18n="register_method_phone">手机号注册</div>
      <div class="method-btn" data-method="email" data-i18n="register_method_email">邮箱注册</div>
    </div>

    <!-- Message -->
    <div class="msg" id="msg"></div>

    <!-- Form -->
    <div id="formContent"></div>

    <!-- Privacy -->
    <div class="privacy" id="privacyCheck">
      <input type="checkbox" id="agreePrivacy">
      <span><span data-i18n="privacy_text">我已阅读并同意</span> <a href="javascript:void(0)" onclick="showPrivacy()" data-i18n="privacy_link">《隐私政策》</a> <span data-i18n="privacy_and">和</span> <a href="/xuewaiyu/terms.html" target="_blank" data-i18n="privacy_terms">《用户协议》</a></span>
    </div>

    <!-- Submit -->
    <button class="btn-submit" id="btnSubmit" data-i18n="btn_register">注册</button>

    <!-- WeChat Login -->
    <div class="wechat-section" id="wechatSection">
      <button class="wechat-btn" onclick="wechatRegister()" data-i18n="wechat_register">微信一键注册</button>
    </div>

    <!-- Invite Hint -->
    <div class="invite-hint" data-i18n="invite_hint">无邀请码自主注册用户，系统自动归属平台官方推广账户，按标准两级规则结算分润</div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span data-i18n="footer_text_reg">已有账号？</span>
    <a href="/xuewaiyu/login.html" data-i18n="footer_login">立即登录</a>
  </div>
  <div class="guest-entry">
    <a href="javascript:void(0)" onclick="startGuestMode()" data-i18n="guest_entry">先体验一下，游客模式</a>
  </div>
</div>

// ==================== State ====================
let currentLang = 'zh';
let currentMode = 'register';
let currentMethod = 'phone';
let countdownTimer = null;
let countdownSeconds = 0;

// ==================== Functions ====================
function detectLang() {
  try {
    const navLang = (navigator.language || navigator.userLanguage || 'zh').split('-')[0].toLowerCase();
    const supported = ['zh', 'en', 'ja', 'ko', 'fr', 'es', 'de'];
    const map = { 'jp': 'ja', 'cn': 'zh', 'tw': 'zh', 'hk': 'zh', 'kr': 'ko' };
    currentLang = supported.includes(map[navLang] || navLang) ? (map[navLang] || navLang) : 'zh';
  } catch(e) { currentLang = 'zh'; }
}

function t(key) {
  return (I18N[currentLang] && I18N[currentLang][key]) ||
         (I18N['zh'] && I18N['zh'][key]) || key;
}





function updateI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (el.tagName === 'INPUT' && el.type === 'text') {
      el.placeholder = t(key);
    } else {
      el.textContent = t(key);
    }
  });
}

function updateTabTexts() {
  document.querySelectorAll('.tab').forEach(tab => {
    const mode = tab.getAttribute('data-mode');
    const keyMap = { login: 'tab_login', register: 'tab_register', reset: 'tab_reset' };
    tab.textContent = t(keyMap[mode] || keyMap[mode]);
  });
  document.querySelectorAll('.method-btn').forEach(btn => {
    const method = btn.getAttribute('data-method');
    const keyMap = {
      'phone_login': 'login_method_phone', 'email_login': 'login_method_email',
      'phone_register': 'register_method_phone', 'email_register': 'register_method_email',
      'phone_reset': 'reset_method_phone', 'email_reset': 'reset_method_email',
    };
    const key = keyMap[method + '_' + currentMode] || keyMap[method];
    if (key) btn.textContent = t(key);
  });
}

async function apiCall(path, body) {
  try {
    const resp = await fetch('/api/auth' + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return await resp.json();
  } catch(e) {
    return { success: false, error: t('msg_operation_failed') };
  }
}

function renderForm() {
  const container = document.getElementById('formContent');
  const isLogin = currentMode === 'login';
  const isRegister = currentMode === 'register';
  const isReset = currentMode === 'reset';
  const isPhone = currentMethod === 'phone';

  let html = '';

  // Phone number or email
  if (isPhone) {
    html += `<div class="form-group">
      <label data-i18n="label_phone">${t('label_phone')}</label>
      <div class="phone-row">
        <select id="countryCode"><option value="+86">+86</option><option value="+1">+1</option><option value="+81">+81</option><option value="+82">+82</option><option value="+33">+33</option><option value="+34">+34</option><option value="+49">+49</option></select>
        <input type="tel" id="phoneInput" placeholder="${t('label_phone')}" autocomplete="tel">
      </div>
    </div>`;
  } else {
    html += `<div class="form-group">
      <label data-i18n="label_email">${t('label_email')}</label>
      <input type="email" id="emailInput" placeholder="${t('label_email')}" autocomplete="email">
    </div>`;
  }

  // Username (register only)
  if (isRegister) {
    html += `<div class="form-group">
      <label data-i18n="label_username">${t('label_username')}</label>
      <input type="text" id="usernameInput" placeholder="${t('label_username')}" autocomplete="username">
    </div>`;
  }

  // Verification code (register only)
  if (isRegister) {
    html += `<div class="form-group">
      <label data-i18n="label_code">${t('label_code')}</label>
      <div class="sms-row">
        <input type="text" id="codeInput" placeholder="${t('label_code')}" autocomplete="one-time-code">
        <button class="btn-sms" id="btnSendCode" onclick="sendCode()" data-i18n="${isPhone ? 'btn_send_sms' : 'btn_send_email'}">${t(isPhone ? 'btn_send_sms' : 'btn_send_email')}</button>
      </div>
    </div>`;
  }

  // Password
  html += `<div class="form-group">
    <label data-i18n="label_password">${t('label_password')}</label>
    <input type="password" id="passwordInput" placeholder="${t('label_password')}" autocomplete="${isLogin ? 'current-password' : 'new-password'}">
  </div>`;

  // Confirm password (register only)
  if (isRegister) {
    html += `<div class="form-group">
      <label data-i18n="label_confirm_pwd">${t('label_confirm_pwd')}</label>
      <input type="password" id="confirmPwdInput" placeholder="${t('label_confirm_pwd')}" autocomplete="new-password">
    </div>`;
  }

  // Old password (reset only)
  if (isReset) {
    html += `<div class="form-group">
      <label data-i18n="label_old_password">${t('label_old_password')}</label>
      <input type="password" id="oldPasswordInput" placeholder="${t('label_old_password')}">
    </div>
    <div class="form-group">
      <label data-i18n="label_new_password">${t('label_new_password')}</label>
      <input type="password" id="newPasswordInput" placeholder="${t('label_new_password')}">
    </div>`;
  }

  container.innerHTML = html;
}

function switchMode(mode) {
  currentMode = mode;
  // Reset method to phone when switching to register
  if (mode === 'register') {
    currentMethod = 'phone';
  }
  // Update tabs
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.getAttribute('data-mode') === mode));
  // Update method buttons
  document.querySelectorAll('.method-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-method') === currentMethod));
  // Update method switch visibility
  const methodSwitch = document.getElementById('methodSwitch');
  methodSwitch.style.display = (mode === 'login' || mode === 'register') ? 'flex' : 'none';
  // Update method button texts
  updateMethodBtnTexts();
  // Update privacy checkbox
  document.getElementById('privacyCheck').style.display = mode === 'register' ? 'flex' : 'none';
  // Update wechat section
  document.getElementById('wechatSection').style.display = mode === 'register' ? 'block' : 'none';
  // Update submit button
  const btnMap = { login: 'btn_login', register: 'btn_register', reset: 'btn_reset' };
  document.getElementById('btnSubmit').textContent = t(btnMap[mode]);
  // Update footer
  const footerText = document.querySelector('.footer span');
  const footerLink = document.querySelector('.footer a');
  if (mode === 'register') {
    footerText.textContent = t('footer_text_reg');
    footerLink.textContent = t('footer_login');
    footerLink.href = '/xuewaiyu/login.html';
  } else {
    footerText.textContent = t('footer_text');
    footerLink.textContent = t('footer_register');
    footerLink.href = '/xuewaiyu/register.html';
  }
  renderForm();
  hideMsg();
}

function switchMethod(method) {
  currentMethod = method;
  document.querySelectorAll('.method-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-method') === method));
  renderForm();
  hideMsg();
}

function updateMethodBtnTexts() {
  const btns = document.querySelectorAll('.method-btn');
  btns.forEach(btn => {
    const method = btn.getAttribute('data-method');
    const keyMap = {
      'phone': currentMode === 'login' ? 'login_method_phone' : (currentMode === 'register' ? 'register_method_phone' : 'reset_method_phone'),
      'email': currentMode === 'login' ? 'login_method_email' : (currentMode === 'register' ? 'register_method_email' : 'reset_method_email'),
    };
    btn.textContent = t(keyMap[method] || keyMap[method]);
  });
}

async function sendCode() {
  const isPhone = currentMethod === 'phone';
  let target = '';
  if (isPhone) {
    const code = document.getElementById('countryCode').value;
    const phone = document.getElementById('phoneInput').value.trim();
    if (!phone) { showMsg(t('msg_enter_phone'), 'error'); return; }
    target = phone; // Backend adds +86 prefix, do not include country code
  } else {
    const email = document.getElementById('emailInput').value.trim();
    if (!email) { showMsg(t('msg_enter_email'), 'error'); return; }
    target = email;
  }

  const btn = document.getElementById('btnSendCode');
  btn.disabled = true;
  btn.textContent = t('msg_sending');

  const endpoint = isPhone ? '/send-code' : '/send-email-code';
  const body = isPhone ? { phone: target, countryCode: code } : { email: target };
  const result = await apiCall(endpoint, body);

  if (result.success) {
    showMsg(t('msg_code_sent'), 'success');
    startCountdown();
  } else {
    showMsg(result.error || t('msg_code_send_failed'), 'error');
    btn.disabled = false;
    btn.textContent = t(isPhone ? 'btn_send_sms' : 'btn_send_email');
  }
}

function startCountdown() {
  countdownSeconds = 60;
  const btn = document.getElementById('btnSendCode');
  const isPhone = currentMethod === 'phone';
  const tick = () => {
    if (countdownSeconds <= 0) {
      btn.disabled = false;
      btn.textContent = t(isPhone ? 'btn_send_sms' : 'btn_send_email');
      countdownTimer = null;
      return;
    }
    btn.textContent = t('retry_text') + '(' + countdownSeconds + t('retry_after') + ')';
    countdownSeconds--;
    countdownTimer = setTimeout(tick, 1000);
  };
  tick();
}

async function handleSubmit() {
  const isLogin = currentMode === 'login';
  const isRegister = currentMode === 'register';
  const isReset = currentMode === 'reset';
  const isPhone = currentMethod === 'phone';

  // Validate
  if (isRegister) {
    if (!document.getElementById('agreePrivacy').checked) {
      showMsg(t('msg_agree'), 'error'); return;
    }
    const username = document.getElementById('usernameInput').value.trim();
    if (!username) { showMsg(t('msg_enter_username'), 'error'); return; }
    const code = document.getElementById('codeInput').value.trim();
    if (!code) { showMsg(t('msg_enter_code'), 'error'); return; }
    const pwd = document.getElementById('passwordInput').value.trim();
    if (!pwd) { showMsg(t('msg_enter_password'), 'error'); return; }
    const confirmPwd = document.getElementById('confirmPwdInput').value.trim();
    if (pwd !== confirmPwd) { showMsg(t('msg_password_mismatch'), 'error'); return; }

    // Build registration body
    const body = {
      username: username,
      password: pwd,
      code: code,
    };
    if (isPhone) {
      const phone = document.getElementById('phoneInput').value.trim();
      if (!phone) { showMsg(t('msg_enter_phone'), 'error'); return; }
      body.phone = document.getElementById('countryCode').value + phone;
    } else {
      const email = document.getElementById('emailInput').value.trim();
      if (!email) { showMsg(t('msg_enter_email'), 'error'); return; }
      body.email = email;
    }

    // Check for invite code in URL
    const urlParams = new URLSearchParams(window.location.search);
    const inviteCode = urlParams.get('invite') || urlParams.get('ref') || '';
    if (inviteCode) body.inviteCode = inviteCode;

    showMsg(t('msg_loading'), 'info');
    document.getElementById('btnSubmit').disabled = true;

    const result = await apiCall('/register', body);
    if (result.success) {
      showMsg(t('msg_register_success'), 'success');
      // Store token（BUG-018 同修：后端 token 在 result.tokens.accessToken，兼容旧 result.token）
      const regTok = result.token || (result.tokens && result.tokens.accessToken);
      if (regTok) {
        try { localStorage.setItem('yandao_token_v1', regTok); localStorage.setItem('auth_tokens', JSON.stringify({accessToken:regTok})); } catch(e) {}
      }
      setTimeout(() => {
        let dest = result.redirect || '/xuewaiyu/home.html';
      try {
        // 蓝图 Stage 2 引导闸：未完成首次引导则进入完整引导流程（身份→语言→定级→目标→伴读→计划）
        if (!localStorage.getItem('yandao_onboarding_done') && !localStorage.getItem('yandao_level_assessment')) {
          dest = '/xuewaiyu/onboarding.html';
        }
      } catch (e) {}
      window.location.href = dest;
      }, 1000);
    } else {
      showMsg(result.error || t('msg_operation_failed'), 'error');
      document.getElementById('btnSubmit').disabled = false;
    }
    return;
  }

  if (isLogin) {
    const pwd = document.getElementById('passwordInput').value.trim();
    if (!pwd) { showMsg(t('msg_enter_password'), 'error'); return; }

    const body = { password: pwd };
    if (isPhone) {
      const phone = document.getElementById('phoneInput').value.trim();
      if (!phone) { showMsg(t('msg_enter_phone'), 'error'); return; }
      body.phone = document.getElementById('countryCode').value + phone;
    } else {
      const email = document.getElementById('emailInput').value.trim();
      if (!email) { showMsg(t('msg_enter_email'), 'error'); return; }
      body.email = email;
    }

    showMsg(t('msg_loading'), 'info');
    document.getElementById('btnSubmit').disabled = true;

    const result = await apiCall('/password', body);
    if (result.success) {
      showMsg(t('msg_login_success'), 'success');
      const lgTok = result.token || (result.tokens && result.tokens.accessToken);
      if (lgTok) {
        try { localStorage.setItem('yandao_token_v1', lgTok); localStorage.setItem('auth_tokens', JSON.stringify({accessToken:lgTok})); } catch(e) {}
      }
      setTimeout(() => {
        let dest = result.redirect || '/xuewaiyu/home.html';
      try {
        // 蓝图 Stage 2 引导闸：未完成首次引导则进入完整引导流程（身份→语言→定级→目标→伴读→计划）
        if (!localStorage.getItem('yandao_onboarding_done') && !localStorage.getItem('yandao_level_assessment')) {
          dest = '/xuewaiyu/onboarding.html';
        }
      } catch (e) {}
      window.location.href = dest;
      }, 1000);
    } else {
      showMsg(result.error || t('msg_operation_failed'), 'error');
      document.getElementById('btnSubmit').disabled = false;
    }
    return;
  }

  if (isReset) {
    const oldPwd = document.getElementById('oldPasswordInput').value.trim();
    const newPwd = document.getElementById('newPasswordInput').value.trim();
    if (!oldPwd || !newPwd) { showMsg(t('msg_enter_password'), 'error'); return; }

    const body = { oldPassword: oldPwd, newPassword: newPwd };
    const token = localStorage.getItem('yandao_token_v1');
    if (token) body.token = token;

    showMsg(t('msg_loading'), 'info');
    document.getElementById('btnSubmit').disabled = true;

    const resp = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': token ? 'Bearer ' + token : '' },
      body: JSON.stringify(body),
    });
    const result = await resp.json();
    if (result.success) {
      showMsg(t('msg_reset_success'), 'success');
      setTimeout(() => { switchMode('login'); }, 1500);
    } else {
      showMsg(result.error || t('msg_operation_failed'), 'error');
      document.getElementById('btnSubmit').disabled = false;
    }
    return;
  }
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + type;
}

function hideMsg() {
  const el = document.getElementById('msg');
  el.className = 'msg';
}

function showPrivacy() {
  window.open('/xuewaiyu/privacy.html', '_blank');
}

async function startGuestMode() {
  try {
    showMsg(t('msg_loading'), 'info');
    const deviceId = 'guest_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    const resp = await fetch('/api/auth/guest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ deviceId })
    });
    const data = await resp.json();
    if (data.success) {
      try { localStorage.setItem('yandao_guest_id_v1', data.guestId || ''); } catch(e) {}
      window.location.href = '/xuewaiyu/guest.html';
    } else {
      showMsg(data.error || t('msg_guest_unavailable'), 'error');
    }
  } catch (e) {
    showMsg(t('msg_guest_unavailable'), 'error');
  }
}

function wechatRegister() {
  showMsg(t('msg_loading'), 'info');
  // WeChat OAuth redirect
  const redirectUri = encodeURIComponent(window.location.origin + '/xuewaiyu/home.html');
  window.location.href = '/api/auth/wechat?redirect=' + redirectUri;
}

// ==================== Event Listeners ====================
document.getElementById('btnSubmit').addEventListener('click', handleSubmit);

document.getElementById('tabs').addEventListener('click', function(e) {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  switchMode(tab.getAttribute('data-mode'));
});

document.getElementById('methodSwitch').addEventListener('click', function(e) {
  const btn = e.target.closest('.method-btn');
  if (!btn) return;
  switchMethod(btn.getAttribute('data-method'));
});

// Enter key to submit
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.activeElement.tagName === 'INPUT') {
    e.preventDefault();
    handleSubmit();
  }
});

// ==================== Init ====================
(function() {
  detectLang();
  updateI18n();
  switchMode('register');
})();
</script>
</body>
