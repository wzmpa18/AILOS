<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #4F46E5;
    --primary-hover: #4338CA;
    --primary-light: #EEF2FF;
    --bg: #F8FAFC;
    --card-bg: #FFFFFF;
    --text: #1E293B;
    --text-secondary: #64748B;
    --text-muted: #94A3B8;
    --border: #E2E8F0;
    --error: #EF4444;
    --success: #10B981;
    --warning: #F59E0B;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 24px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.06), 0 8px 32px rgba(0,0,0,.04);
    --vocab-color: #4F46E5;
    --grammar-color: #EC4899;
    --reading-color: #F59E0B;
    --listening-color: #10B981;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Noto Sans JP', 'Noto Sans KR', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    padding-bottom: 40px;
  }
  .header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
  }
  .back-link {
    font-size: 14px; color: var(--text-secondary); text-decoration: none;
    transition: color .2s; flex-shrink: 0;
  }
  .back-link:hover { color: var(--primary); }
  .header-title {
    font-size: 18px; font-weight: 700; flex: 1;
  }
  .lang-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    background: var(--primary-light); color: var(--primary);
  }
  .lang-switch {
    display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .lang-switch::-webkit-scrollbar { display: none; }
  .lang-flag {
    padding: 4px 10px; border-radius: 20px; font-size: 12px; cursor: pointer;
    border: 1.5px solid transparent; transition: all .2s; color: var(--text-secondary);
    background: transparent; white-space: nowrap; flex-shrink: 0;
  }
  .lang-flag:hover { background: var(--primary-light); color: var(--primary); }
  .lang-flag.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 600; }

  .main-content { padding: 16px 20px; max-width: 600px; margin: 0 auto; }

  /* Guest Tip */
  .guest-tip {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    margin-bottom: 16px; border-radius: var(--radius-sm);
    background: #FFFBEB; border: 1px solid #FCD34D; color: #92400E;
    font-size: 13px;
  }
  .guest-tip-icon { font-size: 20px; flex-shrink: 0; }
  .guest-tip-close {
    margin-left: auto; background: none; border: none; font-size: 18px;
    cursor: pointer; color: #92400E; padding: 0 4px; line-height: 1;
  }

  /* Module Cards */
  .module-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .module-card {
    background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 20px 16px; cursor: pointer; transition: all .2s;
    border: 1.5px solid transparent; position: relative; overflow: hidden;
  }
  .module-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .module-card.vocab:hover { border-color: var(--vocab-color); }
  .module-card.grammar:hover { border-color: var(--grammar-color); }
  .module-card.reading:hover { border-color: var(--reading-color); }
  .module-card.listening:hover { border-color: var(--listening-color); }
  .module-icon {
    width: 44px; height: 44px; border-radius: 12px; display: flex;
    align-items: center; justify-content: center; font-size: 22px; margin-bottom: 12px;
  }
  .module-card.vocab .module-icon { background: #EEF2FF; color: var(--vocab-color); }
  .module-card.grammar .module-icon { background: #FDF2F8; color: var(--grammar-color); }
  .module-card.reading .module-icon { background: #FFFBEB; color: var(--reading-color); }
  .module-card.listening .module-icon { background: #ECFDF5; color: var(--listening-color); }
  .module-title {
    font-size: 15px; font-weight: 700; margin-bottom: 4px;
  }
  .module-desc {
    font-size: 11px; color: var(--text-secondary); margin-bottom: 12px;
    line-height: 1.5;
  }
  .progress-bar-wrap {
    height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 4px;
  }
  .progress-bar-fill {
    height: 100%; border-radius: 3px; transition: width .5s ease;
  }
  .module-card.vocab .progress-bar-fill { background: var(--vocab-color); }
  .module-card.grammar .progress-bar-fill { background: var(--grammar-color); }
  .module-card.reading .progress-bar-fill { background: var(--reading-color); }
  .module-card.listening .progress-bar-fill { background: var(--listening-color); }
  .progress-text {
    font-size: 11px; color: var(--text-muted); text-align: right;
  }

  /* Content Panel */
  .content-panel {
    background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow-md);
    padding: 24px 20px; margin-bottom: 24px; display: none;
  }
  .content-panel.active { display: block; }
  .content-panel-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .content-panel-back {
    width: 32px; height: 32px; border-radius: 8px; display: flex;
    align-items: center; justify-content: center; font-size: 16px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card-bg); color: var(--text-secondary);
    transition: all .2s; flex-shrink: 0;
  }
  .content-panel-back:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
  .content-panel-title { font-size: 16px; font-weight: 700; flex: 1; }
  .content-panel-stats { font-size: 12px; color: var(--text-muted); }

  /* Content Items */
  .content-item {
    padding: 14px 16px; border-radius: var(--radius-sm); margin-bottom: 8px;
    background: var(--bg); border: 1px solid var(--border); cursor: pointer;
    transition: all .2s; display: flex; align-items: center; gap: 12px;
  }
  .content-item:hover { border-color: var(--primary); background: var(--primary-light); }
  .content-item.completed { opacity: .6; }
  .content-item.completed .content-item-check { background: var(--success); border-color: var(--success); }
  .content-item-check {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #fff; transition: all .2s;
  }
  .content-item-info { flex: 1; min-width: 0; }
  .content-item-title { font-size: 14px; font-weight: 600; }
  .content-item-sub { font-size: 11px; color: var(--text-muted); }
  .content-item-arrow { color: var(--text-muted); font-size: 14px; }

  /* Detail View */
  .detail-view {
    padding: 12px 0;
  }
  .detail-word {
    font-size: 32px; font-weight: 800; text-align: center; margin-bottom: 4px;
  }
  .detail-phonetic {
    font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 16px;
  }
  .detail-meaning {
    font-size: 16px; text-align: center; color: var(--text-secondary); margin-bottom: 20px;
  }
  .detail-example {
    background: var(--bg); padding: 14px; border-radius: var(--radius-sm);
    font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.7;
    border-left: 3px solid var(--primary);
  }
  .btn-group { display: flex; gap: 10px; }
  .btn-small {
    flex: 1; padding: 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .2s; border: 1.5px solid var(--border);
    background: var(--card-bg); color: var(--text-secondary);
  }
  .btn-small:hover { border-color: var(--primary); color: var(--primary); }
  .btn-small.primary {
    background: var(--primary); color: #fff; border-color: var(--primary);
  }
  .btn-small.primary:hover { background: var(--primary-hover); }
  .btn-small.success {
    background: var(--success); color: #fff; border-color: var(--success);
  }

  /* Responsive */
  @media (max-width: 375px) {
    .header { padding: 12px 14px; }
    .main-content { padding: 12px 14px; }
    .module-grid { grid-template-columns: 1fr; gap: 10px; }
    .module-card { padding: 16px 14px; }
    .content-panel { padding: 16px 14px; }
    .detail-word { font-size: 26px; }
  }
</style>

// ==================== Language Detection ====================
const LANG_MAP = { 'zh-cn':'zh','zh-tw':'zh','zh-hk':'zh','zh':'zh', 'en':'en','en-us':'en','en-gb':'en', 'ja':'ja','jp':'ja', 'ko':'ko','kr':'ko', 'fr':'fr', 'es':'es', 'de':'de' };
const LANG_NAMES = { zh:'中文', en:'English', ja:'日本語', ko:'한국어', fr:'Français', es:'Español', de:'Deutsch' };

function detectLang() {
  try { const s = localStorage.getItem('yandao_ui_lang_v1'); if (s && I18N[s]) return s; } catch(e) {}
  const nav = (navigator.language || navigator.userLanguage || 'zh-CN').toLowerCase();
  return LANG_MAP[nav] || 'zh';
}

let currentLang = detectLang();
function t(key) { return (I18N[currentLang] && I18N[currentLang][key]) || (I18N['zh'] && I18N['zh'][key]) || key; }

function renderLangSwitch() {
  document.getElementById('langSwitch').innerHTML = Object.keys(LANG_NAMES).map(code =>
    '<span class="lang-flag' + (code === currentLang ? ' active' : '') + '" onclick="switchLang(\'' + code + '\')">' + LANG_NAMES[code] + '</span>'
  ).join('');
}

function switchLang(code) {
  currentLang = code;
  try { localStorage.setItem('yandao_ui_lang_v1', code); } catch(e) {}
  updateI18n();
  renderLangSwitch();
  updateTargetLangTag();
  renderModuleProgress();
  if (currentModule) openModule(currentModule);
}

function updateI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const text = t(key);
    if (text !== undefined) el.textContent = text;
  });
}

// ==================== Guest Detection ====================
function isGuest() {
  try {
    const token = localStorage.getItem('yandao_token_v1')||(function(){try{var a=localStorage.getItem('auth_tokens');if(a){try{var p=JSON.parse(a);return p.accessToken||p.token||a}catch(e){return a}}return null}catch(e){return null}})();
    const guestId = localStorage.getItem('yandao_guest_id_v1');
    return !token && !!guestId;
  } catch(e) { return false; }
}

function isLoggedIn() {
  try { return !!(localStorage.getItem('yandao_token_v1')||(function(){try{var a=localStorage.getItem('auth_tokens');if(a){try{var p=JSON.parse(a);return p.accessToken||p.token||a}catch(e){return a}}return null}catch(e){return null}})()); } catch(e) { return false; }
}

// ==================== Target Language ====================
const TARGET_LANG_KEY = 'yandao_target_lang_v1';
const DEFAULT_TARGET_LANG = 'en';

function getTargetLang() {
  try {
    const s = localStorage.getItem(TARGET_LANG_KEY);
    if (s && I18N[currentLang] && I18N[currentLang]['lang_' + s]) return s;
  } catch(e) {}
  return DEFAULT_TARGET_LANG;
}

function setTargetLang(code) {
  try { localStorage.setItem(TARGET_LANG_KEY, code); } catch(e) {}
  updateTargetLangTag();
}

function updateTargetLangTag() {
  const code = getTargetLang();
  const langName = (I18N[currentLang] && I18N[currentLang]['lang_' + code]) || code;
  document.getElementById('targetLangTag').textContent = '🌐 ' + langName;
}

// ==================== Progress Cache (localStorage) ====================
const PROGRESS_KEY = 'yandao_learn_progress_v1';

function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { vocab: [], grammar: [], reading: [], listening: [] };
}

function saveProgress(progress) {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch(e) {}
}

function markCompleted(module, wordId) {
  const progress = loadProgress();
  if (!progress[module].includes(wordId)) {
    progress[module].push(wordId);
    saveProgress(progress);
  }
  renderModuleProgress();
}

function isCompleted(module, wordId) {
  const progress = loadProgress();
  return progress[module].includes(wordId);
}

function getCompletedCount(module) {
  const progress = loadProgress();
  return progress[module] ? progress[module].length : 0;
}

// ==================== State ====================
let currentModule = null;
let currentDetailIndex = 0;

// ==================== Render Module Progress ====================
function renderModuleProgress() {
  ['vocab','grammar','reading','listening'].forEach(mod => {
    const total = LEARNING_CONTENT[mod].total;
    const completed = getCompletedCount(mod);
    const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
    const fillEl = document.getElementById('progress' + mod.charAt(0).toUpperCase() + mod.slice(1));
    const textEl = document.getElementById('progressText' + mod.charAt(0).toUpperCase() + mod.slice(1));
    if (fillEl) fillEl.style.width = pct + '%';
    if (textEl) textEl.textContent = completed + '/' + total;
  });
}

// ==================== Open Module ====================
function openModule(module) {
  currentModule = module;
  currentDetailIndex = 0;
  const titleKey = LEARNING_CONTENT[module].title_key;
  document.getElementById('contentPanelTitle').textContent = t(titleKey);
  document.getElementById('contentPanel').classList.add('active');
  document.getElementById('moduleGrid').style.display = 'none';
  renderContentList();
}

function closeModule() {
  currentModule = null;
  document.getElementById('contentPanel').classList.remove('active');
  document.getElementById('moduleGrid').style.display = '';
  renderModuleProgress();
}

function renderContentList() {
  if (!currentModule) return;
  const module = currentModule;
  const items = LEARNING_CONTENT[module].items;
  const completed = getCompletedCount(module);
  const total = items.length;
  document.getElementById('contentPanelStats').textContent = completed + '/' + total + ' ' + t('completed_label');

  const body = document.getElementById('contentPanelBody');
  body.innerHTML = items.map((item, idx) => {
    const done = isCompleted(module, item.id);
    const checkContent = done ? '✓' : '';
    const cls = done ? 'completed' : '';
    return `
      <div class="content-item ${cls}" onclick="openDetail(${idx})">
        <div class="content-item-check">${checkContent}</div>
        <div class="content-item-info">
          <div class="content-item-title">${idx + 1}. ${item.word}</div>
          <div class="content-item-sub">${item.phonetic}</div>
        </div>
        <div class="content-item-arrow">›</div>
      </div>
    `;
  }).join('');
}

function openDetail(index) {
  if (!currentModule) return;
  currentDetailIndex = index;
  const item = LEARNING_CONTENT[currentModule].items[index];
  const done = isCompleted(currentModule, item.id);
  const total = LEARNING_CONTENT[currentModule].items.length;
  document.getElementById('contentPanelStats').textContent = (index + 1) + '/' + total;

  const body = document.getElementById('contentPanelBody');
  body.innerHTML = `
    <div class="detail-view">
      <div class="detail-word">${item.word}</div>
      <div class="detail-phonetic">${item.phonetic}</div>
      <div class="detail-meaning">${item.meaning}</div>
      <div class="detail-example">${item.example}</div>
      <div class="btn-group">
        <button class="btn-small" onclick="prevDetail()" ${index === 0 ? 'disabled style="opacity:0.4;cursor:not-allowed"' : ''}>← ${t('btn_prev')}</button>
        <button class="btn-small" onclick="openDetail(${index})" style="display:none"></button>
        ${done ? `
          <button class="btn-small success" disabled style="opacity:0.6">✓ ${t('completed_label')}</button>
        ` : `
          <button class="btn-small primary" onclick="markDone(${index})">${t('btn_mark_done')}</button>
        `}
        <button class="btn-small" onclick="renderContentList()">${t('btn_back_list')}</button>
        <button class="btn-small" onclick="nextDetail()" ${index >= total - 1 ? 'disabled style="opacity:0.4;cursor:not-allowed"' : ''}>${t('btn_next')} →</button>
      </div>
    </div>
  `;
}

function prevDetail() {
  if (currentDetailIndex > 0) openDetail(currentDetailIndex - 1);
}

function nextDetail() {
  if (!currentModule) return;
  const total = LEARNING_CONTENT[currentModule].items.length;
  if (currentDetailIndex < total - 1) openDetail(currentDetailIndex + 1);
}

function markDone(index) {
  if (!currentModule) return;
  const item = LEARNING_CONTENT[currentModule].items[index];
  markCompleted(currentModule, item.id);
  openDetail(index);
  updateContentPanelStats();
}

function updateContentPanelStats() {
  if (!currentModule) return;
  const completed = getCompletedCount(currentModule);
  const total = LEARNING_CONTENT[currentModule].items.length;
  document.getElementById('contentPanelStats').textContent = completed + '/' + total + ' ' + t('completed_label');
}

// ==================== Guest Mode ====================
function dismissGuestTip() {
  document.getElementById('guestTip').style.display = 'none';
  try { localStorage.setItem('yandao_guest_tip_dismissed_v1', '1'); } catch(e) {}
}

function showGuestTipIfNeeded() {
  if (isGuest()) {
    try {
      const dismissed = localStorage.getItem('yandao_guest_tip_dismissed_v1');
      if (!dismissed) {
        document.getElementById('guestTip').style.display = 'flex';
      }
    } catch(e) {
      document.getElementById('guestTip').style.display = 'flex';
    }
  }
}
