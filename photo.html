<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拍照翻译 - 言道</title>
<style>
  :root { --brand:#4f6ef7; --bg:#f5f6fa; --card:#fff; --txt:#1f2430; --sub:#7a8194; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); padding-bottom:90px; }
  .top { background:linear-gradient(135deg,#4f6ef7,#7f53f5); color:#fff; padding:18px 16px 22px; }
  .top h1 { font-size:20px; }
  .top .quota { font-size:12px; opacity:.9; margin-top:6px; }
  .wrap { padding:14px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(40,60,120,.06); }
  .upload-zone { border:2px dashed #c9d2f0; border-radius:12px; padding:36px 12px; text-align:center; color:var(--sub); cursor:pointer; }
  .upload-zone.drag { border-color:var(--brand); background:#f0f3ff; }
  .upload-zone .ico { font-size:40px; display:block; margin-bottom:8px; }
  #preview { max-width:100%; max-height:260px; border-radius:10px; display:none; margin:10px auto 0; }
  .btn { display:block; width:100%; padding:13px; border:0; border-radius:12px; background:var(--brand); color:#fff; font-size:16px; font-weight:600; cursor:pointer; margin-top:12px; }
  .btn:disabled { background:#b9c2e8; }
  .btn.ghost { background:#eef1fb; color:var(--brand); }
  .sec-title { font-size:13px; color:var(--sub); margin:2px 0 8px; letter-spacing:1px; }
  .otext { white-space:pre-wrap; font-size:15px; line-height:1.6; }
  .trans { font-size:17px; line-height:1.7; font-weight:600; }
  .expl { font-size:14px; line-height:1.7; color:#444c63; }
  .word-item, .sent-item { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #f0f1f6; }
  .word-item:last-child, .sent-item:last-child { border-bottom:0; }
  .w-main { font-size:16px; font-weight:600; }
  .w-sub { font-size:12px; color:var(--sub); margin-top:2px; }
  .add-btn { flex:none; padding:6px 14px; border-radius:20px; border:1px solid var(--brand); background:#fff; color:var(--brand); font-size:13px; cursor:pointer; }
  .add-btn.done { background:var(--brand); color:#fff; }
  #loading { display:none; text-align:center; padding:26px 0; color:var(--sub); }
  .spinner { width:30px; height:30px; border:3px solid #dfe4f7; border-top-color:var(--brand); border-radius:50%; margin:0 auto 10px; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #result { display:none; }
  .toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:rgba(30,34,50,.92); color:#fff; padding:10px 18px; border-radius:22px; font-size:14px; z-index:999; opacity:0; transition:opacity .25s; pointer-events:none; max-width:86%; text-align:center; }
  .toast.show { opacity:1; }
  .upgrade-mask { position:fixed; inset:0; background:rgba(20,24,40,.55); z-index:998; display:none; align-items:center; justify-content:center; padding:24px; }
  .upgrade-box { background:#fff; border-radius:16px; padding:24px 20px; max-width:340px; text-align:center; }
  .upgrade-box h3 { margin-bottom:8px; }
  .upgrade-box p { font-size:14px; color:var(--sub); margin-bottom:16px; line-height:1.6; }
</style>
</head>
<body>
<div class="top">
  <h1>📷 拍照翻译</h1>
  <div class="quota" id="quotaBar">今日免费额度加载中…</div>
</div>
<div class="wrap">
  <div class="card">
    <div class="upload-zone" id="zone">
      <span class="ico">🖼️</span>
      点击选择图片 / 拍照<br><small>支持 JPG · PNG，5MB 以内</small>
      <img id="preview" alt="preview">
    </div>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
    <button class="btn" id="goBtn" disabled>识别并翻译</button>
  </div>

  <div id="loading" class="card"><div class="spinner"></div>识别翻译中…</div>

  <div id="result">
    <div class="card"><div class="sec-title">原文（OCR）</div><div class="otext" id="rOriginal"></div></div>
    <div class="card"><div class="sec-title">译文</div><div class="trans" id="rTrans"></div></div>
    <div class="card"><div class="sec-title">母语解析</div><div class="expl" id="rExpl"></div></div>
    <div class="card" id="wordsCard" style="display:none"><div class="sec-title">生词 · 点击加入词汇本</div><div id="rWords"></div></div>
    <div class="card" id="sentsCard" style="display:none"><div class="sec-title">重点句型 · 点击加入错题本</div><div id="rSents"></div></div>
  </div>
</div>

<div class="upgrade-mask" id="upgradeMask">
  <div class="upgrade-box">
    <h3>今日免费额度已用完</h3>
    <p id="upgradeMsg">免费拍照翻译每日 50 张。开通会员套餐即可享受更多识别额度。</p>
    <button class="btn" onclick="location.href='profile.html'">查看套餐</button>
    <button class="btn ghost" onclick="document.getElementById('upgradeMask').style.display='none'">我知道了</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="assets/common.js?v=20260726b"></script>
<script>
(function () {
  var API = '';
  var token = (function () {
    try {
      var t = localStorage.getItem('yandao_token_v1');
      if (t) return t;
      var a = localStorage.getItem('auth_tokens');
      if (a) { var j = JSON.parse(a); return j.accessToken || j.access_token || ''; }
    } catch (e) {}
    return '';
  })();
  if (!token) { location.replace('login.html'); return; }

  var imgB64 = null, mime = 'image/jpeg';
  var zone = document.getElementById('zone'), file = document.getElementById('file');
  var goBtn = document.getElementById('goBtn'), preview = document.getElementById('preview');

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2600);
  }
  function hdrs() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }; }

  function refreshQuota() {
    fetch(API + '/api/translate/photo/quota', { headers: hdrs() })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.success) {
          var q = d.data;
          document.getElementById('quotaBar').textContent =
            '今日免费额度：剩余 ' + q.remaining + ' / ' + q.dailyFreeLimit + ' 张' +
            (q.globalFuseTriggered ? '（全局保护已触发，暂不可用）' : '');
        }
      }).catch(function () {});
  }
  refreshQuota();

  zone.addEventListener('click', function () { file.click(); });
  file.addEventListener('change', function () {
    var f = file.files[0];
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) { toast('图片超过 5MB'); return; }
    mime = f.type || 'image/jpeg';
    var rd = new FileReader();
    rd.onload = function () {
      var s = String(rd.result);
      imgB64 = s.substring(s.indexOf(',') + 1);
      preview.src = s; preview.style.display = 'block';
      goBtn.disabled = false;
    };
    rd.readAsDataURL(f);
  });

  goBtn.addEventListener('click', function () {
    if (!imgB64) return;
    goBtn.disabled = true;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('result').style.display = 'none';
    // 合规：不传任何语言参数，语言由服务端从用户库配置解析
    fetch(API + '/api/translate/photo', {
      method: 'POST', headers: hdrs(),
      body: JSON.stringify({ imageBase64: imgB64, mimeType: mime })
    }).then(function (r) { return r.json().then(function (j) { return { st: r.status, j: j }; }); })
      .then(function (rs) {
        document.getElementById('loading').style.display = 'none';
        goBtn.disabled = false;
        var j = rs.j;
        if (!j.success) {
          var code = j.error && j.error.code;
          if (code === 'OCR_QUOTA_EXCEEDED') {
            document.getElementById('upgradeMsg').textContent = j.error.message;
            document.getElementById('upgradeMask').style.display = 'flex';
          } else if (code === 'LANG_CONFIG_INCOMPLETE') {
            location.replace('onboarding.html');
          } else {
            toast((j.error && j.error.message) || '翻译失败，请重试');
          }
          refreshQuota();
          return;
        }
        render(j.data);
        refreshQuota();
      })
      .catch(function () {
        document.getElementById('loading').style.display = 'none';
        goBtn.disabled = false;
        toast('网络异常，请重试');
      });
  });

  function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  function render(d) {
    document.getElementById('rOriginal').textContent = d.originalText;
    document.getElementById('rTrans').textContent = d.translation;
    document.getElementById('rExpl').textContent = d.nativeExplanation || '—';
    var wc = document.getElementById('wordsCard'), ws = document.getElementById('rWords');
    var sc = document.getElementById('sentsCard'), ss = document.getElementById('rSents');
    ws.innerHTML = ''; ss.innerHTML = '';
    (d.words || []).forEach(function (w) {
      var div = document.createElement('div'); div.className = 'word-item';
      div.innerHTML = '<div><div class="w-main">' + esc(w.word) + '</div><div class="w-sub">' +
        esc(w.reading ? w.reading + ' · ' : '') + esc(w.meaning) + '</div></div>';
      div.appendChild(addBtn('word', w));
      ws.appendChild(div);
    });
    (d.sentences || []).forEach(function (s) {
      var div = document.createElement('div'); div.className = 'sent-item';
      div.innerHTML = '<div><div class="w-main" style="font-size:14px">' + esc(s.sentence) +
        '</div><div class="w-sub">' + esc(s.meaning) + '</div></div>';
      div.appendChild(addBtn('sentence', s));
      ss.appendChild(div);
    });
    wc.style.display = (d.words || []).length ? 'block' : 'none';
    sc.style.display = (d.sentences || []).length ? 'block' : 'none';
    document.getElementById('result').style.display = 'block';
  }

  function addBtn(type, item) {
    var b = document.createElement('button');
    b.className = 'add-btn'; b.textContent = type === 'word' ? '+ 词汇本' : '+ 错题本';
    b.onclick = function () {
      if (b.classList.contains('done')) return;
      b.disabled = true;
      fetch(API + '/api/translate/notebook', {
        method: 'POST', headers: hdrs(),
        body: JSON.stringify({
          type: type, word: item.word, sentence: item.sentence,
          reading: item.reading || '', meaning: item.meaning || ''
        })
      }).then(function (r) { return r.json(); })
        .then(function (j) {
          b.disabled = false;
          if (j.success) { b.classList.add('done'); b.textContent = '已加入'; toast('已加入复习队列'); }
          else toast((j.error && j.error.message) || '加入失败');
        })
        .catch(function () { b.disabled = false; toast('网络异常'); });
    };
    return b;
  }
})();
</script>
</body>
</html>
