name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ESLint Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies (incl. dev for eslint)
        run: npm install
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint (block on error)
        run: npm run lint
