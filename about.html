<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>关于我们 - 言道学学外语</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f7fa;
      color: #2c3e50;
      line-height: 1.7;
      -webkit-overflow-scrolling: touch;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 28px 24px 24px;
      text-align: center;
    }
    .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .header .subtitle { font-size: 13px; opacity: 0.85; }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .card h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #1a1a2e;
      padding-bottom: 10px;
      border-bottom: 1px solid #f0f0f0;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f9f9f9;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { font-size: 14px; color: #888; }
    .info-value { font-size: 14px; color: #333; font-weight: 500; }
    .icp {
      font-size: 12px;
      color: #999;
      text-align: center;
      margin-top: 10px;
    }
    .icp a {
      color: #999;
      text-decoration: none;
    }
    .icp a:hover { color: #667eea; }
    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #f2f2f2;
      cursor: pointer;
      transition: background 0.15s;
    }
    .link-item:last-child { border-bottom: none; }
    .link-item:active { background: #f9f9f9; margin: 0 -20px; padding: 14px 20px; border-radius: 8px; }
    .link-text { font-size: 15px; color: #333; }
    .link-arrow { color: #ccc; font-size: 18px; }
    .back-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      z-index: 10;
      border: none;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="header">
    <h1>言道学学外语</h1>
    <div class="subtitle">v1.0.1</div>
  </div>

  <div class="container">
    <div class="card">
      <h2>应用信息</h2>
      <div class="info-row">
        <span class="info-label">应用全称</span>
        <span class="info-value">言道学学外语</span>
      </div>
      <div class="info-row">
        <span class="info-label">开发主体</span>
        <span class="info-value">东莞言道科技有限公司</span>
      </div>
      <div class="info-row">
        <span class="info-label">版本号</span>
        <span class="info-value">v1.0.1</span>
      </div>
      <div class="info-row">
        <span class="info-label">包名</span>
        <span class="info-value">com.yandao.xuewaiyu</span>
      </div>
    </div>

    <div class="card">
      <h2>法律与合规</h2>
      <div class="link-item" onclick="window.location.href='terms.html'">
        <span class="link-text">用户服务协议</span>
        <span class="link-arrow">›</span>
      </div>
      <div class="link-item" onclick="window.location.href='privacy.html'">
        <span class="link-text">隐私政策</span>
        <span class="link-arrow">›</span>
      </div>
      <div class="link-item" onclick="window.location.href='membership.html'">
        <span class="link-text">会员服务与收费规则</span>
        <span class="link-arrow">›</span>
      </div>
    </div>

    <div class="card">
      <h2>联系我们</h2>
      <div class="info-row">
        <span class="info-label">官方网站</span>
        <span class="info-value">www.yandao.vip</span>
      </div>
      <div class="info-row">
        <span class="info-label">联系邮箱</span>
        <span class="info-value">support@yandao.vip</span>
      </div>
    </div>

    <div class="icp">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">
        粤ICP备2026071165号-1A
      </a>
    </div>
  </div>
</body>
</html>
