  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #4F46E5;
    --primary-hover: #4338CA;
    --primary-light: #EEF2FF;
    --bg: #F8FAFC;
    --card-bg: #FFFFFF;
    --text: #1E293B;
    --text-secondary: #64748B;
    --text-muted: #94A3B8;
    --border: #E2E8F0;
    --error: #EF4444;
    --success: #10B981;
    --warning: #F59E0B;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 24px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.06), 0 8px 32px rgba(0,0,0,.04);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Noto Sans JP', 'Noto Sans KR', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    line-height: 1.6;
  }
  .container {
    width: 100%; max-width: 420px;
  }
  .back-link {
    display: inline-block; margin-bottom: 12px; font-size: 13px; color: var(--text-secondary);
    text-decoration: none; transition: color .2s;
  }
  .back-link:hover { color: var(--primary); }
  .card {
    background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow-md);
    padding: 36px 28px 28px;
  }
  .logo { text-align: center; margin-bottom: 6px; }
  .logo-icon { font-size: 40px; margin-bottom: 4px; }
  .logo-text { font-size: 24px; font-weight: 800; color: var(--primary); }
  .logo-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    display: flex; justify-content: center; gap: 4px; margin: 16px 0 20px;
  }

    border: 1.5px solid transparent; transition: all .2s; color: var(--text-secondary);
    background: transparent;
  }

  .tabs {
    display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px;
  }
  .tab {
    flex: 1; text-align: center; padding: 10px 0; font-size: 14px; font-weight: 600;
    color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -2px; transition: all .2s;
  }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

  .msg {
    padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px;
    display: none; line-height: 1.5;
  }
  .msg.error { display: block; background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
  .msg.success { display: block; background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
  .form-group input, .form-group select {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); font-size: 15px; transition: border-color .2s;
    font-family: inherit; background: var(--card-bg); color: var(--text);
  }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
  .form-group input.error { border-color: var(--error); }

  .sms-row { display: flex; gap: 10px; }
  .sms-row input { flex: 1; }


  .btn-sms {
    flex-shrink: 0; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
    border: 1.5px solid var(--primary); background: var(--card-bg); color: var(--primary);
    cursor: pointer; transition: all .2s; white-space: nowrap; min-width: 100px;
  }
  .btn-sms:hover { background: var(--primary-light); }
  .btn-sms:disabled { opacity: .5; cursor: not-allowed; }

  .btn-submit {
    width: 100%; padding: 14px; border-radius: var(--radius-sm); font-size: 16px; font-weight: 700;
    border: none; cursor: pointer; background: var(--primary); color: #fff;
    transition: all .2s; margin-top: 4px;
  }
  .btn-submit:hover { background: var(--primary-hover); }
  .btn-submit:disabled { opacity: .6; cursor: not-allowed; }

  .privacy { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
  .privacy a { color: var(--primary); text-decoration: none; }
  .privacy input { accent-color: var(--primary); }

  .footer {
    text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-muted);
  }
  .footer a { color: var(--primary); text-decoration: none; font-weight: 600; }

  .guest-entry { text-align: center; margin-top: 10px; }
  .guest-entry a {
    font-size: 13px; color: var(--text-secondary); text-decoration: none;
    border-bottom: 1px dashed var(--text-muted); padding-bottom: 2px;
  }
  .guest-entry a:hover { color: var(--primary); border-bottom-color: var(--primary); }

  .debug-code { margin-top: 8px; font-size: 12px; color: var(--success); text-align: center; min-height: 18px; }

  @media (max-width: 400px) {
    .card { padding: 24px 18px 20px; }
    .sms-row { flex-direction: column; }
  }
</style>

// ==================== Language Detection ====================
const LANG_MAP = { 'zh-cn':'zh','zh-tw':'zh','zh-hk':'zh','zh':'zh', 'en':'en','en-us':'en','en-gb':'en', 'ja':'ja','jp':'ja', 'ko':'ko','kr':'ko', 'fr':'fr', 'es':'es', 'de':'de' };
const LANG_NAMES = { zh:'中文', en:'English', ja:'日本語', ko:'한국어', fr:'Français', es:'Español', de:'Deutsch' };

function detectLang() {
  try { const s = localStorage.getItem('yandao_ui_lang_v1'); if (s && I18N[s]) return s; } catch(e) {}
  const nav = (navigator.language || navigator.userLanguage || 'zh-CN').toLowerCase();
  return LANG_MAP[nav] || 'zh';
}

let currentLang = detectLang();
function t(key) { return (I18N[currentLang] && I18N[currentLang][key]) || (I18N['zh'] && I18N['zh'][key]) || key; }

// ==================== Render ====================




function updateI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const text = t(key);
    if (text !== undefined) el.textContent = text;
  });
}

// ==================== State ====================
let currentMode = 'login'; // login | register | reset
let currentMethod = 'phone'; // phone | email
let smsTimer = null;
let smsCountdown = 0;
let isSubmitting = false;

// ==================== API ====================
const API_BASE = '/api/auth';

async function apiCall(path, body) {
  const resp = await fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || data.message || 'Request failed');
  return data;
}

// ==================== Form Rendering ====================
function renderForm() {
  const container = document.getElementById('formContent');
  const isLogin = currentMode === 'login';
  const isRegister = currentMode === 'register';
  const isReset = currentMode === 'reset';

  let html = '';

  // Method switch
  if (isLogin) {
    html += '<div class="tabs" style="margin-bottom:16px">';
    html += '<div class="tab' + (currentMethod === 'phone' ? ' active' : '') + '" onclick="switchMethod(\'phone\')" data-i18n="login_method_phone">手机号登录</div>';
    html += '<div class="tab' + (currentMethod === 'email' ? ' active' : '') + '" onclick="switchMethod(\'email\')" data-i18n="login_method_email">邮箱登录</div>';
    html += '</div>';
  } else if (isRegister) {
    html += '<div class="tabs" style="margin-bottom:16px">';
    html += '<div class="tab' + (currentMethod === 'phone' ? ' active' : '') + '" onclick="switchMethod(\'phone\')" data-i18n="register_method_phone">手机号注册</div>';
    html += '<div class="tab' + (currentMethod === 'email' ? ' active' : '') + '" onclick="switchMethod(\'email\')" data-i18n="register_method_email">邮箱注册</div>';
    html += '</div>';
  } else {
    html += '<div class="tabs" style="margin-bottom:16px">';
    html += '<div class="tab' + (currentMethod === 'phone' ? ' active' : '') + '" onclick="switchMethod(\'phone\')" data-i18n="reset_method_phone">手机号找回</div>';
    html += '<div class="tab' + (currentMethod === 'email' ? ' active' : '') + '" onclick="switchMethod(\'email\')" data-i18n="reset_method_email">邮箱找回</div>';
    html += '</div>';
  }

  // Username (register only)
  if (isRegister) {
    html += '<div class="form-group"><label data-i18n="label_username">用户名</label>';
    html += '<input type="text" id="username" placeholder="' + t('label_username') + '">';
    html += '</div>';
  }

  // Phone — 仅支持中国大陆手机号（+86）
  if (currentMethod === 'phone') {
    html += '<div class="form-group"><label data-i18n="label_phone">手机号</label>';
    html += '<input type="tel" id="phone" placeholder="13800138000" style="width:100%">';
    html += '</div>';
  } else {
    html += '<div class="form-group"><label data-i18n="label_email">邮箱</label>';
    html += '<input type="email" id="email" placeholder="example@mail.com">';
    html += '</div>';
  }

  // SMS/Email code (register and reset)
  if (isRegister || isReset) {
    html += '<div class="form-group"><label data-i18n="label_code">验证码</label>';
    html += '<div class="sms-row">';
    html += '<input type="text" id="verificationCode" placeholder="' + t('label_code') + '">';
    html += '<button class="btn-sms" id="btnSendCode" onclick="sendCode()" data-i18n="' + (currentMethod === 'phone' ? 'btn_send_sms' : 'btn_send_email') + '">发送验证码</button>';
    html += '</div></div>';
  }

  // Password
  if (isRegister) {
    html += '<div class="form-group"><label data-i18n="label_password">密码</label>';
    html += '<input type="password" id="password" placeholder="' + t('label_password') + '">';
    html += '</div>';
    html += '<div class="form-group"><label data-i18n="label_confirm_pwd">确认密码</label>';
    html += '<input type="password" id="confirmPassword" placeholder="' + t('label_confirm_pwd') + '">';
    html += '</div>';
  } else if (isReset) {
    html += '<div class="form-group"><label data-i18n="label_new_password">新密码</label>';
    html += '<input type="password" id="password" placeholder="' + t('label_new_password') + '">';
    html += '</div>';
    html += '<div class="form-group"><label data-i18n="label_confirm_pwd">确认密码</label>';
    html += '<input type="password" id="confirmPassword" placeholder="' + t('label_confirm_pwd') + '">';
    html += '</div>';
  } else {
    html += '<div class="form-group"><label data-i18n="label_password">密码</label>';
    html += '<input type="password" id="password" placeholder="' + t('label_password') + '">';
    html += '</div>';
  }

  container.innerHTML = html;

  // Update button text
  const btnLabel = isLogin ? 'btn_login' : (isRegister ? 'btn_register' : 'btn_reset');
  document.getElementById('btnSubmit').setAttribute('data-i18n', btnLabel);
  document.getElementById('btnSubmit').textContent = t(btnLabel);

  // Update privacy checkbox
  document.getElementById('privacyCheck').style.display = isRegister ? 'flex' : 'none';

  // Update footer
  const footerLink = document.getElementById('footerLink');
  if (isLogin) {
    footerLink.setAttribute('data-i18n', 'footer_register');
    footerLink.textContent = t('footer_register');
    footerLink.onclick = () => switchMode('register');
    document.querySelector('.footer span').setAttribute('data-i18n', 'footer_text');
    document.querySelector('.footer span').textContent = t('footer_text');
  } else {
    footerLink.setAttribute('data-i18n', 'footer_login');
    footerLink.textContent = t('footer_login');
    footerLink.onclick = () => switchMode('login');
    document.querySelector('.footer span').setAttribute('data-i18n', 'footer_text_reg');
    document.querySelector('.footer span').textContent = t('footer_text_reg');
  }

  // Re-apply i18n to new elements
  updateI18n();
}

function switchMode(mode) {
  currentMode = mode;
  currentMethod = 'phone';
  document.getElementById('msg').className = 'msg';
  document.getElementById('msg').innerHTML = '';
  document.getElementById('debugCode').textContent = '';
  // Update tabs
  document.querySelectorAll('#tabs .tab').forEach(t => {
    t.classList.toggle('active', t.getAttribute('data-mode') === mode);
  });
  renderForm();
}

function switchMethod(method) {
  currentMethod = method;
  renderForm();
}

// ==================== SMS/Email Code ====================
async function sendCode() {
  if (smsCountdown > 0) return;
  const btn = document.getElementById('btnSendCode');
  const rawPhone = document.getElementById('phone')?.value?.trim();
  const phone = rawPhone ? rawPhone.replace(/^\+86\s*/, '') : ''; // Strip +86 prefix, backend adds it
  const email = document.getElementById('email')?.value?.trim();

  if (currentMethod === 'phone' && !phone) {
    showMsg(t('msg_enter_phone'), 'error'); return;
  }
  if (currentMethod === 'email' && !email) {
    showMsg(t('msg_enter_email'), 'error'); return;
  }
  if (currentMethod === 'phone' && !/^[0-9]{7,15}$/.test(phone)) {
    showMsg(t('msg_phone_invalid'), 'error'); return;
  }
  if (currentMethod === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMsg(t('msg_email_invalid'), 'error'); return;
  }

  btn.disabled = true;
  btn.textContent = t('msg_sending');
  showMsg('', '');

  try {
    const path = currentMethod === 'phone' ? '/send-code' : '/send-email-code';
    const body = currentMethod === 'phone' ? { phone } : { email };
    await apiCall(path, body);
    showMsg(t('msg_code_sent'), 'success');
    startCountdown();
  } catch (e) {
    showMsg(e.message || t('msg_code_send_failed'), 'error');
    btn.disabled = false;
    btn.textContent = t(currentMethod === 'phone' ? 'btn_send_sms' : 'btn_send_email');
  }
}

function startCountdown() {
  smsCountdown = 60;
  const btn = document.getElementById('btnSendCode');
  const baseText = t('retry_text');
  const suffix = t('retry_after');
  btn.textContent = smsCountdown + suffix;
  smsTimer = setInterval(() => {
    smsCountdown--;
    if (smsCountdown <= 0) {
      clearInterval(smsTimer);
      btn.disabled = false;
      btn.textContent = baseText;
    } else {
      btn.textContent = smsCountdown + suffix;
    }
  }, 1000);
}

// ==================== Submit ====================
async function handleSubmit() {
  if (isSubmitting) return;
  const isLogin = currentMode === 'login';
  const isRegister = currentMode === 'register';
  const isReset = currentMode === 'reset';

  const rawPhone = document.getElementById('phone')?.value?.trim();
  const phone = rawPhone ? rawPhone.replace(/^\+86\s*/, '') : ''; // Strip +86 prefix, backend adds it
  const email = document.getElementById('email')?.value?.trim();
  const code = document.getElementById('verificationCode')?.value?.trim();
  const password = document.getElementById('password')?.value?.trim();
  const confirmPassword = document.getElementById('confirmPassword')?.value?.trim();
  const username = document.getElementById('username')?.value?.trim();
  const agreePrivacy = document.getElementById('agreePrivacy')?.checked;

  // Validation
  if (isRegister && !username) { showMsg(t('msg_enter_username'), 'error'); return; }
  if (currentMethod === 'phone' && !phone) { showMsg(t('msg_enter_phone'), 'error'); return; }
  if (currentMethod === 'email' && !email) { showMsg(t('msg_enter_email'), 'error'); return; }
  if ((isRegister || isReset) && !code) { showMsg(t('msg_enter_code'), 'error'); return; }
  if (!password) { showMsg(t('msg_enter_password'), 'error'); return; }
  if ((isRegister || isReset) && password !== confirmPassword) { showMsg(t('msg_password_mismatch'), 'error'); return; }
  if (isRegister && !agreePrivacy) { showMsg(t('msg_agree'), 'error'); return; }

  isSubmitting = true;
  document.getElementById('btnSubmit').disabled = true;
  document.getElementById('btnSubmit').textContent = t('msg_loading');
  showMsg('', '');

  try {
    let result;
    if (isLogin) {
      // BUG-017 fix: 密码登录统一走 /api/auth/password（/phone 为短信验证码登录，需 code）
      const identifier = currentMethod === 'phone' ? phone : email;
      result = await apiCall('/password', {
        account: identifier,
        phone: currentMethod === 'phone' ? phone : undefined,
        email: currentMethod === 'email' ? email : undefined,
        password,
      });
    } else if (isRegister) {
      result = await apiCall('/register', {
        phone: currentMethod === 'phone' ? phone : undefined,
        email: currentMethod === 'email' ? email : undefined,
        code, password, username, method: currentMethod,
      });
    } else {
      result = await apiCall('/password', {
        phone: currentMethod === 'phone' ? phone : undefined,
        email: currentMethod === 'email' ? email : undefined,
        code, newPassword: password, method: currentMethod,
      });
    }

    // BUG-018 fix: 后端 token 返回在 result.tokens.{accessToken,refreshToken}，兼容旧 result.token
    const accessToken = result.token || (result.tokens && result.tokens.accessToken);
    const refreshTok = result.refreshToken || (result.tokens && result.tokens.refreshToken);
    if (accessToken) {
      try { localStorage.setItem('yandao_token_v1', accessToken); localStorage.setItem('auth_tokens', JSON.stringify({accessToken:accessToken})); } catch(e) {}
    }
    if (refreshTok) {
      try { localStorage.setItem('yandao_refresh_token_v1', refreshTok); } catch(e) {}
    }

    const successMsg = isLogin ? t('msg_login_success') : (isRegister ? t('msg_register_success') : t('msg_reset_success'));
    showMsg(successMsg, 'success');

    setTimeout(() => {
      let dest = isReset ? '/login' : '/xuewaiyu/home';
      try {
        // 蓝图 Stage 2 引导闸：未完成首次引导则进入完整引导流程（身份→语言→定级→目标→伴读→计划）
        if (!isReset && !localStorage.getItem('yandao_onboarding_done') && !localStorage.getItem('yandao_level_assessment')) {
          dest = '/xuewaiyu/onboarding.html';
        } else if (!isReset) {
          // 支持 ?redirect= 回跳（如从成长中心等需登录页跳来）。
          // 仅允许站内 /xuewaiyu/ 开头的相对路径，防止开放重定向到外部站点。
          const rd = new URLSearchParams(location.search).get('redirect');
          if (rd && /^\/xuewaiyu\//.test(rd) && !/^\/\//.test(rd)) dest = rd;
        }
      } catch (e) {}
      window.location.href = dest;
    }, 1200);
  } catch (e) {
    showMsg(e.message || t('msg_operation_failed'), 'error');
    isSubmitting = false;
    document.getElementById('btnSubmit').disabled = false;
    const btnLabel = isLogin ? 'btn_login' : (isRegister ? 'btn_register' : 'btn_reset');
    document.getElementById('btnSubmit').textContent = t(btnLabel);
  }
}

// ==================== Helpers ====================
function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.className = 'msg ' + (type || '');
  el.innerHTML = text;
}

function showPrivacy() {
  alert('Privacy Policy - AILOS');
}

// ==================== Init ====================
document.getElementById('btnSubmit').addEventListener('click', handleSubmit);

// Auto-detect guest mode from URL parameter (?mode=guest)
(function() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('mode') === 'guest') {
    showMsg(t('msg_guest_tip'), 'success');
    setTimeout(() => startGuestMode(), 600);
  }
})();

async function startGuestMode() {
  try {
    showMsg(t('msg_loading'), 'info');
    const deviceId = 'guest_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    const resp = await fetch('/api/auth/guest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ deviceId })
    });
    const data = await resp.json();
    if (data.success) {
      try { localStorage.setItem('yandao_guest_id_v1', data.guestId || ''); } catch(e) {}
      window.location.href = '/xuewaiyu/guest.html';
    } else {
      showMsg(data.error || t('msg_guest_unavailable'), 'error');
    }
  } catch (e) {
    showMsg(t('msg_guest_unavailable'), 'error');
  }
}

renderForm();
updateI18n();
