<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#4F46E5">
<title>言道学学外语 - 消息中心</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #4F46E5; --primary-hover: #4338CA; --primary-light: #EEF2FF;
    --bg: #F8FAFC; --card-bg: #FFFFFF; --text: #1E293B;
    --text-secondary: #64748B; --text-muted: #94A3B8; --border: #E2E8F0;
    --error: #EF4444; --success: #10B981; --warning: #F59E0B;
    --radius: 16px; --radius-sm: 10px; --radius-xs: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.06); --shadow-md: 0 4px 12px rgba(0,0,0,.08);
    --nav-height: 64px; --chat-input-h: 60px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Noto Sans JP', system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6;
    padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 0));
  }

  /* ===== Header ===== */
  .header {
    background: var(--card-bg); border-bottom: 1px solid var(--border);
    padding: 12px 16px; position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 12px;
  }
  .header-back { font-size: 14px; color: var(--text-secondary); text-decoration: none; flex-shrink: 0; }
  .header-title { font-size: 17px; font-weight: 700; flex: 1; }
  .header-avatar {
    width: 20px; height: 20px; border-radius: 50%; background: var(--border); margin-left: auto;
    display: none; /* Only in chat view */
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999;
    padding: 10px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
    background: var(--card-bg); box-shadow: var(--shadow-md); display: none;
  }
  .toast.show { display: block; }
  .toast.error { color: var(--error); border: 1.5px solid var(--error); }
  .toast.success { color: var(--success); border: 1.5px solid var(--success); }

  /* ===== Conversation List View ===== */
  #convListView { display: block; }
  #convListView.hidden { display: none; }
  .conv-search {
    padding: 10px 16px;
  }
  .conv-search input {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text); outline: none;
    transition: border-color .2s;
  }
  .conv-search input:focus { border-color: var(--primary); }
  .conv-search input::placeholder { color: var(--text-muted); }

  .conv-list { margin: 0 12px; display: flex; flex-direction: column; gap: 4px; }
  .conv-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: var(--card-bg); border-radius: var(--radius-sm); box-shadow: var(--shadow);
    cursor: pointer; transition: all .15s; position: relative;
  }
  .conv-item:hover { box-shadow: var(--shadow-md); }
  .conv-item:active { background: var(--primary-light); }
  .conv-item.unread .conv-name { font-weight: 700; color: var(--text); }
  .conv-avatar {
    width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #fff;
  }
  .conv-info { flex: 1; min-width: 0; }
  .conv-name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-preview { font-size: 13px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .conv-meta { font-size: 11px; color: var(--text-muted); text-align: right; flex-shrink: 0; }
  .conv-badge {
    display: inline-block; min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px;
    background: var(--primary); color: #fff; font-size: 10px; font-weight: 700; text-align: center;
    padding: 0 5px; margin-top: 4px;
  }

  /* ===== Chat Detail View ===== */
  #chatView { display: none; }
  #chatView.active { display: flex; flex-direction: column; height: calc(100vh - var(--nav-height) - env(safe-area-inset-bottom, 0)); }
  .chat-header {
    background: var(--card-bg); border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  .chat-header-back { font-size: 13px; color: var(--primary); cursor: pointer; border: none; background: none; font-weight: 600; }
  .chat-header-title { font-size: 16px; font-weight: 700; flex: 1; }
  .chat-header-status { font-size: 11px; color: var(--text-muted); }

  .chat-messages {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .chat-msg { display: flex; gap: 8px; max-width: 80%; animation: msgIn .2s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .chat-msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .chat-msg-bubble {
    padding: 10px 14px; border-radius: var(--radius-sm); font-size: 14px; line-height: 1.5;
    word-wrap: break-word; overflow-wrap: break-word; position: relative;
  }
  .chat-msg:not(.me) .chat-msg-bubble { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); }
  .chat-msg.me .chat-msg-bubble { background: var(--primary); color: #fff; }
  .chat-msg-revoked .chat-msg-bubble { background: var(--bg) !important; color: var(--text-muted) !important; font-style: italic; border: 1px dashed var(--border) !important; }
  .chat-msg-time { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .chat-msg.me .chat-msg-time { text-align: right; }
  .chat-msg-status { font-size: 10px; color: var(--text-muted); }
  .chat-date-divider { text-align: center; font-size: 11px; color: var(--text-muted); padding: 8px 0; }
  .chat-system-msg { text-align: center; font-size: 12px; color: var(--text-muted); padding: 4px 0; }
  .chat-load-more { text-align: center; padding: 12px; }
  .chat-load-more button {
    padding: 6px 16px; border-radius: var(--radius-xs); border: 1.5px solid var(--border);
    background: var(--card-bg); color: var(--primary); font-size: 12px; cursor: pointer; font-weight: 600;
  }

  /* Chat Input */
  .chat-input-bar {
    display: flex; gap: 8px; padding: 10px 12px; background: var(--card-bg);
    border-top: 1px solid var(--border); flex-shrink: 0;
    align-items: center;
  }
  .chat-input-bar input {
    flex: 1; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 20px;
    font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text); outline: none;
    transition: border-color .2s;
  }
  .chat-input-bar input:focus { border-color: var(--primary); }
  .chat-input-bar input::placeholder { color: var(--text-muted); }
  .chat-input-bar button {
    width: 38px; height: 38px; border-radius: 50%; border: none; flex-shrink: 0;
    background: var(--primary); color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .chat-input-bar button:hover { background: var(--primary-hover); }
  .chat-input-bar button:disabled { opacity: .5; }

  /* ===== Empty State ===== */
  .empty-state {
    text-align: center; padding: 80px 20px; color: var(--text-muted);
  }
  .empty-state.hidden { display: none; }
  .empty-icon { font-size: 56px; margin-bottom: 12px; opacity: .6; }
  .empty-title { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }

  /* ===== Context Menu ===== */
  .context-menu {
    position: fixed; z-index: 999; background: var(--card-bg); border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md); padding: 4px; display: none; min-width: 130px;
  }
  .context-menu.show { display: block; }
  .context-menu .menu-item {
    padding: 10px 14px; font-size: 14px; cursor: pointer; border-radius: var(--radius-xs);
    color: var(--text); transition: background .15s; display: block; width: 100%; text-align: left;
    border: none; background: none; font-family: inherit;
  }
  .context-menu .menu-item:hover { background: var(--primary-light); }
  .context-menu .menu-item.danger { color: var(--error); }
  .context-menu .menu-item.danger:hover { background: #FEF2F2; }

  /* ===== Bottom Nav ===== */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height);
    background: var(--card-bg); border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; align-items: center;
    z-index: 500; padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .bottom-nav .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 12px; cursor: pointer; text-decoration: none;
    color: var(--text-muted); font-size: 11px; font-weight: 500; border: none;
    background: none; min-width: 56px;
  }
  .bottom-nav .nav-item .nav-icon { font-size: 22px; line-height: 1; }
  .bottom-nav .nav-item.active { color: var(--primary); font-weight: 700; }

  @media (max-width: 480px) {
    .chat-msg { max-width: 90%; }
    .chat-messages { padding: 10px; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header" id="mainHeader">
  <a class="header-back" href="/xuewaiyu/home">&#8592; 返回</a>
  <span class="header-title" id="headerTitle" data-i18n="messages_title">消息</span>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Conversation List View -->
<div id="convListView">
  <div class="conv-search">
    <input type="text" id="convSearch" placeholder="搜索会话..." data-i18n-placeholder="search_conv_placeholder" oninput="filterConvs()">
  </div>
  <div class="conv-list" id="convList"><div class="loading">加载中…</div></div>
  <div class="empty-state" id="emptyConvState">
    <div class="empty-icon">💬</div>
    <div class="empty-title" data-i18n="no_messages">暂无消息</div>
    <div style="font-size:13px;color:var(--text-muted);max-width:260px;margin:0 auto" data-i18n="no_messages_sub">添加好友后即可开始聊天</div>
  </div>
</div>

<!-- Chat Detail View -->
<div id="chatView">
  <div class="chat-header">
    <button class="chat-header-back" onclick="backToList()">&#8592; 返回</button>
    <div>
      <div class="chat-header-title" id="chatTitle"></div>
      <div class="chat-header-status" id="chatStatus"></div>
    </div>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="chat-load-more" id="loadMoreBtn" style="display:none">
      <button onclick="loadMore()" data-i18n="load_earlier">加载更早消息</button>
    </div>
  </div>
  <div class="chat-input-bar">
    <input type="text" id="chatInput" placeholder="输入消息..." data-i18n-placeholder="chat_input_placeholder" onkeydown="if(event.key==='Enter')sendMsg()" maxlength="5000">
    <button id="chatSendBtn" onclick="sendMsg()">&#8593;</button>
  </div>
</div>

<!-- Context Menu -->
<div class="context-menu" id="contextMenu">
  <button class="menu-item" onclick="copyMsg()" data-i18n="copy">复制</button>
  <button class="menu-item danger" onclick="revokeMsg()" data-i18n="revoke">撤回</button>
</div>

<!-- Bottom Nav injected by common.js (Stage9 M5: Community 4-Tab) -->

<script src="/xuewaiyu/assets/common.js?v=20260808p7"></script>
<script>

function getAilosToken() {
  var t = localStorage.getItem('yandao_token_v1') || localStorage.getItem('ailos_token');
  if (!t) {
    try { var s = JSON.parse(localStorage.getItem('auth_tokens') || localStorage.getItem('ailos_session') || '{}'); t = s.accessToken || s.access_token; } catch(e) {}
  }
  return t;
}
function getAilosHeaders() {
  var t = getAilosToken();
  return t ? { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t } : { 'Content-Type': 'application/json' };
}

// ===== i18n =====
var I18N = {
  zh: {
    messages_title:'消息',search_conv_placeholder:'搜索会话...',no_messages:'暂无消息',no_messages_sub:'添加好友后即可开始聊天',
    load_earlier:'加载更早消息',chat_input_placeholder:'输入消息...',copy:'复制',revoke:'撤回',
    revoked:'[消息已撤回]',msg_revoked:'消息已撤回',cannot_revoke:'超过2分钟无法撤回',not_self_msg:'只能撤回自己的消息',
    nav_home:'首页',nav_friends:'好友',nav_messages:'消息',nav_discover:'搭子',
    group_chat:'群聊',single_chat:'单聊',online:'在线',sent:'发送成功',muted_notice:'全员禁言中',
    error_network:'网络错误'
  },
  en: {
    messages_title:'Messages',search_conv_placeholder:'Search conversations...',no_messages:'No messages',no_messages_sub:'Add friends to start chatting',
    load_earlier:'Load earlier',chat_input_placeholder:'Type a message...',copy:'Copy',revoke:'Revoke',
    revoked:'[Message revoked]',msg_revoked:'Message revoked',cannot_revoke:'Cannot revoke after 2 minutes',not_self_msg:'Can only revoke your own messages',
    nav_home:'Home',nav_friends:'Friends',nav_messages:'Messages',nav_discover:'Partners',
    group_chat:'Group Chat',single_chat:'Chat',online:'Online',sent:'Sent',muted_notice:'Muted',
    error_network:'Network error'
  }
};

function detectLang() {
  try { var s = localStorage.getItem('yandao_ui_lang_v1'); if (s && I18N[s]) return s; } catch(e) {}
  return 'zh';
}
var currentLang = detectLang();
function t(k) { return (I18N[currentLang] && I18N[currentLang][k]) || (I18N['zh'] && I18N['zh'][k]) || k; }
function updateUI() {
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var k = el.getAttribute('data-i18n'); el.textContent = t(k);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
    el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder')));
  });
}
window.addEventListener('languageChanged', function() { currentLang = detectLang(); updateUI(); loadConversations(); });

// ===== API =====
function getToken() {
  try {
    var t = localStorage.getItem('yandao_token_v1'); if (t) return t;
    var a = localStorage.getItem('auth_tokens');
    if (a) { try { var p = JSON.parse(a); return p.accessToken || p.token; } catch(e) {} }
  } catch(e) {}
  return null;
}

var API = '/xuewaiyu/api/v1/social';
async function api(method, path, body) {
  var token = getToken(); if (!token) throw new Error('NOT_AUTH');
  var opts = { method: method, headers: { 'Authorization': 'Bearer ' + token } };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  var r = await fetch(API + path, opts);
  var j = await r.json();
  if (j && j.success) return j.data || j;
  throw new Error((j && j.error) || (j && j.message) || 'NET_ERR');
}

// ===== Toast =====
function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast ' + (type || 'success') + ' show';
  clearTimeout(el._t); el._t = setTimeout(function() { el.classList.remove('show'); }, 3000);
}

// ===== Avatar =====
function avatarColor(name) {
  var c = ['#4F46E5','#7C3AED','#DB2777','#DC2626','#EA580C','#CA8A04','#16A34A','#0891B2','#2563EB','#9333EA'];
  var h = 0; for (var i = 0; i < (name||'').length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return c[Math.abs(h) % c.length];
}
function avatarText(name) { return (name || '?').charAt(0).toUpperCase(); }
function avatarImgMsg(avatarUrl, name) {
  if (avatarUrl) return '<img src="' + avatarUrl + '" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
  return '<img src="/xuewaiyu/assets/images/default_avatar.png" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
}

// ===== Time format =====
function formatTime(dt) {
  if (!dt) return '';
  var d = new Date(dt);
  var now = new Date();
  var isToday = d.toDateString() === now.toDateString();
  var pad2 = function(n) { return n < 10 ? '0' + n : n; };
  var hhmm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  if (isToday) return hhmm;
  var yesterday = new Date(now); yesterday.setDate(yesterday.getDate() - 1);
  if (d.toDateString() === yesterday.toDateString()) return '昨天 ' + hhmm;
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + hhmm;
}

// ===== Conversation List =====
var allConvs = [];

async function loadConversations() {
  try {
    var convs = await api('GET', '/conversations');
    allConvs = Array.isArray(convs) ? convs : (convs.conversations || []);
    renderConvs(allConvs);
  } catch (e) { if (e.message !== 'NOT_AUTH') showToast(t('error_network'), 'error'); }
}

function renderConvs(convs) {
  var list = document.getElementById('convList');
  var empty = document.getElementById('emptyConvState');

  if (!convs || convs.length === 0) {
    list.innerHTML = ''; empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  var html = '';
  for (var i = 0; i < convs.length; i++) {
    var c = convs[i];
    var name = c.targetId ? ('会话 ' + c.targetId.substring(0, 8)) : (c.type === 'group' ? t('group_chat') : t('single_chat'));
    var preview = c.lastMsgPreview || '';
    var type = c.type === 'group' ? ' [群]' : '';
    html += '<div class="conv-item" onclick="openChat(\'' + c.id + '\',\'' + c.type + '\',\'' + c.targetId + '\')">';
    var av = c.avatar || c.targetAvatar || null;
    html += '<div class="conv-avatar" style="background:' + avatarColor(name) + '">' + avatarImgMsg(av, name) + '</div>';
    html += '<div class="conv-info">';
    html += '<div class="conv-name">' + name + type + '</div>';
    html += '<div class="conv-preview">' + (preview || '') + '</div>';
    html += '</div>';
    html += '<div class="conv-meta">' + formatTime(c.lastMsgTime) + '</div>';
    html += '</div>';
  }
  list.innerHTML = html;
}

function filterConvs() {
  var q = document.getElementById('convSearch').value.toLowerCase();
  if (!q) { renderConvs(allConvs); return; }
  var filtered = allConvs.filter(function(c) {
    return (c.targetId || '').toLowerCase().indexOf(q) >= 0 || (c.lastMsgPreview || '').toLowerCase().indexOf(q) >= 0;
  });
  renderConvs(filtered);
}

// ===== Chat View =====
var chatConvId = null, chatType = null, chatTargetId = null, chatPage = 1, chatHasMore = true;
var contextMsgId = null;

async function openChat(convId, type, targetId) {
  chatConvId = convId; chatType = type; chatTargetId = targetId; chatPage = 1; chatHasMore = true;
  document.getElementById('convListView').classList.add('hidden');
  document.getElementById('chatView').classList.add('active');
  document.getElementById('chatTitle').textContent = type === 'group' ? t('group_chat') : t('single_chat');
  document.getElementById('chatStatus').textContent = t('online');
  document.getElementById('chatMessages').innerHTML = '';
  document.getElementById('chatInput').value = '';
  document.getElementById('chatInput').focus();
  await loadMessages();
  scrollToBottom();
}

function backToList() {
  document.getElementById('chatView').classList.remove('active');
  document.getElementById('convListView').classList.remove('hidden');
  chatConvId = null;
  loadConversations();
}

async function loadMessages() {
  try {
    var result = await api('GET', '/messages/' + chatConvId + '?page=' + chatPage + '&limit=30');
    var msgs = result.messages || [];
    renderMessages(msgs, chatPage > 1);
    if (msgs.length < 30) { chatHasMore = false; document.getElementById('loadMoreBtn').style.display = 'none'; }
    else { document.getElementById('loadMoreBtn').style.display = 'block'; }
  } catch (e) { showToast(e.message, 'error'); }
}

function renderMessages(msgs, prepend) {
  var container = document.getElementById('chatMessages');
  var loadMore = document.getElementById('loadMoreBtn');

  var html = '';
  for (var i = 0; i < msgs.length; i++) {
    var m = msgs[i];
    var me = m.isMe ? ' me' : '';
    var revoked = m.isRevoked ? ' chat-msg-revoked' : '';
    var displayContent = m.isRevoked ? t('revoked') : escapeHtml(m.content || '');

    var senderName = m.senderName || m.senderNickname || (m.isMe ? '我' : '对方');
    var senderUid = m.senderUniqueId || m.senderUid || m.senderId || '';
    html += '<div class="chat-msg' + me + revoked + '" data-msg-id="' + m.id + '" oncontextmenu="onMsgContext(event,\'' + m.id + '\',' + m.isMe + ',' + m.isRevoked + ',\'' + m.createdAt + '\'); return false">';
    if (!m.isMe) {
      var senderAv = m.senderAvatar || null;
      var avHtml = senderAv
        ? '<img src="' + senderAv + '" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">'
        : '<img src="/xuewaiyu/assets/images/default_avatar.png" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
      html += '<div class="chat-msg-avatar" onclick="viewMsgSenderProfile(\'' + senderUid + '\')" style="width:32px;height:32px;border-radius:50%;background:' + avatarColor(senderName) + ';overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;margin-right:8px;flex-shrink:0;">' + avHtml + '</div>';
    }
    html += '<div class="chat-msg-bubble" onclick="onMsgClick(event,\'' + m.id + '\',' + m.isMe + ',' + m.isRevoked + ',\'' + m.createdAt + '\')">' + (revoked ? '' : displayContent) + '</div>';
    if (m.isRevoked) html += '<div class="chat-msg-status">' + (!m.isMe ? '' : '') + '</div>';
    html += '</div>';
  }

  var existing = container.querySelectorAll('.chat-msg');
  if (prepend && existing.length > 0) {
    // Insert before existing messages
    container.insertBefore(
      htmlToElement('<div>' + html + '</div>'),
      loadMore.nextSibling || existing[0]
    );
  } else {
    container.innerHTML = '<div class="chat-load-more" id="loadMoreBtn" style="display:' + (chatHasMore ? 'block' : 'none') + '"><button onclick="loadMore()">' + t('load_earlier') + '</button></div>' + html;
  }
}

function htmlToElement(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }

function escapeHtml(text) {
  var d = document.createElement('div'); d.textContent = text; return d.innerHTML;
}

function scrollToBottom() {
  var el = document.getElementById('chatMessages');
  setTimeout(function() { el.scrollTop = el.scrollHeight; }, 100);
}

async function loadMore() {
  chatPage++;
  await loadMessages();
}

async function sendMsg() {
  var input = document.getElementById('chatInput');
  var content = input.value.trim();
  if (!content) return;
  input.value = '';

  var btn = document.getElementById('chatSendBtn');
  btn.disabled = true;

  try {
    await api('POST', '/messages/send', { conversationId: chatConvId, content: content });
    chatPage = 1;
    // Reload messages
    await loadMessages();
    scrollToBottom();
  } catch (e) { showToast(e.message, 'error'); }

  btn.disabled = false;
  input.focus();
}

// ===== Context Menu =====
function onMsgClick(event, msgId, isMe, isRevoked, createdAt) {
  // Mobile: long press simulation via click + check
  contextMsgId = msgId;
}

function onMsgContext(event, msgId, isMe, isRevoked, createdAt) {
  event.preventDefault();
  contextMsgId = msgId;

  var menu = document.getElementById('contextMenu');
  menu.style.left = Math.min(event.clientX, window.innerWidth - 150) + 'px';
  menu.style.top = Math.min(event.clientY, window.innerHeight - 100) + 'px';
  menu.classList.add('show');

  // Only show revoke for own messages
  var items = menu.querySelectorAll('.menu-item');
  items[0].style.display = isRevoked ? 'none' : 'block'; // copy
  items[1].style.display = (isMe && !isRevoked) ? 'block' : 'none'; // revoke
  items[1].textContent = t('revoke');

  // Check 2-min timeout for revoke
  if (items[1].style.display !== 'none') {
    var diff = Date.now() - new Date(createdAt).getTime();
    if (diff > 2 * 60 * 1000) {
      items[1].textContent = t('cannot_revoke');
      items[1].style.opacity = '0.5';
    } else {
      items[1].textContent = t('revoke');
      items[1].style.opacity = '1';
    }
  }
}

// Close context menu on outside click
document.addEventListener('click', function(e) {
  if (!e.target.closest('.context-menu') && !e.target.closest('.chat-msg-bubble')) {
    document.getElementById('contextMenu').classList.remove('show');
  }
});

function copyMsg() {
  var msgEl = document.querySelector('.chat-msg[data-msg-id="' + contextMsgId + '"] .chat-msg-bubble');
  if (msgEl) {
    navigator.clipboard.writeText(msgEl.textContent).then(function() {
      showToast(t('copy') + ' OK', 'success');
    }).catch(function() {});
  }
  document.getElementById('contextMenu').classList.remove('show');
}

async function revokeMsg() {
  if (!contextMsgId) return;
  try {
    await api('POST', '/messages/revoke', { messageId: contextMsgId });
    showToast(t('msg_revoked'), 'success');
    chatPage = 1;
    await loadMessages();
  } catch (e) { showToast(e.message, 'error'); }
  document.getElementById('contextMenu').classList.remove('show');
}

// ===== Init =====
function init() {
  updateUI();
  loadConversations();
  // Refresh conv list every 30s
  setInterval(function() { if (!chatConvId) loadConversations(); }, 30000);
}

init();
</script>

  window.location.href = '/xuewaiyu/profile.html?share=' + encodeURIComponent(uniqueId);
}
