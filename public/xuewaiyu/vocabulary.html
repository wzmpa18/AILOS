<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4F46E5">
<title>词汇学习 - 言道学学外语</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #4F46E5; --primary-hover: #4338CA; --primary-light: #EEF2FF;
    --brand: #7B2FBE;
    --bg: #F8FAFC; --card-bg: #FFFFFF; --text: #1E293B; --text-secondary: #64748B;
    --text-muted: #94A3B8; --border: #E2E8F0; --radius: 16px; --radius-sm: 10px;
    --ok: #10B981; --ok-light: #ECFDF5; --err: #EF4444; --err-light: #FEF2F2;
  }
  html, body { overflow-x: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ===== 顶部状态栏 ===== */
  .topbar { background: linear-gradient(135deg, var(--primary), var(--brand)); color: #fff; padding: 14px 16px 18px; position: sticky; top: 0; z-index: 50; }
  .topbar-row { display: flex; align-items: center; gap: 12px; }
  .btn-exit { background: rgba(255,255,255,.2); border: none; color: #fff; width: 36px; height: 36px; border-radius: 10px; font-size: 18px; cursor: pointer; flex-shrink: 0; line-height: 1; }
  .btn-exit:active { background: rgba(255,255,255,.35); }
  .level-tag { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .lives { margin-left: auto; font-size: 15px; letter-spacing: 1px; white-space: nowrap; }
  .lives .lost { opacity: .28; }
  .qbar { margin-top: 12px; }
  .qbar-meta { display: flex; justify-content: space-between; font-size: 12px; opacity: .9; margin-bottom: 6px; }
  .qbar-track { height: 8px; background: rgba(255,255,255,.25); border-radius: 4px; overflow: hidden; }
  .qbar-fill { height: 100%; background: #fff; border-radius: 4px; width: 0%; transition: width .3s; }

  /* ===== 主体 ===== */
  .wrap { padding: 20px 16px 40px; max-width: 560px; margin: 0 auto; }
  .state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }
  .state .big { font-size: 40px; margin-bottom: 12px; }

  .word-card { background: var(--card-bg); border-radius: var(--radius); padding: 32px 20px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 20px; }
  .word-main { font-size: 34px; font-weight: 700; line-height: 1.3; word-break: break-word; }
  .word-phonetic { font-size: 15px; color: var(--text-secondary); margin-top: 8px; }
  .word-hint { font-size: 12px; color: var(--text-muted); margin-top: 14px; }
  /* ===== P1-M1 语音播放按钮（小喇叭）===== */
  .tts-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; }
  .tts-btn { width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
             background: var(--primary-light); color: var(--primary); font-size: 22px; line-height: 1;
             display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
             transition: transform .15s, background .15s, opacity .15s; font-family: inherit; }
  .tts-btn:active { transform: scale(.92); }
  .tts-btn.playing { background: var(--primary); color: #fff; opacity: .9; animation: ttsPulse .9s ease-in-out infinite; }
  @keyframes ttsPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .tts-btn[disabled] { opacity: .45; cursor: default; }

  .options { display: flex; flex-direction: column; gap: 12px; }
  .opt { width: 100%; min-height: 54px; padding: 14px 16px; background: var(--card-bg); border: 2px solid var(--border);
         border-radius: 12px; font-size: 16px; color: var(--text); text-align: left; cursor: pointer;
         transition: all .18s; display: flex; align-items: center; gap: 10px; font-family: inherit; }
  .opt:active { transform: scale(.985); }
  .opt .idx { width: 26px; height: 26px; border-radius: 50%; background: var(--primary-light); color: var(--primary);
              font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .opt.correct { border-color: var(--ok); background: var(--ok-light); color: #065F46; }
  .opt.correct .idx { background: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--err); background: var(--err-light); color: #991B1B; }
  .opt.wrong .idx { background: var(--err); color: #fff; }
  .opt[disabled] { cursor: default; }

  .spell-box { display: flex; flex-direction: column; gap: 12px; }
  .spell-input { width: 100%; min-height: 54px; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px;
                 font-size: 17px; font-family: inherit; color: var(--text); outline: none; }
  .spell-input:focus { border-color: var(--primary); }
  .btn-primary { width: 100%; min-height: 52px; border: none; border-radius: 12px; background: var(--primary); color: #fff;
                 font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-primary:active { background: var(--primary-hover); }
  .btn-ghost { width: 100%; min-height: 52px; border: 2px solid var(--primary); border-radius: 12px; background: #fff;
               color: var(--primary); font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; }

  .feedback { margin-top: 16px; padding: 14px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; display: none; }
  .feedback.show { display: block; animation: pop .22s ease; }
  .feedback.ok { background: var(--ok-light); color: #065F46; border: 1px solid #A7F3D0; }
  .feedback.err { background: var(--err-light); color: #991B1B; border: 1px solid #FECACA; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ===== 结算页 ===== */
  .result { background: var(--card-bg); border-radius: var(--radius); padding: 28px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .result h2 { font-size: 22px; text-align: center; margin-bottom: 4px; }
  .result .sub { text-align: center; font-size: 13px; color: var(--text-secondary); margin-bottom: 22px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
  .stat { background: var(--bg); border-radius: 12px; padding: 14px; text-align: center; }
  .stat .v { font-size: 22px; font-weight: 700; color: var(--primary); }
  .stat .k { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .actions { display: flex; flex-direction: column; gap: 12px; }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: rgba(30,41,59,.94); color: #fff;
           padding: 11px 18px; border-radius: 10px; font-size: 14px; z-index: 999; max-width: 88%; text-align: center; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <button class="btn-exit" id="btnExit" title="退出">✕</button>
    <span class="level-tag" id="levelTag">词汇学习</span>
    <button class="btn-custom" id="btnCustom" title="自定义强化" style="background:rgba(255,255,255,.2);border:none;color:#fff;padding:4px 12px;border-radius:10px;font-size:12px;cursor:pointer;flex-shrink:0;">⚡ 自定义</button>
    <span class="lives" id="lives"></span>
  </div>
  <div class="qbar">
    <div class="qbar-meta">
      <span id="qCount">-- / --</span>
      <span id="xpTag"></span>
    </div>
    <div class="qbar-track"><div class="qbar-fill" id="qFill"></div></div>
  </div>
</div>

<div class="wrap" id="wrap">
  <div class="state"><div class="big">📝</div>加载中...</div>
</div>

<script src="/xuewaiyu/assets/common.js?v=20260808p3"></script>
<script>
(function () {
  'use strict';

  // 与 learn.html 保持一致：同源根路径 /api（nginx 已把 /api 反代到后端 3000）
  var API = '/api';
  var MAX_LIVES = 5;
  var NEXT_DELAY = 1500; // 答题后自动进入下一题
  var CACHE_KEY = 'yandao_vocab_cache_v1'; // 仅缓存兜底，核心进度以后端为准

  var LANG_LABEL = { ja: '日语', en: '英语', ko: '韩语', fr: '法语', de: '德语', es: '西班牙语', zh: '中文' };
  var LEVEL_LABEL = { beginner: '初级', intermediate: '中级', advanced: '高级' };

  // ---------- 基础工具 ----------
  function token() {
    if (window.AILOS && AILOS.getToken) return AILOS.getToken() || '';
    return localStorage.getItem('yandao_token_v1') || '';
  }
  function studyLang() {
    if (window.AILOS && AILOS.getStudyLang) return AILOS.getStudyLang() || (AILOS && AILOS.getStudyLang ? AILOS.getStudyLang() : 'ja');
    return 'ja';
  }
  function qs(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }
  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
  }

  function api(path, options) {
    var opt = options || {};
    opt.headers = opt.headers || {};
    var tk = token();
    if (tk) opt.headers['Authorization'] = 'Bearer ' + tk;
    if (opt.body && typeof opt.body !== 'string') {
      opt.headers['Content-Type'] = 'application/json';
      opt.body = JSON.stringify(opt.body);
    }
    return fetch(API + path, opt).then(function (res) {
      if (res.status === 401) { location.href = 'landing.html'; throw new Error('未登录'); }
      return res.json().catch(function () { return {}; }).then(function (d) {
        return { ok: res.ok, status: res.status, body: d };
      });
    });
  }

  // ---------- 会话状态 ----------
  var S = {
    lang: '',
    level: 'beginner',
    type: 'choice',
    fromReview: false,
    questions: [],
    index: 0,
    lives: MAX_LIVES,
    correct: 0,
    wrong: 0,
    xpTotal: 0,
    startAt: 0,
    qStartAt: 0,
    locked: false,
    finished: false
  };

  // ---------- 顶部渲染 ----------
  function renderTop() {
    var langName = LANG_LABEL[S.lang] || S.lang || '';
    var lvName = LEVEL_LABEL[S.level] || '';
    el('levelTag').textContent = S.fromReview
      ? (langName + ' · 错题重练')
      : (langName + (lvName ? ' · ' + lvName : ''));

    var h = '';
    for (var i = 0; i < MAX_LIVES; i++) {
      h += '<span class="' + (i < S.lives ? '' : 'lost') + '">❤️</span>';
    }
    el('lives').innerHTML = h;

    var total = S.questions.length;
    var cur = Math.min(S.index + 1, total);
    el('qCount').textContent = total ? (cur + ' / ' + total) : '-- / --';
    el('xpTag').textContent = S.xpTotal > 0 ? ('+' + S.xpTotal + ' XP') : '';
    el('qFill').style.width = total ? Math.round((S.index / total) * 100) + '%' : '0%';
  }

  // ---------- 题目渲染 ----------
  function renderQuestion() {
    var q = S.questions[S.index];
    if (!q) { finish(); return; }
    S.locked = false;
    S.qStartAt = Date.now();
    renderTop();

    var html = '';
    html += '<div class="word-card">';
    if (S.type === 'spell') {
      html += '<div class="word-main">' + esc(q.meaning) + '</div>';
      html += '<div class="tts-row"><button class="tts-btn" type="button" data-tts="' + esc(q.word) + '" title="播放发音">🔊</button></div>';
      html += '<div class="word-hint">请拼写出对应的单词</div>';
    } else {
      html += '<div class="word-main">' + esc(q.word) + '</div>';
      if (q.phonetic) html += '<div class="word-phonetic">' + esc(q.phonetic) + '</div>';
      html += '<div class="tts-row"><button class="tts-btn" type="button" data-tts="' + esc(q.word) + '" title="播放发音">🔊</button></div>';
      html += '<div class="word-hint">选择正确的释义</div>';
    }
    html += '</div>';

    if (S.type === 'spell') {
      html += '<div class="spell-box">';
      html += '<input class="spell-input" id="spellInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入单词">';
      html += '<button class="btn-primary" id="spellSubmit">提交答案</button>';
      html += '</div>';
    } else {
      html += '<div class="options" id="options">';
      var opts = q.options || [];
      for (var i = 0; i < opts.length; i++) {
        html += '<button class="opt" type="button" data-i="' + i + '">' +
                '<span class="idx">' + String.fromCharCode(65 + i) + '</span>' +
                '<span class="txt">' + esc(opts[i]) + '</span></button>';
      }
      html += '</div>';
    }

    html += '<div class="feedback" id="feedback"></div>';
    el('wrap').innerHTML = html;

    if (S.type === 'spell') {
      el('spellSubmit').addEventListener('click', function () {
        var v = el('spellInput').value.trim();
        if (!v) { toast('请先输入答案'); return; }
        submit(v, null);
      });
      el('spellInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') el('spellSubmit').click();
      });
    } else {
      var btns = el('options').querySelectorAll('.opt');
      Array.prototype.forEach.call(btns, function (b) {
        b.addEventListener('click', function () {
          var i = parseInt(b.getAttribute('data-i'), 10);
          submit((S.questions[S.index].options || [])[i], i);
        });
      });
    }
  }

  // ---------- 提交答案（真实后端判分 + 落库）----------
  function submit(answerText, optIndex) {
    if (S.locked) return;
    S.locked = true;
    var q = S.questions[S.index];
    var timeCost = Math.round((Date.now() - S.qStartAt) / 1000);

    var btns = S.type === 'choice' ? el('options').querySelectorAll('.opt') : [];
    Array.prototype.forEach.call(btns, function (b) { b.setAttribute('disabled', 'disabled'); });
    if (S.type === 'spell') {
      el('spellSubmit').setAttribute('disabled', 'disabled');
      el('spellSubmit').textContent = '判分中...';
    }

    api('/v1/practice/submit', {
      method: 'POST',
      body: {
        questionId: q.id,
        userAnswer: answerText,
        lang: S.lang,
        level: S.level,
        timeCost: timeCost,
        fromReview: S.fromReview
      }
    }).then(function (r) {
      if (!r.ok || !r.body || !r.body.success) {
        throw new Error((r.body && (r.body.message || r.body.error)) || '提交失败');
      }
      var d = r.body.data;
      applyResult(d, optIndex);
    }).catch(function (e) {
      S.locked = false;
      Array.prototype.forEach.call(btns, function (b) { b.removeAttribute('disabled'); });
      if (S.type === 'spell') {
        el('spellSubmit').removeAttribute('disabled');
        el('spellSubmit').textContent = '提交答案';
      }
      toast(e.message || '网络异常，请重试');
    });
  }

  function applyResult(d, optIndex) {
    var q = S.questions[S.index];

    if (d.isCorrect) { S.correct++; } else { S.wrong++; S.lives = Math.max(0, S.lives - 1); }
    S.xpTotal += (d.xpGained || 0);

    // 视觉反馈
    if (S.type === 'choice') {
      var btns = el('options').querySelectorAll('.opt');
      var opts = q.options || [];
      for (var i = 0; i < btns.length; i++) {
        if (opts[i] === d.correctAnswer) btns[i].classList.add('correct');
      }
      if (!d.isCorrect && optIndex != null && btns[optIndex]) btns[optIndex].classList.add('wrong');
    }

    var fb = el('feedback');
    fb.className = 'feedback show ' + (d.isCorrect ? 'ok' : 'err');
    var msg = (d.isCorrect ? '✅ 回答正确  +' + (d.xpGained || 0) + ' XP' : '❌ 回答错误')
            + '<br>' + esc(d.explanation || '');
    if (!d.isCorrect && d.example) msg += '<br><span style="opacity:.85">例：' + esc(d.example) + '</span>';
    fb.innerHTML = msg;

    renderTop();
    saveCache();

    var autoNext = true;
    try { autoNext = localStorage.getItem('yandao_auto_next') !== 'off'; } catch (e) {}
    if (autoNext) {
      setTimeout(function () {
        goNextQuestion();
      }, NEXT_DELAY);
    } else {
      // 关闭自动下一题：展示手动「下一题」按钮
      var fb = el('feedback');
      if (fb) {
        var nb = document.createElement('button');
        nb.className = 'btn-primary';
        nb.style.cssText = 'margin-top:12px;max-width:200px;';
        nb.textContent = '下一题 →';
        nb.onclick = goNextQuestion;
        fb.appendChild(nb);
      }
    }
  }

  function goNextQuestion() {
    if (S.lives <= 0) { finish(true); return; }
    S.index++;
    if (S.index >= S.questions.length) { finish(); return; }
    renderQuestion();
  }

  // ---------- 结算 ----------
  function finish(byDeath) {
    S.finished = true;
    var answered = S.correct + S.wrong;
    var rate = answered ? Math.round((S.correct / answered) * 100) : 0;
    var seconds = Math.max(1, Math.round((Date.now() - S.startAt) / 1000));
    var mm = Math.floor(seconds / 60), ss = seconds % 60;

    el('qFill').style.width = '100%';
    el('qCount').textContent = answered + ' / ' + S.questions.length;

    var html = '';
    html += '<div class="result">';
    html += '<h2>' + (byDeath ? '生命值耗尽' : '练习完成') + '</h2>';
    html += '<div class="sub">' + (byDeath ? '别灰心，再来一组巩固一下' : '继续保持，稳步提升') + '</div>';
    html += '<div class="stats">';
    html += '<div class="stat"><div class="v">' + rate + '%</div><div class="k">正确率</div></div>';
    html += '<div class="stat"><div class="v">+' + S.xpTotal + '</div><div class="k">获得经验</div></div>';
    html += '<div class="stat"><div class="v">' + S.wrong + '</div><div class="k">错题数量</div></div>';
    html += '<div class="stat"><div class="v">' + (mm > 0 ? mm + '分' : '') + ss + '秒</div><div class="k">用时</div></div>';
    html += '</div>';
    html += '<div class="actions">';
    html += '<button class="btn-primary" id="btnAgain">再练一组</button>';
    html += '<button class="btn-ghost" id="btnWrong">查看错题</button>';
    html += '</div>';
    html += '</div>';
    el('wrap').innerHTML = html;

    el('btnAgain').addEventListener('click', function () { start(); });
    el('btnWrong').addEventListener('click', function () { location.href = 'review.html'; });

    clearCache();
  }

  // ---------- 缓存兜底（不承载核心进度）----------
  function saveCache() {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        lang: S.lang, level: S.level, index: S.index, lives: S.lives,
        correct: S.correct, wrong: S.wrong, xpTotal: S.xpTotal, at: Date.now()
      }));
    } catch (e) { /* ignore */ }
  }
  function clearCache() {
    try { localStorage.removeItem(CACHE_KEY); } catch (e) { /* ignore */ }
  }

  // ---------- 启动 ----------
  function showState(icon, text, retry) {
    var h = '<div class="state"><div class="big">' + icon + '</div>' + esc(text);
    if (retry) h += '<br><br><button class="btn-primary" id="btnRetry" style="max-width:200px;margin:0 auto">重新加载</button>';
    h += '</div>';
    el('wrap').innerHTML = h;
    if (retry) el('btnRetry').addEventListener('click', start);
  }

  function start() {
    if (!token()) { location.href = 'landing.html'; return; }

    S.lang = qs('lang') || studyLang();
    S.level = qs('level') || S.level || 'beginner';
    S.type = qs('type') === 'spell' ? 'spell' : 'choice';
    S.fromReview = qs('mode') === 'review';
    S.questions = [];
    S.index = 0;
    S.lives = MAX_LIVES;
    S.correct = 0;
    S.wrong = 0;
    S.xpTotal = 0;
    S.finished = false;
    S.locked = false;
    S.startAt = Date.now();

    showState('📝', '正在准备题目...');
    renderTop();

    var req = S.fromReview
      ? api('/v1/reviews/practice', { method: 'POST', body: { lang: S.lang, limit: 10 } })
      : api('/v1/practice/questions?lang=' + encodeURIComponent(S.lang) +
            '&level=' + encodeURIComponent(S.level) +
            '&type=' + encodeURIComponent(S.type) + '&limit=10');

    req.then(function (r) {
      if (!r.ok || !r.body || !r.body.success) {
        var m = (r.body && (r.body.message || r.body.error)) || '题目加载失败';
        showState('📭', m, true);
        return;
      }
      var d = r.body.data;
      S.questions = d.questions || [];
      if (d.level) S.level = d.level;
      if (d.language) S.lang = d.language;
      if (!S.questions.length) { showState('📭', '该语言暂无题目', true); return; }

      // 模块四：断点续学 —— 非重练模式且有本地缓存的未完成进度，提示继续
      if (!S.fromReview) {
        try {
          var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
          if (c && c.lang === S.lang && c.level === S.level && c.index > 0 && c.index < S.questions.length) {
            if (confirm('发现上次学习进度（第 ' + (c.index + 1) + ' 题），是否继续？')) {
              S.index = c.index;
              S.correct = c.correct || 0;
              S.wrong = c.wrong || 0;
            } else {
              clearCache();
            }
          }
        } catch (e) { /* ignore */ }
      }

      renderQuestion();
    }).catch(function (e) {
      showState('⚠️', e.message || '网络异常', true);
    });
  }

  el('btnExit').addEventListener('click', function () {
    if (!S.finished && S.index > 0) {
      if (!confirm('本次练习尚未结束，确定退出吗？已答题目已保存。')) return;
    }
    clearCache();
    // P2: 统一返回上一级（从 learn.html 进入时回到 learn.html）
    if (window.history.length > 1) { window.history.back(); } else { location.href = 'learn.html'; }
  });

  // P1-M1: 语音播放按钮事件委托（一次性绑定到常驻容器 wrap）
  // P2 增强：增加后端 TTS 兜底（Web Speech API 不可用时走 /api/tts/speak）
  function bindTTS() {
    var wrap = el('wrap');
    if (!wrap || wrap._ttsBound) return;
    wrap._ttsBound = true;
    wrap.addEventListener('click', function (e) {
      var btn = e.target;
      while (btn && btn !== wrap && !(btn.classList && btn.classList.contains('tts-btn'))) {
        btn = btn.parentNode;
      }
      if (!btn || btn === wrap || btn.disabled) return;
      var txt = btn.getAttribute('data-tts');
      if (!txt) return;
      if (btn.classList.contains('playing')) return; // 防止重复触发
      btn.classList.add('playing');
      btn.innerHTML = '&#9895;'; // 播放中图标
      var lang = (typeof window.AILOS !== 'undefined' && window.AILOS.getStudyLang) ? window.AILOS.getStudyLang() : 'ja';
      var stop = function () { btn.classList.remove('playing'); btn.innerHTML = '&#128266;'; };
      
      // 策略1：优先使用 common.js 的 playTTS（Web Speech API + 原生桥接）
      if (typeof window.playTTS === 'function') {
        window.playTTS(txt, lang, {
          scene: 'vocab',
          onStart: function () { btn.innerHTML = '&#9895;'; },
          onEnd: stop,
          onError: function (msg) {
            // 策略2：Web Speech 失败，尝试后端 TTS 兜底
            tryFallbackTTS(txt, lang, btn, stop);
          },
        });
      } else {
        // playTTS 未定义（common.js 加载失败），直接走后端兜底
        tryFallbackTTS(txt, lang, btn, stop);
      }
      // 安全兜底：12s 后强制复位，避免状态卡死
      setTimeout(stop, 12000);
    });
  }

  // 后端 TTS 兜底：调用 /api/tts/speak 获取音频 URL 后用 Audio 播放
  function tryFallbackTTS(txt, lang, btn, stop) {
    var t = token();
    fetch('/api/tts/speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (t || '') },
      body: JSON.stringify({ text: txt, language: lang || (AILOS && AILOS.getStudyLang ? AILOS.getStudyLang() : 'ja') })
    }).then(function(r) {
      if (!r.ok) throw new Error('TTS_' + r.status);
      return r.json();
    }).then(function(d) {
      if (d && d.data && d.data.audioUrl) {
        var audio = new Audio(d.data.audioUrl);
        audio.play().then(function() {
          audio.onended = stop;
        }).catch(function() { stop(); });
      } else {
        stop();
      }
    }).catch(function() {
      stop();
      if (window.showToast) window.showToast('&#128266; 发音暂不可用');
    });
  }

  bindTTS();

  // ===== 自定义强化入口（模块九） =====
  var btnCustom = document.getElementById('btnCustom');
  if (btnCustom) {
    btnCustom.addEventListener('click', function() {
      var keyword = prompt('请输入想要强化的词汇或主题（如「商务用语」「て形变形」）：');
      if (!keyword || !keyword.trim()) return;
      btnCustom.textContent = '⏳ 生成中...';
      btnCustom.disabled = true;

      var token = AILOS.getToken();
      fetch('/api/content/custom', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ keyword: keyword.trim(), type: 'vocabulary', level: state.level })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        btnCustom.textContent = '⚡ 自定义';
        btnCustom.disabled = false;
        if (data && data.success && data.item && data.item.data) {
          // 将自定义内容加载到当前练习中
          loadCustomContent(data.item.data);
          if (window.showToast) window.showToast('✅ 已加载「' + keyword.trim() + '」强化内容');
        } else {
          if (window.showToast) window.showToast('⚠️ 生成失败: ' + ((data && data.error) || '未知错误'));
        }
      })
      .catch(function(err) {
        btnCustom.textContent = '⚡ 自定义';
        btnCustom.disabled = false;
        if (window.showToast) window.showToast('⚠️ 网络错误');
        console.error('[CustomContent] error:', err);
      });
    });
  }

  function loadCustomContent(data) {
    // 将AI生成的自定义词汇加载到当前练习队列
    if (data.words && data.words.length > 0) {
      var customWords = data.words.map(function(w) {
        return {
          id: 'custom_' + Date.now() + '_' + Math.random().toString(36).substr(2,4),
          word: w.word, phonetic: w.reading, meaning: w.meaning,
          example: w.example, exampleMeaning: w.exampleTranslation,
          level: 'custom'
        };
      });
      // 替换当前词库
      wordPool = customWords;
      poolIndex = 0;
      totalAnswered = 0;
      totalCorrect = 0;
      renderWord();
    }
  }

  window.addEventListener('languageChanged', function () { start(); });

  start();
})();
</script>
