    .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px; }

    .translate-header { text-align: center; padding: 24px 0 8px; }
    .translate-header h1 { font-size: 22px; margin: 0 0 4px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .translate-header .sub { font-size: 13px; color: var(--text-secondary); }

    .status-bar { background: linear-gradient(135deg, #eef2ff, #f0f9ff); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow); }
    .status-bar .trial-info { display: flex; align-items: center; gap: 8px; }
    .status-bar .trial-icon { font-size: 24px; }
    .status-bar .trial-text strong { color: var(--primary); }
    .status-bar .upgrade-btn { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }

    .feature-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 20px; }
    .feature-card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all .2s; border: 1px solid transparent; text-decoration: none; color: inherit; }
    .feature-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); border-color: var(--primary); }
    .feature-card .card-icon { font-size: 40px; flex-shrink: 0; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); }
    .feature-card .card-icon.photo { background: #fef3c7; }
    .feature-card .card-icon.scan { background: #dbeafe; }
    .feature-card .card-icon.converse { background: #d1fae5; }
    .feature-card .card-body { flex: 1; }
    .feature-card .card-body h3 { margin: 0 0 4px; font-size: 16px; }
    .feature-card .card-body p { margin: 0 0 6px; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
    .feature-card .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-free { background: #d1fae5; color: #065f46; }
    .badge-premium { background: #fef3c7; color: #92400e; }
    .badge-trial { background: #dbeafe; color: #1e40af; }

    .constitution-note { background: #fff; border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); font-size: 12px; color: var(--text-secondary); line-height: 1.6; border-left: 3px solid var(--primary); }
    .constitution-note strong { color: var(--text); }

    .empty-hint { text-align: center; padding: 48px 16px; color: var(--text-secondary); }
    .empty-hint .big-icon { font-size: 56px; margin-bottom: 12px; }
    .empty-hint p { font-size: 14px; line-height: 1.6; }

    @media (min-width: 480px) {
      .feature-grid { grid-template-columns: repeat(3, 1fr); }
      .feature-card { flex-direction: column; text-align: center; }
      .feature-card .card-icon { width: 56px; height: 56px; font-size: 32px; }

      function t(key) {

      function applyI18n() {
        document.querySelectorAll('[class^="t-"]').forEach(function(el) {
          var classes = el.className.split(' ');
          classes.forEach(function(cls) {
            if (cls.indexOf('t-') === 0) {
              var key = cls.replace('t-', '').replace(/-/g, '');
              // Map CSS class to i18n key
              var keyMap = {
                'pagetitle': 'pageTitle', 'sub': 'sub',
                'triallabel': 'trialLabel', 'trialtime': 'trialTime', 'upgradebtn': 'upgradeBtn',
                'phototitle': 'photoTitle', 'photodesc': 'photoDesc', 'photobadge': 'photoBadge',
                'scantitle': 'scanTitle', 'scandesc': 'scanDesc', 'scanbadge': 'scanBadge',
                'conversetitle': 'converseTitle', 'conversedesc': 'converseDesc', 'conversebadge': 'converseBadge',
                'note': 'note', 'comingsoon': 'comingSoon'
              };
              var k = keyMap[cls.substring(2)];
              if (k && T[uiLang] && T[uiLang][k]) {
                if (k === 'note') { el.innerHTML = T[uiLang][k]; }
                else { el.textContent = T[uiLang][k]; }
              }
            }
          });
        });
        document.title = '🌐 ' + t('pageTitle') + ' · AILOS';
      }

      function init() {
        // Phase4: UI语言优先，学习语言用于数据过滤
        if (window.AILOS) {
          if (typeof window.AILOS.getUILang === 'function') uiLang = window.AILOS.getUILang();
          if (typeof window.AILOS.getStudyLang === 'function') studyLang = window.AILOS.getStudyLang();
        }
        if (!T[uiLang]) uiLang = 'en';
        applyI18n();
        fetchTrialStatus();

        window.addEventListener('languageChanged', function(e) {
          if (window.AILOS) {
            if (typeof window.AILOS.getUILang === 'function') uiLang = window.AILOS.getUILang();
            if (typeof window.AILOS.getStudyLang === 'function') studyLang = window.AILOS.getStudyLang();
          }
          if (!T[uiLang]) uiLang = 'en';
          applyI18n();
          fetchTrialStatus();
        });
      }

      function fetchTrialStatus() {
        var token = (window.AILOS && window.AILOS.getToken) ? window.AILOS.getToken() : (localStorage.getItem('yandao_token_v1') || '');
        if (!token) return;
        fetch('/api/billing/status', {
          headers: { 'Authorization': 'Bearer ' + token }
        }).then(function(r) { return r.ok ? r.json() : null; })
        .then(function(d) {
          if (d && d.success && d.data) {
            var mins = d.data.trialMinutesRemaining || d.data.remainingMinutes || 0;
            var el = document.getElementById('trialTime');
            if (el) el.textContent = mins + ' ' + (mins <= 1 ? 'minute' : 'minutes');

        }).catch(function() {});

<script>
function getSourceLang() {
  var el = document.getElementById('sourceLang');
  return el ? el.value : 'auto';
}
function getTargetLang() {
  var el = document.getElementById('targetLang');
  return el ? el.value : 'zh';
}
function setTranslateStatus(status) {
  var el = document.getElementById('translateStatus');
  if (!el) return;
  var statusMap = { idle: '就绪', translating: '翻译中...', success: '翻译成功', failed: '翻译失败', scanning: '识别中...', scanned: '识别成功', scanFailed: '识别失败' };
  el.textContent = statusMap[status] || status;
  el.style.color = status === 'success' || status === 'scanned' ? '#4caf50' : (status === 'failed' || status === 'scanFailed' ? '#f44336' : 'var(--text-tertiary,#999)');
}
function onLangChange() {
  setTranslateStatus('translating');
  // 触发重新翻译（如果有翻译结果则重新执行）
  if (typeof retranslate === 'function') {
    retranslate(getSourceLang(), getTargetLang());
  } else if (typeof doTranslate === 'function') {
    doTranslate();
  }
  setTimeout(function() { setTranslateStatus('success'); }, 1000);
}
// 默认目标语言跟随用户母语设置
(function() {
  try {
    var userLang = localStorage.getItem('nativeLanguage') || localStorage.getItem('targetLanguage') || 'zh';
    var targetEl = document.getElementById('targetLang');
    if (targetEl && userLang) targetEl.value = userLang;
  } catch(e) {}
})();
</script>
