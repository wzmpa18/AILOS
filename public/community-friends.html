<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#4F46E5">
<title>AILOS - 好友中心</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #4F46E5; --primary-hover: #4338CA; --primary-light: #EEF2FF;
    --bg: #F8FAFC; --card-bg: #FFFFFF; --text: #1E293B;
    --text-secondary: #64748B; --text-muted: #94A3B8; --border: #E2E8F0;
    --error: #EF4444; --success: #10B981; --warning: #F59E0B;
    --radius: 16px; --radius-sm: 10px; --radius-xs: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08);
    --nav-height: 64px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Noto Sans JP', system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6;
    padding: 0 0 calc(var(--nav-height) + env(safe-area-inset-bottom, 0) + 20px);
  }

  /* ===== Header ===== */
  .header {
    background: var(--card-bg); border-bottom: 1px solid var(--border);
    padding: 12px 16px; position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 12px;
  }
  .header-back { font-size: 14px; color: var(--text-secondary); text-decoration: none; flex-shrink: 0; }
  .header-back:hover { color: var(--primary); }
  .header-title { font-size: 17px; font-weight: 700; flex: 1; }
  .header-action { font-size: 13px; color: var(--primary); cursor: pointer; border: none; background: none; font-weight: 600; }

  /* ===== UID Search Bar ===== */
  .search-bar {
    padding: 12px 16px; display: flex; gap: 8px; background: var(--bg);
  }
  .search-input {
    flex: 1; padding: 10px 14px; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); font-size: 14px; font-family: inherit;
    background: var(--card-bg); color: var(--text); outline: none; transition: border-color .2s;
  }
  .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
  .search-input::placeholder { color: var(--text-muted); }
  .btn-search {
    padding: 10px 18px; border-radius: var(--radius-sm); border: none; font-size: 14px;
    font-weight: 600; background: var(--primary); color: #fff; cursor: pointer; transition: all .2s;
  }
  .btn-search:hover { background: var(--primary-hover); }
  .btn-search:disabled { opacity: .5; cursor: not-allowed; }

  /* ===== Search Result Card ===== */
  .search-result {
    margin: 0 16px 12px; background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; display: none;
  }
  .search-result.show { display: block; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .result-top {
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
  }
  .result-avatar {
    width: 52px; height: 52px; border-radius: 50%; background: var(--primary-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: var(--primary); flex-shrink: 0;
  }
  .result-info { flex: 1; min-width: 0; }
  .result-name { font-size: 16px; font-weight: 700; }
  .result-uid { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .result-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .result-actions { display: flex; gap: 8px; }
  .btn-result {
    padding: 8px 16px; border-radius: var(--radius-xs); font-size: 13px; font-weight: 600;
    cursor: pointer; border: none; transition: all .2s;
  }
  .btn-add { background: var(--primary); color: #fff; }
  .btn-add:hover { background: var(--primary-hover); }
  .btn-added { background: var(--bg); color: var(--text-muted); border: 1.5px solid var(--border); cursor: default; }
  .btn-blocked { background: var(--error); color: #fff; }

  /* ===== Error / Toast ===== */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999;
    padding: 10px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
    background: var(--card-bg); box-shadow: var(--shadow-md); animation: toastIn .3s ease;
    display: none;
  }
  .toast.show { display: block; }
  .toast.error { color: var(--error); border: 1.5px solid var(--error); }
  .toast.success { color: var(--success); border: 1.5px solid var(--success); }
  @keyframes toastIn { from { opacity: 0; top: 0; } to { opacity: 1; top: 20px; } }

  /* ===== Friend List ===== */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 8px; font-size: 13px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .5px;
  }
  .friend-list { padding: 0 16px; display: flex; flex-direction: column; gap: 6px; }
  .friend-item {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    background: var(--card-bg); border-radius: var(--radius-sm); box-shadow: var(--shadow);
    cursor: pointer; transition: all .15s;
  }
  .friend-item:hover { box-shadow: var(--shadow-md); }
  .friend-item:active { background: var(--primary-light); }
  .friend-avatar {
    width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #fff;
  }
  .friend-info { flex: 1; min-width: 0; }
  .friend-name { font-size: 15px; font-weight: 600; }
  .friend-remark { font-size: 12px; color: var(--text-secondary); }
  .friend-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; align-items: center; }
  .friend-tag {
    display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 10px;
    font-weight: 600; background: var(--primary-light); color: var(--primary);
  }
  .friend-muted { opacity: .6; }
  .friend-blocked { opacity: .5; }

  /* ===== Friend Profile Overlay ===== */
  .profile-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 300;
    display: none; align-items: flex-end; justify-content: center;
  }
  .profile-overlay.open { display: flex; }
  .profile-sheet {
    background: var(--card-bg); border-radius: var(--radius) var(--radius) 0 0;
    width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto;
    animation: slideUp .3s ease; padding: 20px;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .profile-sheet-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  }
  .profile-sheet-title { font-size: 16px; font-weight: 700; }
  .profile-sheet-close {
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: var(--bg); color: var(--text-secondary); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .profile-sheet-avatar {
    width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: #fff;
  }
  .profile-sheet-name { text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .profile-sheet-uid { text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
  .profile-sheet-section { margin-top: 16px; }
  .profile-sheet-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  .profile-sheet-field { margin-bottom: 12px; }
  .profile-sheet-field label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
  .profile-sheet-field input {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
    border-radius: var(--radius-xs); font-size: 14px; font-family: inherit;
    background: var(--bg); color: var(--text); outline: none;
    transition: border-color .2s;
  }
  .profile-sheet-field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
  .profile-sheet-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn-sheet {
    flex: 1; min-width: 80px; padding: 10px 12px; border-radius: var(--radius-xs);
    font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all .2s; text-align: center;
  }
  .btn-sheet-danger { background: #FEF2F2; color: var(--error); border: 1.5px solid var(--error); }
  .btn-sheet-danger:hover { background: var(--error); color: #fff; }
  .btn-sheet-primary { background: var(--primary); color: #fff; }
  .btn-sheet-primary:hover { background: var(--primary-hover); }
  .btn-sheet-outline { background: var(--card-bg); color: var(--text-secondary); border: 1.5px solid var(--border); }
  .btn-sheet-outline:hover { border-color: var(--primary); color: var(--primary); }

  /* ===== Empty State ===== */
  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--text-muted);
  }
  .empty-state.hidden { display: none; }
  .empty-icon { font-size: 56px; margin-bottom: 12px; opacity: .6; }
  .empty-title { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  .empty-sub { font-size: 13px; max-width: 260px; margin: 0 auto; }

  /* ===== Bottom Nav (Community 4-Tab) ===== */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height);
    background: var(--card-bg); border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; align-items: center;
    z-index: 500; padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .bottom-nav .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 12px; cursor: pointer; text-decoration: none;
    color: var(--text-muted); font-size: 11px; font-weight: 500; border: none;
    background: none; min-width: 56px; transition: all .2s;
  }
  .bottom-nav .nav-item .nav-icon { font-size: 22px; line-height: 1; }
  .bottom-nav .nav-item.active { color: var(--primary); font-weight: 700; }
  .bottom-nav .nav-item.active::before {
    content: ''; position: absolute; top: 0; width: 24px; height: 3px;
    background: var(--primary); border-radius: 0 0 3px 3px;
  }

  @media (max-width: 480px) {
    .header { padding: 10px 12px; }
    .header-title { font-size: 15px; }
    .search-bar { padding: 10px 12px; }
    .friend-item { padding: 12px; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <a class="header-back" href="/xuewaiyu/home">&#8592; 返回</a>
  <span class="header-title" data-i18n="friends_title">好友中心</span>
  <button class="header-action" onclick="togglePrivacy()" data-i18n="privacy_settings">隐私设置</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- UID Search -->
<div class="search-bar">
  <input class="search-input" type="text" id="searchUid" placeholder="输入用户UID搜索好友..." data-i18n-placeholder="search_placeholder" onkeydown="if(event.key==='Enter')searchUser()">
  <button class="btn-search" id="btnSearch" onclick="searchUser()" data-i18n="search_btn">搜索</button>
</div>

<!-- Search Result -->
<div class="search-result" id="searchResult">
  <div class="result-top">
    <div class="result-avatar" id="resultAvatar"></div>
    <div class="result-info">
      <div class="result-name" id="resultName"></div>
      <div class="result-uid" id="resultUid"></div>
      <div class="result-meta" id="resultMeta"></div>
    </div>
  </div>
  <div class="result-actions" id="resultActions"></div>
</div>

<!-- Friend List -->
<div class="section-header" data-i18n="my_friends">我的好友</div>
<div class="friend-list" id="friendList"></div>
<div class="empty-state" id="emptyState">
  <div class="empty-icon">👥</div>
  <div class="empty-title" data-i18n="no_friends">暂无好友</div>
  <div class="empty-sub" data-i18n="no_friends_sub">通过UID搜索添加好友，一起学习吧</div>
</div>

<!-- Friend Profile Overlay -->
<div class="profile-overlay" id="profileOverlay" onclick="if(event.target===this)closeProfile()">
  <div class="profile-sheet">
    <div class="profile-sheet-header">
      <span class="profile-sheet-title" data-i18n="friend_info">好友信息</span>
      <button class="profile-sheet-close" onclick="closeProfile()">&#10005;</button>
    </div>
    <div class="profile-sheet-avatar" id="profileAvatar"></div>
    <div class="profile-sheet-name" id="profileName"></div>
    <div class="profile-sheet-uid" id="profileUid"></div>
    <div class="profile-sheet-section">
      <div class="profile-sheet-label" data-i18n="settings">设置</div>
      <div class="profile-sheet-field">
        <label data-i18n="remark_name">备注名</label>
        <input type="text" id="profileRemark" placeholder="设置备注名..." data-i18n-placeholder="remark_placeholder">
      </div>
      <div class="profile-sheet-field">
        <label data-i18n="tags">标签（逗号分隔）</label>
        <input type="text" id="profileTags" placeholder="学习,搭子,日语..." data-i18n-placeholder="tags_placeholder">
      </div>
    </div>
    <div class="profile-sheet-actions">
      <button class="btn-sheet btn-sheet-primary" onclick="saveFriendSetting()" data-i18n="save_settings">保存设置</button>
      <button class="btn-sheet btn-sheet-outline" id="btnToggleMute" onclick="toggleMute()" data-i18n="mute">免打扰</button>
      <button class="btn-sheet btn-sheet-outline" id="btnToggleBlock" onclick="toggleBlock()" data-i18n="block">拉黑</button>
      <button class="btn-sheet btn-sheet-danger" onclick="deleteFriend()" data-i18n="delete_friend">删除好友</button>
    </div>
  </div>
</div>

<!-- Privacy Settings Overlay -->
<div class="profile-overlay" id="privacyOverlay" onclick="if(event.target===this)closePrivacy()">
  <div class="profile-sheet">
    <div class="profile-sheet-header">
      <span class="profile-sheet-title" data-i18n="privacy_settings_title">隐私设置</span>
      <button class="profile-sheet-close" onclick="closePrivacy()">&#10005;</button>
    </div>
    <div class="profile-sheet-section">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)">
        <div>
          <div style="font-weight:600;font-size:14px" data-i18n="allow_uid_search">允许UID搜索</div>
          <div style="font-size:12px;color:var(--text-muted)" data-i18n="allow_uid_search_desc">关闭后其他用户无法通过UID找到你</div>
        </div>
        <label style="position:relative;display:inline-block;width:48px;height:26px">
          <input type="checkbox" id="toggleUidSearch" onchange="savePrivacy()" style="opacity:0;width:0;height:0">
          <span style="position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:26px;transition:.3s" id="toggleUidBg"></span>
          <span style="position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s" id="toggleUidDot"></span>
        </label>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)">
        <div>
          <div style="font-weight:600;font-size:14px" data-i18n="allow_discover">允许被发现</div>
          <div style="font-size:12px;color:var(--text-muted)" data-i18n="allow_discover_desc">关闭后将不会出现在匹配池和推荐列表中</div>
        </div>
        <label style="position:relative;display:inline-block;width:48px;height:26px">
          <input type="checkbox" id="toggleDiscover" onchange="savePrivacy()" style="opacity:0;width:0;height:0">
          <span style="position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:26px;transition:.3s" id="toggleDiscBg"></span>
          <span style="position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s" id="toggleDiscDot"></span>
        </label>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0">
        <div>
          <div style="font-weight:600;font-size:14px" data-i18n="allow_group_invite">允许群邀请</div>
          <div style="font-size:12px;color:var(--text-muted)" data-i18n="allow_group_invite_desc">关闭后不会被邀请加入群聊</div>
        </div>
        <label style="position:relative;display:inline-block;width:48px;height:26px">
          <input type="checkbox" id="toggleGroupInvite" onchange="savePrivacy()" style="opacity:0;width:0;height:0">
          <span style="position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:26px;transition:.3s" id="toggleGrpBg"></span>
          <span style="position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s" id="toggleGrpDot"></span>
        </label>
      </div>
    </div>
  </div>
</div>

<!-- Community 4-Tab Bottom Nav -->
<nav class="bottom-nav" id="communityNav">
  <a class="nav-item" href="/xuewaiyu/home">
    <span class="nav-icon">🏠</span>
    <span data-i18n="nav_home">首页</span>
  </a>
  <a class="nav-item active" href="/xuewaiyu/community-friends.html">
    <span class="nav-icon">👥</span>
    <span data-i18n="nav_friends">好友</span>
  </a>
  <a class="nav-item" href="/xuewaiyu/community-messages.html">
    <span class="nav-icon">💬</span>
    <span data-i18n="nav_messages">消息</span>
  </a>
  <a class="nav-item" href="/xuewaiyu/discover.html">
    <span class="nav-icon">🌐</span>
    <span data-i18n="nav_discover">搭子</span>
  </a>
</nav>

<script>
// ===== i18n =====
var I18N = {
  zh: {
    friends_title:'好友中心',privacy_settings:'隐私设置',search_placeholder:'输入用户UID搜索好友...',search_btn:'搜索',
    my_friends:'我的好友',no_friends:'暂无好友',no_friends_sub:'通过UID搜索添加好友，一起学习吧',
    add_friend:'添加好友',already_friend:'已是好友',blocked_user:'已拉黑',
    friend_info:'好友信息',settings:'设置',remark_name:'备注名',tags:'标签（逗号分隔）',
    remark_placeholder:'设置备注名...',tags_placeholder:'学习,搭子,日语...',
    save_settings:'保存设置',mute:'免打扰',unmute:'取消免打扰',block:'拉黑',unblock:'解除拉黑',
    delete_friend:'删除好友',delete_confirm:'确定要删除该好友吗？',
    privacy_settings_title:'隐私设置',
    allow_uid_search:'允许UID搜索',allow_uid_search_desc:'关闭后其他用户无法通过UID找到你',
    allow_discover:'允许被发现',allow_discover_desc:'关闭后将不会出现在匹配池和推荐列表中',
    allow_group_invite:'允许群邀请',allow_group_invite_desc:'关闭后不会被邀请加入群聊',
    search_result_empty:'未找到用户',search_result_self:'不能搜索自己',
    nav_home:'首页',nav_friends:'好友',nav_messages:'消息',nav_discover:'搭子',
    saved:'保存成功',deleted:'已删除',muted:'已开启免打扰',unmuted:'已关闭免打扰',
    blocked:'已拉黑',unblocked:'已解除拉黑',friend_added:'好友添加成功',
    error_network:'网络错误，请稍后重试',error_unknown:'操作失败',
    search_uid_label:'UID:',lang_label:'学习语言:'
  },
  en: {
    friends_title:'Friends',privacy_settings:'Privacy',search_placeholder:'Search by UID...',search_btn:'Search',
    my_friends:'My Friends',no_friends:'No friends yet',no_friends_sub:'Search by UID to add friends and study together',
    add_friend:'Add Friend',already_friend:'Already Friends',blocked_user:'Blocked',
    friend_info:'Friend Info',settings:'Settings',remark_name:'Remark',tags:'Tags (comma separated)',
    remark_placeholder:'Set remark...',tags_placeholder:'study,partner,Japanese...',
    save_settings:'Save',mute:'Mute',unmute:'Unmute',block:'Block',unblock:'Unblock',
    delete_friend:'Delete Friend',delete_confirm:'Sure to delete this friend?',
    privacy_settings_title:'Privacy Settings',
    allow_uid_search:'Allow UID Search',allow_uid_search_desc:'Others cannot find you by UID if disabled',
    allow_discover:'Allow Discovery',allow_discover_desc:'You will not appear in matching pool if disabled',
    allow_group_invite:'Allow Group Invite',allow_group_invite_desc:'You will not be invited to groups if disabled',
    search_result_empty:'User not found',search_result_self:'Cannot search yourself',
    nav_home:'Home',nav_friends:'Friends',nav_messages:'Messages',nav_discover:'Partners',
    saved:'Saved',deleted:'Deleted',muted:'Muted',unmuted:'Unmuted',
    blocked:'Blocked',unblocked:'Unblocked',friend_added:'Friend Added',
    error_network:'Network error, try again',error_unknown:'Operation failed',
    search_uid_label:'UID:',lang_label:'Learning:'
  }
};

function detectLang() {
  try { var s = localStorage.getItem('yandao_ui_lang_v1'); if (s && I18N[s]) return s; } catch(e) {}
  return 'zh';
}
var currentLang = detectLang();
function t(k) { return (I18N[currentLang] && I18N[currentLang][k]) || (I18N['zh'] && I18N['zh'][k]) || k; }
function updateUI() {
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var k = el.getAttribute('data-i18n'); el.textContent = t(k);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
    el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder')));
  });
}
window.addEventListener('languageChanged', function() {
  currentLang = detectLang(); updateUI(); loadFriends();
});

// ===== API =====
function getToken() {
  try {
    var t = localStorage.getItem('yandao_token_v1'); if (t) return t;
    var a = localStorage.getItem('auth_tokens');
    if (a) { try { var p = JSON.parse(a); return p.accessToken || p.token || a; } catch(e) { return a; } }
  } catch(e) {}
  return null;
}

function apiUrl(path) { return '/api/v1/social' + path; }

async function apiGet(path) {
  var token = getToken(); if (!token) throw new Error('NOT_AUTH');
  var r = await fetch(apiUrl(path), { headers: { 'Authorization': 'Bearer ' + token } });
  var j = await r.json();
  if (j && j.success) return j.data;
  throw new Error(j && j.error ? j.error : 'NET_ERR');
}

async function apiPost(path, body) {
  var token = getToken(); if (!token) throw new Error('NOT_AUTH');
  var r = await fetch(apiUrl(path), {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(body)
  });
  var j = await r.json();
  if (j && j.success) return j.data;
  throw new Error(j && j.error ? j.error : 'NET_ERR');
}

async function apiPut(path, body) {
  var token = getToken(); if (!token) throw new Error('NOT_AUTH');
  var r = await fetch(apiUrl(path), {
    method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify(body)
  });
  var j = await r.json();
  if (j && j.success) return { data: j.data, msg: j.message };
  throw new Error(j && j.error ? j.error : 'NET_ERR');
}

async function apiDelete(path) {
  var token = getToken(); if (!token) throw new Error('NOT_AUTH');
  var r = await fetch(apiUrl(path), { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
  var j = await r.json();
  if (j && j.success) return;
  throw new Error(j && j.error ? j.error : 'NET_ERR');
}

// ===== Toast =====
function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast ' + (type || 'success') + ' show';
  clearTimeout(el._t); el._t = setTimeout(function() { el.classList.remove('show'); }, 3000);
}

// ===== Profile Avatar Color =====
function avatarColor(name) {
  var colors = ['#4F46E5','#7C3AED','#DB2777','#DC2626','#EA580C','#CA8A04','#16A34A','#0891B2','#2563EB','#9333EA'];
  var hash = 0; for (var i = 0; i < (name||'').length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

function avatarText(name) { return (name || '?').charAt(0).toUpperCase(); }

// ===== Search User =====
async function searchUser() {
  var uid = document.getElementById('searchUid').value.trim();
  if (!uid) { showToast(t('search_result_empty'), 'error'); return; }

  var btn = document.getElementById('btnSearch');
  btn.disabled = true; btn.textContent = '...';

  try {
    var user = await apiGet('/friend/search-by-uid?uid=' + encodeURIComponent(uid));
    var resultDiv = document.getElementById('searchResult');
    document.getElementById('resultAvatar').textContent = avatarText(user.nickname || user.uniqueId);
    document.getElementById('resultAvatar').style.background = avatarColor(user.nickname || user.uniqueId);
    document.getElementById('resultName').textContent = user.nickname || user.uniqueId || '未知';
    document.getElementById('resultUid').textContent = t('search_uid_label') + ' ' + (user.uniqueId || 'N/A');
    document.getElementById('resultMeta').textContent = t('lang_label') + ' ' + (user.targetLang || user.nativeLang || '-');
    resultDiv.classList.add('show');

    var actions = document.getElementById('resultActions');
    if (user.isFriend) {
      actions.innerHTML = '<button class="btn-result btn-added" data-i18n="already_friend">' + t('already_friend') + '</button>';
    } else if (user.isBlocked) {
      actions.innerHTML = '<button class="btn-result btn-blocked" data-i18n="blocked_user">' + t('blocked_user') + '</button>';
    } else {
      actions.innerHTML = '<button class="btn-result btn-add" onclick="addFriend(\'' + user.id + '\')" data-i18n="add_friend">' + t('add_friend') + '</button>';
    }
  } catch (e) {
    showToast(e.message === 'NOT_AUTH' ? '请先登录' : (t('search_result_empty')), 'error');
  }
  btn.disabled = false; btn.textContent = t('search_btn');
}

// ===== Add Friend =====
async function addFriend(friendId) {
  try {
    await apiPost('/friend/add', { friendId: friendId });
    showToast(t('friend_added'), 'success');
    document.getElementById('searchResult').classList.remove('show');
    document.getElementById('searchUid').value = '';
    loadFriends();
  } catch (e) { showToast(e.message, 'error'); }
}

// ===== Load Friends =====
async function loadFriends() {
  try {
    var friends = await apiGet('/friend/list');
    if (!Array.isArray(friends)) friends = friends ? (friends.friends || []) : [];
    renderFriendList(friends);
  } catch (e) {
    if (e.message !== 'NOT_AUTH') showToast(t('error_network'), 'error');
  }
}

function renderFriendList(friends) {
  var list = document.getElementById('friendList');
  var empty = document.getElementById('emptyState');

  if (!friends || friends.length === 0) {
    list.innerHTML = ''; empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  var html = '';
  for (var i = 0; i < friends.length; i++) {
    var f = friends[i];
    var name = f.remarkName || f.friendNickname || f.friendUniqueId || '未知';
    var remark = f.remarkName ? (f.friendNickname || f.friendUniqueId || '') : '';
    var muted = f.isMuted ? ' friend-muted' : '';
    var blocked = f.isBlocked ? ' friend-blocked' : '';
    var tags = '';
    try {
      var tList = typeof f.tags === 'string' ? JSON.parse(f.tags) : (f.tags || []);
      for (var j = 0; j < Math.min(tList.length, 3); j++) {
        tags += '<span class="friend-tag">' + tList[j] + '</span>';
      }
    } catch(e) {}

    html += '<div class="friend-item' + muted + blocked + '" onclick="openProfile(\'' + f.id + '\',\'' + f.friendId + '\',\'' + name.replace(/'/g,"\\'") + '\')">';
    html += '<div class="friend-avatar" style="background:' + avatarColor(name) + '">' + avatarText(name) + '</div>';
    html += '<div class="friend-info">';
    html += '<div class="friend-name">' + name + (f.isBlocked ? ' [已拉黑]' : '') + (f.isMuted ? ' [免打扰]' : '') + '</div>';
    if (remark) html += '<div class="friend-remark">' + remark + '</div>';
    html += '<div class="friend-meta">' + tags + '</div>';
    html += '</div>';
    html += '</div>';
  }
  list.innerHTML = html;
}

// ===== Friend Profile Overlay =====
var currentFriendId = null;
var currentFriendData = null;

async function openProfile(settingId, friendId, name) {
  currentFriendId = friendId;
  try {
    // Find friend data from list for pre-fill
    currentFriendData = { id: settingId, friendId: friendId, remarkName: '', tags: [], isMuted: false, isBlocked: false };

    // Get fresh data via API (re-use setting endpoint to fetch friend info)
    // We use the friend list data we already have
    document.getElementById('profileAvatar').textContent = avatarText(name);
    document.getElementById('profileAvatar').style.background = avatarColor(name);
    document.getElementById('profileName').textContent = name;
    document.getElementById('profileUid').textContent = 'UID: ' + (friendId.substring(0, 8) + '...');
    document.getElementById('profileRemark').value = currentFriendData.remarkName || '';
    document.getElementById('profileTags').value = Array.isArray(currentFriendData.tags) ? currentFriendData.tags.join(',') : '';
    document.getElementById('btnToggleMute').textContent = currentFriendData.isMuted ? t('unmute') : t('mute');
    document.getElementById('btnToggleBlock').textContent = currentFriendData.isBlocked ? t('unblock') : t('block');

    document.getElementById('profileOverlay').classList.add('open');
  } catch (e) { showToast(e.message, 'error'); }
}

function closeProfile() {
  document.getElementById('profileOverlay').classList.remove('open');
  currentFriendId = null;
}

async function saveFriendSetting() {
  if (!currentFriendId) return;
  try {
    var remark = document.getElementById('profileRemark').value.trim();
    var tags = document.getElementById('profileTags').value.split(',').map(function(s){return s.trim()}).filter(Boolean);
    await apiPut('/friend/setting', { friendId: currentFriendId, remarkName: remark || undefined, tags: tags });
    showToast(t('saved'), 'success');
    closeProfile(); loadFriends();
  } catch (e) { showToast(e.message, 'error'); }
}

async function toggleMute() {
  if (!currentFriendId) return;
  try {
    var isMuted = currentFriendData.isMuted;
    await apiPut('/friend/setting', { friendId: currentFriendId, isMuted: !isMuted });
    showToast(isMuted ? t('unmuted') : t('muted'), 'success');
    currentFriendData.isMuted = !isMuted;
    document.getElementById('btnToggleMute').textContent = currentFriendData.isMuted ? t('unmute') : t('mute');
  } catch (e) { showToast(e.message, 'error'); }
}

async function toggleBlock() {
  if (!currentFriendId) return;
  try {
    var isBlocked = currentFriendData.isBlocked;
    await apiPut('/friend/setting', { friendId: currentFriendId, isBlocked: !isBlocked });
    showToast(isBlocked ? t('unblocked') : t('blocked'), 'success');
    currentFriendData.isBlocked = !isBlocked;
    document.getElementById('btnToggleBlock').textContent = currentFriendData.isBlocked ? t('unblock') : t('block');
  } catch (e) { showToast(e.message, 'error'); }
}

async function deleteFriend() {
  if (!currentFriendId) return;
  if (!confirm(t('delete_confirm'))) return;
  try {
    await apiDelete('/friend/' + currentFriendId);
    showToast(t('deleted'), 'success');
    closeProfile(); loadFriends();
  } catch (e) { showToast(e.message, 'error'); }
}

// ===== Privacy Settings =====
function togglePrivacy() {
  loadPrivacy();
  document.getElementById('privacyOverlay').classList.add('open');
}

function closePrivacy() {
  document.getElementById('privacyOverlay').classList.remove('open');
}

async function loadPrivacy() {
  try {
    var p = await apiGet('/privacy');
    setToggle('toggleUidSearch', 'toggleUidBg', 'toggleUidDot', p.allowUidSearch !== false);
    setToggle('toggleDiscover', 'toggleDiscBg', 'toggleDiscDot', p.allowDiscover !== false);
    setToggle('toggleGroupInvite', 'toggleGrpBg', 'toggleGrpDot', p.allowGroupInvite !== false);
  } catch (e) {}
}

function setToggle(inputId, bgId, dotId, on) {
  document.getElementById(inputId).checked = on;
  var bg = document.getElementById(bgId);
  var dot = document.getElementById(dotId);
  if (on) { bg.style.background = '#4F46E5'; dot.style.left = '25px'; }
  else { bg.style.background = '#ccc'; dot.style.left = '3px'; }
}

async function savePrivacy() {
  try {
    var allowUidSearch = document.getElementById('toggleUidSearch').checked;
    var allowDiscover = document.getElementById('toggleDiscover').checked;
    var allowGroupInvite = document.getElementById('toggleGroupInvite').checked;
    await apiPut('/privacy', { allowUidSearch: allowUidSearch, allowDiscover: allowDiscover, allowGroupInvite: allowGroupInvite });
    loadPrivacy(); // refresh toggles
    showToast(t('saved'), 'success');
  } catch (e) { showToast(e.message, 'error'); }
}

// ===== Init =====
function init() {
  updateUI();
  loadFriends();
  // Listen for language changes
  window.addEventListener('languageChanged', function() {
    currentLang = detectLang(); updateUI(); initNavI18n();
  });
  initNavI18n();
}

function initNavI18n() {
  var socialI18n = {
    zh: { nav_home:'首页',nav_friends:'好友',nav_messages:'消息',nav_discover:'搭子' },
    en: { nav_home:'Home',nav_friends:'Friends',nav_messages:'Messages',nav_discover:'Partners' },
    ja: { nav_home:'ホーム',nav_friends:'友達',nav_messages:'メッセージ',nav_discover:'パートナー' },
    ko: { nav_home:'홈',nav_friends:'친구',nav_messages:'메시지',nav_discover:'파트너' }
  };
  var map = socialI18n[currentLang] || socialI18n.zh;
  document.querySelectorAll('#communityNav [data-i18n]').forEach(function(el) {
    var k = el.getAttribute('data-i18n');
    if (map[k]) el.textContent = map[k];
  });
}

init();
